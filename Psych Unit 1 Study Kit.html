<style>
/* Layout: a study bench — one column, sticky deck filter, three tools (guide, flashcards, quiz) sharing one mastery record */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#f8f9fb; --ink:#15202b; --muted:#566373; --line:#d8dee6;
  --accent:#2a55c8; --accent-ink:#ffffff; --accent-soft:#e2e9fb;
  --good:#1d7f55; --good-soft:#dcf1e7; --bad:#b93a26; --bad-soft:#f9e1dc; --warn-soft:#fbf1cf; --warn-ink:#6b5208;
  --d-neuron:#c2410c; --d-nt:#7c3aed; --d-ns:#0f766e; --d-brain:#be185d; --d-vision:#1d4ed8; --d-senses:#a16207; --d-split:#4d7c0f; --d-sleep:#c026d3; --d-perception:#0e7490; --d-research:#4338ca; --d-perspectives:#e11d48; --d-stats:#475569; --d-health:#0369a1; --d-disorders:#9333ea; --d-anxiety:#b45309; --d-mood:#1e40af; --d-neurodev:#15803d; --d-dissoc:#0e7490; --d-schizo:#047857; --d-ocdptsd:#a21caf; --d-eating:#db2777; --d-personality:#92400e; --d-treatment:#0f766e;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#161f29; --surface-2:#1b2633; --ink:#e7ecf1; --muted:#97a4b2; --line:#2a3745;
  --accent:#86a6ff; --accent-ink:#0e141b; --accent-soft:#1c2a47;
  --good:#52c98f; --good-soft:#143326; --bad:#ff8d76; --bad-soft:#3a1d18; --warn-soft:#3a3115; --warn-ink:#f1d675;
  --d-neuron:#fb923c; --d-nt:#a78bfa; --d-ns:#2dd4bf; --d-brain:#f472b6; --d-vision:#60a5fa; --d-senses:#facc15; --d-split:#a3e635; --d-sleep:#e879f9; --d-perception:#22d3ee; --d-research:#a5b4fc; --d-perspectives:#fb7185; --d-stats:#cbd5e1; --d-health:#38bdf8; --d-disorders:#c084fc; --d-anxiety:#fbbf24; --d-mood:#93c5fd; --d-neurodev:#4ade80; --d-dissoc:#67e8f9; --d-schizo:#34d399; --d-ocdptsd:#f0abfc; --d-eating:#f9a8d4; --d-personality:#fdba74; --d-treatment:#5eead4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#161f29; --surface-2:#1b2633; --ink:#e7ecf1; --muted:#97a4b2; --line:#2a3745;
  --accent:#86a6ff; --accent-ink:#0e141b; --accent-soft:#1c2a47;
  --good:#52c98f; --good-soft:#143326; --bad:#ff8d76; --bad-soft:#3a1d18; --warn-soft:#3a3115; --warn-ink:#f1d675;
  --d-neuron:#fb923c; --d-nt:#a78bfa; --d-ns:#2dd4bf; --d-brain:#f472b6; --d-vision:#60a5fa; --d-senses:#facc15; --d-split:#a3e635; --d-sleep:#e879f9; --d-perception:#22d3ee; --d-research:#a5b4fc; --d-perspectives:#fb7185; --d-stats:#cbd5e1; --d-health:#38bdf8; --d-disorders:#c084fc; --d-anxiety:#fbbf24; --d-mood:#93c5fd; --d-neurodev:#4ade80; --d-dissoc:#67e8f9; --d-schizo:#34d399; --d-ocdptsd:#f0abfc; --d-eating:#f9a8d4; --d-personality:#fdba74; --d-treatment:#5eead4;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.55}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.7rem,4.5vw,2.4rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:grid;gap:14px;margin-bottom:18px}
.meter{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bar{flex:1 1 220px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.meter b{font-variant-numeric:tabular-nums}

.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:10px;border-bottom:1px solid var(--line);margin-bottom:22px}
.sticky{grid-template-columns:minmax(0,1fr)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none}
@media (max-width:560px){.tabs button{padding:8px 10px;font-size:.92rem}}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:999px;font-weight:700}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:.88rem}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
#chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
#chips .chip{flex:none}
.chip.unit{font-weight:700;border-style:dashed}
.unit-head{font-family:var(--display);font-size:1.7rem;font-weight:800;margin:6px 0 18px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.chip small{font-family:var(--mono);font-size:.7rem;opacity:.8;font-variant-numeric:tabular-nums}

/* Guide */
.deck{margin-bottom:40px}
.deck-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.deck-head .dot{width:12px;height:12px;align-self:center}
.deck-sub{color:var(--muted);margin:0 0 16px;max-width:65ch}
.chain{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.chain ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chain li{display:flex;align-items:center;gap:6px}
.chain li span{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:.9rem}
.chain li+li::before{content:"→";color:var(--muted)}
.tree{font-family:var(--mono);font-size:.82rem;line-height:1.7;white-space:pre;overflow-x:auto;margin:8px 0 0}
.sec{margin:22px 0 8px}
.rows{display:grid;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:6px 16px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start}
.row .t{font-weight:700}
.row .x{min-width:0}
.hook{display:block;margin-top:4px;font-size:.88rem;color:var(--accent)}
.know{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:.78rem;white-space:nowrap}
.know[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
@media (max-width:560px){.row{grid-template-columns:1fr auto}.row .x{grid-column:1 / -1;grid-row:2}}
.watch{background:var(--warn-soft);color:var(--warn-ink);border-radius:var(--r);padding:12px 14px;margin-top:16px;font-size:.93rem}
.watch b{display:block;margin-bottom:2px}
.compare{width:100%;border-collapse:collapse;font-size:.92rem;min-width:520px}
.compare th,.compare td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.compare th{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:12px}

/* Flashcards */
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toggle{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.small{padding:6px 10px;font-size:.85rem;font-weight:400}
.btn[aria-pressed="true"]{border-color:var(--ink)}
.card{width:100%;min-height:260px;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:28px 24px;display:grid;place-items:center;text-align:center;box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgba(0,0,0,.35);position:relative}
.card .face{max-width:58ch}
.card .big{font-family:var(--display);font-size:clamp(1.6rem,5vw,2.3rem);font-weight:800;letter-spacing:-.01em;line-height:1.15}
.card .def{font-size:1.08rem}
.card .corner{position:absolute;top:14px;left:16px;display:flex;gap:7px;align-items:center}
.card .flipnote{position:absolute;bottom:12px;left:0;right:0;font-size:.8rem;color:var(--muted)}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fc-actions .btn{padding:13px}
.kbd{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:10px;text-align:center}
.done{text-align:center;padding:40px 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px}

/* Quiz */
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qprompt{font-size:1.15rem;font-weight:700;margin:0 0 16px;max-width:65ch}
.qprompt .ask{display:block;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:6px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.opt .k{font-family:var(--mono);font-size:.78rem;border:1px solid var(--line);border-radius:6px;padding:1px 7px;flex:none;margin-top:2px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.opt:disabled{cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.explain b.ok{color:var(--good)} .explain b.no{color:var(--bad)}
.qnav{display:flex;justify-content:flex-end;margin-top:14px}
.setup{display:grid;gap:16px}
.setup p{margin:0;color:var(--muted);max-width:65ch}
.score{font-family:var(--display);font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums}
.missed{display:grid;gap:8px;margin-top:14px;text-align:left}
.missed div{border-left:3px solid var(--bad);padding:6px 12px;background:var(--surface-2);border-radius:0 8px 8px 0;font-size:.93rem}
.empty{color:var(--muted);padding:20px 0}

/* Settings */
.set-group{display:grid;gap:18px}
.set-group+.set-group{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.set-row{display:grid;gap:7px}
.set-row p{margin:0;color:var(--muted);font-size:.9rem;max-width:65ch}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad);font-weight:700}
.qcount{width:5.5em;font:inherit;color:inherit;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="label">AP Psychology · Units 0, 1 &amp; 5</div>
      <h1>Psych Study Kit</h1>
    </div>
    <div class="meter">
      <div class="bar" aria-hidden="true"><i id="mbar" style="width:0%"></i></div>
      <span><b id="mcount">0</b> of <b id="mtotal">0</b> terms marked “got it”</span>
      <button class="btn small" id="reset">Reset progress</button>
    </div>
  </header>

  <div class="sticky">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="learn" aria-selected="true">Learn</button>
      <button role="tab" data-tab="guide" aria-selected="false">Study guide</button>
      <button role="tab" data-tab="cards" aria-selected="false">Flashcards</button>
      <button role="tab" data-tab="quiz" aria-selected="false">Quiz</button>
      <button role="tab" data-tab="settings" aria-selected="false" aria-label="Settings">⚙︎ Settings</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <main id="view"></main>
</div>

<script>
const DECKS = [
  {id:'neuron', name:'The Neuron', sub:'Parts of a neuron, how it fires, and two diseases that disrupt it.'},
  {id:'nt', name:'Neurotransmitters', sub:'Excitatory vs. inhibitory, and what each chemical does — plus what too much or too little looks like.'},
  {id:'ns', name:'Nervous & Endocrine Systems', sub:'How the nervous system is divided, the three neuron types, and the hormones you need to know.'},
  {id:'brain', name:'The Brain', sub:'Old brain, limbic system, the four lobes (F-POT), lateralization, plasticity, and brain scans.'},
  {id:'vision', name:'Vision', sub:'The path light takes, rods and cones, color theories, Gestalt grouping, and depth cues.'},
  {id:'senses', name:'Hearing, Smell, Taste, Touch & more', sub:'Sound waves, hearing loss, balance, smell, taste, pain, and unusual perception.'},
  // Optional decks stay out of "All decks", the main progress meter, and the final mixed quiz. Keep them last so saved card/lesson ids never shift.
  {id:'split', opt:true, name:'Optional: Split Brain', sub:'Optional extra from the Brain Lateralization & Split Brain slides. Your teacher said it may help on the test. Builds on the Hemispheres section of The Brain.'},
  {id:'sleep', name:'Sleep, Consciousness & Drugs', sub:'Everything on the Sleep, Consciousness, and Drugs slides: sleep, circadian rhythm, sleep loss, sleep disorders, how drugs work, the four drug categories, and addiction.'},
  {id:'perception', name:'Perception', sub:'Everything on the Perception slides: attention and what we miss, top-down vs. bottom-up processing, thresholds and Weber\'s law, and ESP.'},
  {id:'research', name:'Research Methods', sub:'Everything on the Unit 0 Research Methods slides: why intuition fails, the scientific method, operational definitions, descriptive and correlational research, experiments, problems with research, and ethics.'},
  {id:'perspectives', name:'Perspectives in Psychology', sub:'The 7 psychological perspectives from the 0.3 slides, what each one focuses on, and how to apply them to a scenario.'},
  {id:'stats', name:'Statistics & Data', sub:'Everything on the 0.11 Statistical Reasoning slides: histograms, mean/median/mode, percentile rank, range, standard deviation, skew, bimodal curves, and inferential statistics.'},
  {id:'health', name:'Health Psychology', sub:'Stress and cortisol, eustress vs. distress, ACEs, General Adaptation Syndrome, tend-and-befriend, and the two kinds of coping.'},
  {id:'disorders', name:'Intro to Psychological Disorders', sub:'When something counts as a disorder (the 3 Ds), the DSM-5, how each approach explains disorders, and intern syndrome.'},
  {id:'anxiety', name:'Anxiety Disorders', sub:'Specific phobias, agoraphobia, panic disorder, social anxiety disorder, GAD, and their causes.'},
  {id:'mood', name:'Depressive & Bipolar Disorders', sub:'Major depressive disorder, persistent depressive disorder, Bipolar I vs. II, manic and depressive episodes, and causes.'},
  {id:'neurodev', name:'Neurodevelopmental Disorders', sub:'ADHD (symptoms and diagnosis rules) and autism spectrum disorder, plus their causes.'},
  {id:'dissoc', name:'Dissociative Disorders', sub:'Dissociative amnesia, fugue states, and dissociative identity disorder.'},
  {id:'schizo', name:'Schizophrenia Spectrum', sub:'Positive and negative symptoms, causes, the dopamine hypothesis, and the diathesis-stress model.'},
  {id:'ocdptsd', name:'OCD & Trauma Disorders', sub:'Obsessive-compulsive and related disorders (OCD, hoarding), their causes, and PTSD.'},
  {id:'eating', name:'Feeding & Eating Disorders', sub:'Anorexia nervosa, bulimia nervosa, and the causes of eating disorders.'},
  {id:'personality', name:'Personality Disorders', sub:'What a personality disorder is, the three clusters (A, B, C), all 10 disorders, and causes.'},
  {id:'treatment', name:'Treatment', sub:'History of treatment, biomedical therapies and medications, psychotherapy, ethics, and psychodynamic, humanistic, cognitive, behavioral, and CBT therapies.'}
];
// Storage order above must never change (saved lessons are numbered by it). Units set the order decks are shown in.
const UNITS = [
  {id:'u0', name:'Unit 0', decks:['perspectives','research','stats']},
  {id:'u1', name:'Unit 1', decks:['neuron','nt','ns','brain','vision','senses','sleep','split']},
  {id:'u5', name:'Unit 5', decks:['health','disorders','anxiety','mood','neurodev','dissoc','schizo','ocdptsd','eating','personality','treatment']},
  {id:'u2', name:'Other', decks:['perception']}
];
UNITS.forEach(u=>u.decks.forEach(id=>{DECKS.find(d=>d.id===id).unit=u.id}));
const unitById = Object.fromEntries(UNITS.map(u=>[u.id,u]));
const DECK_VIEW = UNITS.flatMap(u=>u.decks.map(id=>DECKS.find(d=>d.id===id)).sort((a,b)=>!!a.opt-!!b.opt));

// [deck, section, term, definition, hook?]
const RAW = [
['neuron','Parts of a neuron','Neuron','A nerve cell; the basic building block of the brain and nervous system. Hundreds of billions form networks throughout the body.'],
['neuron','Parts of a neuron','Glial cells (glia)','Support cells in the brain that nourish and protect neurons. Your slides say there are about 50x more of them than neurons.','"Glia" = glue: they hold the system together.'],
['neuron','Parts of a neuron','Dendrites','Branch-like structures extending from the cell body. Their receptors receive chemical signals from other neurons.','Dendrites = Detect.'],
['neuron','Parts of a neuron','Soma','The cell body. Holds the nucleus, keeps the cell alive, and decides when the neuron will fire.'],
['neuron','Parts of a neuron','Axon','The long pathway an electrical impulse travels down when the neuron fires.','Axon = Away from the cell body.'],
['neuron','Parts of a neuron','Myelin sheath','Fatty coating that protects the axon and speeds up the electrical signal.','Like insulation on a wire.'],
['neuron','Parts of a neuron','Terminal branches','The frayed ends of the axon. Each one ends in a terminal button.'],
['neuron','Parts of a neuron','Terminal buttons','Knobs at the ends of the terminal branches that hold the vesicles.'],
['neuron','Parts of a neuron','Vesicles','Tiny sacs in the terminal buttons that store neurotransmitters.'],
['neuron','Parts of a neuron','Synapse','The gap between two neurons (also called the synaptic cleft or synaptic gap). Neurons never actually touch.'],
['neuron','Firing a neuron','Resting potential','The neuron is not firing; its dendrites are waiting to receive neurotransmitters.'],
['neuron','Firing a neuron','Threshold','The level of stimulation the dendrites must receive before the neuron will fire.'],
['neuron','Firing a neuron','Action potential','The electrical signal that the soma starts once threshold is reached; it travels down the axon.'],
['neuron','Firing a neuron','All-or-none principle','A neuron either fires completely or not at all. It never partially fires, and a stronger stimulus does not make a stronger firing.','Like a gun: you either pull the trigger or you don\'t.'],
['neuron','Firing a neuron','Reuptake','Leftover neurotransmitters in the synapse get reabsorbed by the neuron that released them.'],
['neuron','Firing a neuron','Refractory period','The recovery time after firing when the neuron cannot fire again, no matter how many neurotransmitters it receives.','Like a toilet: you have to wait to flush again.'],
['neuron','Diseases','Multiple sclerosis (MS)','Disease caused by deterioration of the myelin sheath (demyelination). Causes trouble with movement and walking.','MS = Myelin Sheath.'],
['neuron','Diseases','Myasthenia gravis','Autoimmune disorder where antibodies block or destroy the muscles\' receptor sites for acetylcholine, causing muscle weakness.'],

['nt','Basics','Neurotransmitter','A chemical messenger released into the synapse that carries a signal from one neuron to the next.'],
['nt','Basics','Excitatory','Describes a neurotransmitter that makes the next neuron more likely to fire.','Excite = Go.'],
['nt','Basics','Inhibitory','Describes a neurotransmitter that keeps the next neuron from firing.','Inhibit = Stop.'],
['nt','The chemicals','Acetylcholine (ACh)','Mainly controls movement (muscle action) and also plays a role in memory. Found in both the central and peripheral nervous systems. Too little is linked to Alzheimer\'s; too much causes muscle spasms; blocked receptors cause paralysis.','ACh = ACTion (muscles) + Alzheimer\'s.'],
['nt','The chemicals','Dopamine','The "pleasure chemical": reward pathway, anticipating something good, movement, alertness, and motor coordination. Low levels are linked to Parkinson\'s and addictive behaviors; high levels are linked to schizophrenia.','Low = Parkinson\'s shakes. High = schizophrenia.'],
['nt','The chemicals','Serotonin','Affects mood, emotion, appetite, and sleep. High levels mean more happiness; low levels are linked to depression, anger-control problems, and OCD.'],
['nt','The chemicals','SSRI','Selective serotonin reuptake inhibitor. An antidepressant that blocks reuptake so serotonin stays in the synapse longer.'],
['nt','The chemicals','Norepinephrine','Acts as both a neurotransmitter and a hormone (noradrenaline). Drives the sympathetic fight-or-flight response, plus focus, attention, and quick decisions. High levels are linked to developing fears; low levels to depression and ADHD.'],
['nt','The chemicals','GABA','Gamma-aminobutyric acid: the primary inhibitory neurotransmitter. A natural tranquilizer that calms the nervous system. Too little is linked to anxiety disorders; too much causes sleepiness.','GABA = Gotta Always Be Asleep.'],
['nt','The chemicals','Glutamate','The major excitatory neurotransmitter. Involved in thinking, memory, and learning. Too much is linked to high anxiety, OCD, and migraines.','Glutamate = Go.'],
['nt','The chemicals','Endorphins','The brain\'s natural painkillers, released by the pituitary gland. Relieve pain and stress; example: runner\'s high.','"Endogenous morphine."'],
['nt','The chemicals','Substance P','Involved in pain regulation (sending pain signals). Levels rise with stress, heat, and painful stimuli.','P = Pain.'],

['ns','Functions & neurons','Three functions of the nervous system','Sensory input (gather info from the senses), integration (the brain processes it and decides), and motor output (signals go to muscles and glands).'],
['ns','Functions & neurons','Sensory (afferent) neurons','Carry messages from sensory receptors in to the brain and spinal cord.','Afferent = Arrive.'],
['ns','Functions & neurons','Motor (efferent) neurons','Carry signals from the brain and spinal cord out to muscles and organs.','Efferent = Exit.'],
['ns','Functions & neurons','Interneurons','Relay neurons in the brain and spinal cord that connect sensory and motor neurons and pass information between them.','Inter = in between.'],
['ns','Divisions','Central nervous system (CNS)','The brain and the spinal cord.'],
['ns','Divisions','Spinal cord','The "highway" connecting the brain to the rest of the body; sends messages both ways.'],
['ns','Divisions','Peripheral nervous system (PNS)','All the nerves outside the brain and spinal cord, connecting them to the rest of the body.'],
['ns','Divisions','Nerves','Bundles of neurons that act like wires carrying messages to and from the brain and spinal cord.'],
['ns','Divisions','Somatic nervous system','Part of the peripheral system that controls voluntary movements, like walking or picking up a pencil.','Soma = body you move on purpose.'],
['ns','Divisions','Autonomic nervous system','Part of the peripheral system that controls involuntary actions like heartbeat and digestion. Split into sympathetic and parasympathetic.','Autonomic = automatic.'],
['ns','Divisions','Sympathetic nervous system','Arouses the body: the fight, flight, or freeze response.','Sympathetic = Stressed.'],
['ns','Divisions','Parasympathetic nervous system','Calms the body back down: rest and digest.','Parasympathetic = Peace (or a Parachute down).'],
['ns','Divisions','Reflex','A simple, automatic response to a stimulus (like the knee-jerk), directed by the spinal cord instead of the brain, which makes it faster.'],
['ns','Endocrine system','Endocrine system','The system of glands that releases and regulates hormones.'],
['ns','Endocrine system','Hormones vs. neurotransmitters','Hormones travel through the bloodstream, so they act more slowly than neurotransmitters, but their effects last longer.'],
['ns','Endocrine system','Pituitary gland','The "master gland." Regulates stress, growth, and reproduction and signals the other glands to release their hormones.'],
['ns','Endocrine system','Adrenaline','Hormone from the adrenal glands (on top of the kidneys). Raises heart rate, blood pressure, and blood sugar for the fight-or-flight energy surge.'],
['ns','Endocrine system','Ghrelin','Hunger hormone made in the stomach; tells the body you are hungry.','Ghrelin = Growling stomach.'],
['ns','Endocrine system','Leptin','Hormone that tells the body you are full (satiety). Your slides say it is made in the small intestine.','Leptin = Leave the table.'],
['ns','Endocrine system','Testosterone','Sex hormone made in the testes and ovaries; the hormone most responsible for sex drive. Men have more. Too much is linked to aggression.'],
['ns','Endocrine system','Estrogen','Sex hormone important for reproduction; women have more of it.'],
['ns','Endocrine system','Oxytocin','The "love" or social-bonding hormone. Made by the hypothalamus and released by the pituitary. Important in labor, mother–baby bonding, and bonding with friends and partners. Low levels are linked to postpartum depression.'],
['ns','Endocrine system','Melatonin','Hormone from the pineal gland, released in response to darkness. Regulates circadian rhythm (sleep-wake cycle) and helps you sleep.'],

['brain','Old brain','Brainstem','The medulla plus the pons; handles automatic survival functions.'],
['brain','Old brain','Medulla','Base of the brainstem; controls life-sustaining functions like breathing and heartbeat.','Medulla = Most important (keeps you alive).'],
['brain','Old brain','Pons','Connects the spinal cord to the brain; involved in automatic processes, especially the sleep-wake cycle.','Pons = bridge (French "pont").'],
['brain','Old brain','Reticular formation','Network in the brainstem (part of the pons, per your slides) that controls arousal and consciousness. Damage can cause a coma.'],
['brain','Old brain','Thalamus','Sits on top of the brainstem; the brain\'s sensory relay station. All senses except smell get routed through it.','Thalamus = sensory switchboard.'],
['brain','Old brain','Cerebellum','"Little brain" at the back. Handles fine motor control, coordination, posture, and balance, plus learned motor skills like riding a bike. Alcohol strongly affects it.','Cerebellum = balance (think "bell" ringing while you wobble).'],
['brain','Limbic system','Limbic system','Brain structures involved in emotion and long-term memory: the amygdala, hippocampus, and hypothalamus.'],
['brain','Limbic system','Amygdala','Processes emotion, especially fear and aggression. Triggers fight-or-flight, helps read others\' emotions, and helps store emotional memories.','Two almonds of fear.'],
['brain','Limbic system','Hippocampus','Helps store information into long-term memory. One of the first areas damaged by Alzheimer\'s.','A hippo never forgets.'],
['brain','Limbic system','Hypothalamus','Regulates the autonomic nervous system and monitors body temperature, thirst, hunger, and sexual responses.','The 4 Fs: feeding, fighting, fleeing, and mating.'],
['brain','Limbic system','Lateral hypothalamus (LH)','Part of the hypothalamus that triggers feelings of hunger. Damage → loss of hunger.','Lateral = Lunch.'],
['brain','Limbic system','Ventromedial hypothalamus (VMH)','Part of the hypothalamus that signals fullness. Damage → overeating.','Ventromedial = Very full.'],
['brain','Cerebral cortex','Cerebral cortex','The wrinkled outer layer of the brain, split into a left and right hemisphere. Its four lobes: frontal, parietal, occipital, temporal (F-POT).'],
['brain','Cerebral cortex','Frontal lobe','Front of the brain; home of the prefrontal cortex, motor cortex, and Broca\'s area.'],
['brain','Cerebral cortex','Prefrontal cortex','Front of the frontal lobe; executive functions — judgment, planning, reasoning, problem solving, moral judgment, and personality.'],
['brain','Cerebral cortex','Motor cortex','Strip at the rear of the frontal lobe that controls voluntary movement.','Motor is in front of Sensory (somatosensory) — "M before S."'],
['brain','Cerebral cortex','Broca\'s area','Left frontal lobe, next to the motor cortex; controls speech production.','Broca = broken speech.'],
['brain','Cerebral cortex','Broca\'s aphasia','Difficulty producing speech; sentences are short and simple, often just a noun and a verb, but understanding is mostly fine.'],
['brain','Cerebral cortex','Phineas Gage','Railroad worker who had an iron rod driven through his prefrontal cortex. His personality changed: irritable, profane, dishonest, poor emotional control.'],
['brain','Cerebral cortex','Parietal lobe','Top of the brain; processes body sensations (touch, pressure, temperature, pain) and spatial orientation.'],
['brain','Cerebral cortex','Somatosensory cortex','Strip in the parietal lobe, directly behind the motor cortex, that registers touch and body movement sensations.'],
['brain','Cerebral cortex','Temporal lobe','Side of the brain, above the ears; hearing, language processing, and long-term memory storage.','Temporal = by your temples, near your ears.'],
['brain','Cerebral cortex','Primary auditory cortex','Area in the temporal lobe where hearing is processed.'],
['brain','Cerebral cortex','Wernicke\'s area','Temporal lobe area for comprehending written and spoken language.','Wernicke = words don\'t make sense.'],
['brain','Cerebral cortex','Wernicke\'s aphasia','Difficulty understanding and expressing language; speech can flow but makes little sense.'],
['brain','Cerebral cortex','Occipital lobe','Back of the brain; processes visual information. Has neurons that recognize lines, angles, shapes, and movement. Damage can cause blindness.','Occipital = Optical.'],
['brain','Hemispheres','Corpus callosum','Large band of neural fibers connecting the left and right hemispheres so they can communicate.'],
['brain','Hemispheres','Brain lateralization','The tendency for certain functions to be specialized to one side of the brain.'],
['brain','Hemispheres','Contralateral control','Each side of the brain controls the opposite side of the body: right brain → left body, left brain → right body.'],
['brain','Hemispheres','Left hemisphere','Speech, language, and comprehension; math calculations; time and sequencing; recognizing words, letters, and numbers; controls the right side of the body.','Left = Language and Logic.'],
['brain','Hemispheres','Right hemisphere','Spatial ability; recognizing faces, places, and objects; perceiving and expressing emotion; tone and emphasis in speech; controls the left side of the body.'],
['brain','Change & damage','Plasticity','The brain\'s ability to change — reorganizing after damage or building new pathways through experience. Example: in a blind Braille reader, touch takes over parts of the visual cortex.','Plastic = moldable.'],
['brain','Change & damage','Neurogenesis','The formation of new neurons. Only happens in two areas (one for memory, one for smell); usually a destroyed neuron cannot be replaced.'],
['brain','Brain scans','EEG','Electroencephalogram: electrodes on the scalp record the brain\'s electrical activity (brain waves). Used to find seizures.','E = Electrical.'],
['brain','Brain scans','PET scan','Positron emission tomography: radioactive glucose is injected and the scan shows where it is being used — which regions are active.'],
['brain','Brain scans','CT scan','X-rays that show brain structure — the shape and position of structures. Helps find tumors.'],
['brain','Brain scans','MRI','Magnetic resonance imaging: strong magnetic pulses build a detailed picture of brain structure (tissue, tumors, clots).'],
['brain','Brain scans','fMRI','Functional MRI: shows brain function by measuring blood flow and oxygen use. More precise than PET.','f = function.'],

['vision','The eye','Cornea','Clear, protective outer layer where light first enters the eye.'],
['vision','The eye','Iris','Colored muscle that surrounds the pupil and controls its size. Unique enough to identify you (iris scanners).'],
['vision','The eye','Pupil','Small adjustable opening that lets light through.'],
['vision','The eye','Lens','Transparent structure behind the pupil that changes shape to focus images on the retina.'],
['vision','The eye','Accommodation','The lens changing shape to focus on near or far objects.'],
['vision','The eye','Retina','Light-sensitive inner surface at the back of the eye containing rods and cones. Where transduction happens.'],
['vision','The eye','Transduction','Converting one form of energy (like light) into neural impulses the brain can understand.'],
['vision','The eye','Rods','Retina receptors for black-and-white vision; let you see in dim light.','Rods = Reduced light.'],
['vision','The eye','Cones','Retina receptors for color and fine detail; work poorly in dim light.','Cones = Color.'],
['vision','The eye','Dark adaptation','In darkness the pupils dilate to let more light reach the retina; it takes about 20 minutes.'],
['vision','The eye','Bipolar cells','Connect the rods and cones to the ganglion cells.'],
['vision','The eye','Ganglion cells','Cells whose axons bundle together to form the optic nerve.'],
['vision','The eye','Optic nerve','Carries neural impulses from the eye to the brain.'],
['vision','In the brain','Primary visual cortex','Where visual input is first processed; located in the occipital lobe.'],
['vision','In the brain','Feature detectors','Neurons in the visual cortex that respond to specific features like shape, angle, or movement.'],
['vision','In the brain','Parallel processing','Processing many aspects of a stimulus (color, motion, form, depth) at the same time, then combining them into one image.'],
['vision','Color','Trichromatic theory','The retina has three types of color receptors — red, green, and blue — that combine to produce any color. Explains color at the retina level.','Tri = three cones.'],
['vision','Color','Color blindness','Inability to see colors normally, usually from impaired red or green cones (rarely blue).'],
['vision','Color','Opponent-process theory','Color is processed by opposing pairs — red/green, yellow/blue, white/black — and a cell can signal only one of each pair at a time. Explains color in the brain and afterimages.'],
['vision','Color','Afterimage','A visual image that persists after the stimulus is removed — e.g., stare at green, then see red on a white wall.'],
['vision','Color','Which color theory is right?','Both. Trichromatic explains how the retina detects color; opponent-process explains how the brain processes it.'],
['vision','Gestalt','Gestalt','An organized whole. Gestalt psychologists said we combine pieces of information into meaningful wholes (you see a face, not a set of lines).'],
['vision','Gestalt','Proximity','Grouping objects that are close together (how you see separate words on a page).'],
['vision','Gestalt','Similarity','Grouping objects that look alike.'],
['vision','Gestalt','Closure','Filling in gaps to see a complete, closed shape.'],
['vision','Gestalt','Figure-ground','Organizing what you see into objects (figures) that stand out from their surroundings (ground).'],
['vision','Depth','Depth perception','The ability to judge how far away an object is.'],
['vision','Depth','Binocular cues','Depth cues that need both eyes.','Bi = two eyes.'],
['vision','Depth','Retinal disparity','A binocular cue: because your eyes are about 2.5 inches apart, each retina gets a slightly different image; the bigger the difference, the closer the object.'],
['vision','Depth','Monocular cues','Depth cues that work with just one eye; used for farther distances.','Mono = one eye.'],
['vision','Depth','Relative size','Monocular cue: if two objects are assumed to be the same size, the one that looks smaller seems farther away.'],
['vision','Depth','Interposition','Monocular cue: an object that blocks part of another is seen as closer.'],
['vision','Depth','Linear perspective','Monocular cue: parallel lines seem to converge in the distance (train tracks).'],
['vision','Depth','Relative clarity','Monocular cue: sharp, clear objects seem closer; hazy ones seem farther away.'],

['senses','Hearing','Audition','The sense of hearing.'],
['senses','Hearing','Amplitude','The height of a sound wave; determines loudness. High amplitude = loud.','Amplitude = Amplifier (volume).'],
['senses','Hearing','Frequency','Number of wavelengths passing a point in a given time; determines pitch. High frequency = high pitch; low frequency = bass.'],
['senses','Hearing','Sound localization','Telling where a sound comes from: the nearer ear hears it slightly louder and slightly sooner.'],
['senses','Hearing','Eardrum','Membrane between the outer and middle ear that vibrates when sound waves hit it. (Standard ear part; check the ear diagram slide.)'],
['senses','Hearing','Ossicles','Three tiny bones in the middle ear (hammer, anvil, stirrup) that pass vibrations to the cochlea. (Check the ear diagram slide.)'],
['senses','Hearing','Cochlea','Snail-shaped, fluid-filled tube in the inner ear whose hair cells turn vibrations into neural signals. (Check the ear diagram slide.)'],
['senses','Hearing','Conduction hearing loss','Damage to the parts that conduct sound through the outer and middle ear (eardrum, ossicles, auditory canal). Can be fixed with surgery.','Conduction = Correctable.'],
['senses','Hearing','Sensorineural hearing loss','Nerve deafness: damage to the cochlea\'s hair cells or the auditory nerve (inner ear). Cannot be reversed.'],
['senses','Hearing','Cochlear implant','Device wired into the cochlea that turns sounds into electrical signals sent up the auditory nerve. Used for sensorineural hearing loss.'],
['senses','Body position','Vestibular sense','Senses the head\'s position and movement (balance) using fluid in the semicircular canals and vestibular sacs. Signals go to the cerebellum. The fluid keeps moving after you stop, which causes dizziness.','Vestibular = balance in the ear.'],
['senses','Body position','Kinesthesis','Senses the position and movement of individual body parts using sensors in muscles, tendons, and joints; feeds the cerebellum.','Kinesthesis = kinetic body parts.'],
['senses','Smell & taste','Olfaction','The sense of smell. Receptors at the top of the nasal cavity detect inhaled particles. Smell skips the thalamus and goes to areas connected to the limbic system.'],
['senses','Smell & taste','Gustation','The sense of taste. The tongue has about 200 taste buds, each with 50–100 receptors; taste buds regenerate about every two weeks.'],
['senses','Smell & taste','Five basic tastes','Sweet, sour, salty, bitter, and umami (savory/protein).'],
['senses','Smell & taste','Supertasters','People with more taste buds than average, who experience tastes and pain more intensely (e.g., jalapeños burn more).'],
['senses','Smell & taste','Sensory interaction','One sense influencing another — like smell affecting taste (holding your nose to take bad medicine).'],
['senses','Touch & pain','Touch','A mix of four skin senses: pressure, warmth, cold, and pain.'],
['senses','Touch & pain','Gate control theory','The spinal cord has a neurological "gate" that either blocks pain signals or lets them through to the brain. Distraction can close the gate.'],
['senses','Touch & pain','Phantom limb','Feeling that an amputated limb is still there, because the sensory cortex area for that limb still has activity.'],
['senses','Unusual perception','Synesthesia','When one sense triggers another — like hearing music or seeing a number and experiencing a color.'],
['senses','Unusual perception','Prosopagnosia','Face blindness: the inability to recognize faces.'],

// Optional deck: always append new cards at the end; ids come from position.
['split','Split-brain patients','Split-brain patient','Someone whose corpus callosum has been surgically cut, usually to stop severe seizures from spreading. The two hemispheres can no longer share information.'],
['split','Split-brain patients','Left visual field (LVF)','Everything to the left of where you are looking, in both eyes. It is received by the right half of each eye and sent to the right hemisphere.','Visual fields cross: left field → right brain.'],
['split','Split-brain patients','Right visual field (RVF)','Everything to the right of where you are looking, in both eyes. It is received by the left half of each eye and sent to the left hemisphere, the language side.','Right field → left brain → can say it.'],
['split','Split-brain patients','Optic chiasm','The point where the optic nerves cross, so each visual field goes to the opposite hemisphere.','Chiasm looks like an X, the crossing point.'],
['split','Split-brain patients','Object flashed to the right visual field','Reaches only the left hemisphere. The patient can say the word and describe it, and can point to it or draw it with the right hand, but not the left.'],
['split','Split-brain patients','Object flashed to the left visual field','Reaches only the right hemisphere. The patient says they saw "nothing," but can point to it or draw it with the left hand.','Left field → left hand, no words.'],
['split','Hemisphere styles','Trees vs. forest','The left hemisphere focuses on details and pieces (the "trees"). The right hemisphere sees the big picture and wholes, including the self (the "forest").'],
['split','Hemisphere styles','Words vs. tone','In language, the left hemisphere handles words and their literal definitions. The right hemisphere handles tone, inflection, and context.'],
['split','Hemisphere styles','Logic vs. intuition','Left: thoughts, logic, linear and literal thinking, calculation. Right: feelings, intuition, inferences and associations, perception.'],
// Sleep, Consciousness & Drugs: only what's on the slides. Appended last; ids come from position.
['sleep','Sleep & consciousness','Sleep','An altered state of consciousness. It is not a period of dormancy where your body and brain shut off: even when you are sound asleep, your brain is still active.'],
['sleep','Sleep & consciousness','Dreaming','Everyone dreams every night.'],
['sleep','Sleep & consciousness','Sleep stages','Sleep has four stages: NREM 1 (Stage 1), NREM 2 (Stage 2), NREM 3 (Stage 3), and REM sleep.','Three NREM stages, then REM.'],
['sleep','Circadian rhythm','Circadian rhythm','The biological clock: regular bodily rhythms that occur on a 24-hour cycle. The body is roughly synchronized with the 24-hour cycle of day and night.'],
['sleep','Circadian rhythm','Body temperature cycle','Body temperature increases throughout the day, dips in the afternoon, and is lowest at night.'],
['sleep','Circadian rhythm','Teens and young adults','Most are evening-energized, with performance improving across the day.'],
['sleep','Circadian rhythm','Older adults','Most are morning people, with energy declining as the day goes on.'],
['sleep','Circadian rhythm','Artificial light','Light from cell phones, lamps, and other devices can interfere with circadian rhythms.'],
['sleep','Effects of sleep loss','Sleep loss: brain','Diminished attentional focus and memory consolidation, and increased risk of depression.'],
['sleep','Effects of sleep loss','Sleep loss: immune system','Suppression of immune cell production and increased risk of viral infections, such as colds.'],
['sleep','Effects of sleep loss','Sleep loss: stomach and fat cells','Increased hunger-arousing ghrelin and decreased hunger-suppressing leptin, plus increased fat cell production and greater risk of obesity.','Ghrelin = growling stomach goes up; Leptin = leave the table goes down.'],
['sleep','Effects of sleep loss','Sleep loss: heart','Increased risk of high blood pressure.'],
['sleep','Effects of sleep loss','Sleep loss: muscles and joints','Muscles: reduced strength and slower reaction time and motor learning. Joints: increased inflammation and arthritis.'],
['sleep','Sleep disorders','Insomnia','Can\'t sleep.'],
['sleep','Sleep disorders','Sleep apnea','You stop breathing in your sleep.','Apnea = no air.'],
['sleep','Sleep disorders','Night terrors','Not nightmares: intense fear or terror where you wake up screaming or crying, with no recollection the following morning. Happen in Stage 3.'],
['sleep','Sleep disorders','Sleepwalking','A sleep disorder: walking while asleep.'],
['sleep','Sleep disorders','Narcolepsy','You fall asleep spontaneously.','Narco = sleep attack.'],
['sleep','How drugs work','Psychoactive drugs','Chemical substances that alter perceptions and mood. They affect the synapses of neurons and the functioning of neurotransmitters.'],
['sleep','How drugs work','Agonist','A drug that fits into receptors and mimics a neurotransmitter, increasing its effects. Example: opiates mimic and increase the effects of endorphins.','Agonist = Acts like it.'],
['sleep','How drugs work','Antagonist','A drug that blocks the effects of a neurotransmitter. Example from your slides: cocaine blocks the reuptake of dopamine.','Antagonist = Against it.'],
['sleep','How drugs work','Reuptake inhibitor','A drug that blocks reuptake, so the neurotransmitter isn\'t reabsorbed. Your slides\' example: cocaine blocks the reuptake of dopamine.'],
['sleep','How drugs work','Four categories of psychoactive drugs','Depressants, stimulants, hallucinogens, and opioids.'],
['sleep','Depressants','Depressants','Drugs that slow you down by reducing neural activity. Examples: alcohol, barbiturates, sedatives, benzodiazepines.','Depress = press down.'],
['sleep','Depressants','Alcohol','A depressant that calms the nervous system. It\'s perceived as a stimulant because people do crazy things, but it intensifies the effects of GABA (sluggish movements, slurred speech) and reduces glutamate (slower reactions, impaired judgment).'],
['sleep','Depressants','Barbiturates / sedatives','Also called "downers." Used to treat insomnia; effects are similar to alcohol. They mess with sleep patterns and cause dependence. They increase GABA, which has a calming effect.'],
['sleep','Depressants','Benzodiazepines','Valium and Xanax. Anti-anxiety drugs that calm the nervous system. They depress heartbeat and breathing.'],
['sleep','Stimulants','Stimulants','Drugs that excite the central nervous system. Examples: caffeine, nicotine, cocaine, amphetamines, meth.'],
['sleep','Stimulants','Caffeine','Naturally occurring (coffee, tea, chocolate); increases alertness. In high doses it can cause anxiety, heart palpitations, and insomnia.'],
['sleep','Stimulants','Nicotine','A highly addictive stimulant. Depending on the amount of time smoked, it can have stimulating or sedative effects. Withdrawal symptoms: irritability, headaches, nervousness.'],
['sleep','Stimulants','Cocaine','Blocks reabsorption of dopamine to produce increased alertness, euphoria, and motivation. Followed by a huge crash with anxiety, depression, and strong cravings.'],
['sleep','Stimulants','Amphetamines','Mimic epinephrine/adrenaline. Increase alertness and feelings of well-being and give a sense of euphoria, followed by a huge crash. Leads to a cycle of addiction. Meth and ecstasy/MDMA are forms.'],
['sleep','Hallucinogens','Hallucinogens','Substances that distort visual and auditory perception. Examples: LSD, marijuana.'],
['sleep','Hallucinogens','LSD','Produces hallucinations and delusions, like a psychotic state. Can result in psychosis, memory loss, paranoia, panic attacks, nightmares, and aggression.'],
['sleep','Hallucinogens','THC','The active ingredient in marijuana. Can produce mild hallucinations, euphoria, relaxation, a sense of wellbeing, and a distortion of time.'],
['sleep','Hallucinogens','Ecstasy (MDMA)','Considered both a stimulant and a hallucinogen. Produces a euphoric high and can damage serotonin-producing neurons, resulting in a permanent deflation of mood and impairment of memory.'],
['sleep','Opioids','Opioids','Drugs derived from the opium poppy that lessen pain and anxiety. Examples: heroin, codeine, morphine, methadone, OxyContin, oxycodone.'],
['sleep','Opioids','How opioids work','They act as agonists for endorphins, which reduce pain and increase positive feelings. With continued use, the brain stops producing dopamine and endorphins.'],
['sleep','Opioids','Results of opioid use','Dependence, tolerance, withdrawal, and physiological and psychological addiction.'],
['sleep','Addiction','Substance use','Using a substance, but it doesn\'t interfere with daily functioning.'],
['sleep','Addiction','Substance abuse','A pattern of use that inhibits the ability to function, often puts the user in danger, and results in legal difficulties.'],
['sleep','Addiction','Tolerance','A need for larger amounts of the drug to experience the same effects.'],
['sleep','Addiction','Addiction','The user craves the drug and continues to use it despite adverse consequences. Users want the drug more than they like the drug. Includes withdrawal symptoms.','Want it more than you like it.'],
['sleep','Addiction','Withdrawal','The discomfort and distress that follow discontinuing an addictive drug. Can be physiological and/or psychological.'],
['sleep','Substance use disorder','Substance use disorder','A disorder characterized by continued substance craving and use despite significant life disruption and/or physical risk. Diagnosed with 11 DSM-5 criteria.'],
['sleep','Substance use disorder','Severity levels','Per your slide: mild = 3 criteria met, moderate = 4 or 5, severe = 6 or more.'],
['sleep','Substance use disorder','Criteria: losing control','Taking the substance in larger amounts or for longer than you meant to; wanting to cut down or stop but not managing to; spending a lot of time getting, using, or recovering from it; cravings and urges to use it.'],
['sleep','Substance use disorder','Criteria: life problems','Not doing what you should at work, home, or school; continuing even when it causes relationship problems; giving up important social, occupational, or recreational activities.'],
['sleep','Substance use disorder','Criteria: risk and the body','Using again and again even when it puts you in danger; continuing even when you know it caused or worsened a physical or psychological problem; tolerance; withdrawal symptoms relieved by taking more.'],

// Perception: only what's on the slides. Appended last; ids come from position.
['perception','Attention','Selective attention','Focusing your conscious awareness on a particular stimulus and NOT something else.'],
['perception','Attention','Stroop effect','Delayed reaction time when you must say the color of a word but not the name of the word. Example from your slides: the word GREEN printed in purple, where you have to say "purple."','The word fights the color.'],
['perception','Attention','Change blindness','Failing to notice changes in the environment because your attention is directed elsewhere.','Missed a CHANGE.'],
['perception','Attention','Inattentional blindness','Failing to see visible objects when your attention is directed elsewhere.','Missed a THING that was right there.'],
['perception','Attention','Change vs. inattentional blindness','Both happen because attention is directed elsewhere. Change blindness = not noticing that something changed. Inattentional blindness = not seeing a visible object at all.'],
['perception','Attention','Cocktail party effect','The ability to focus auditory attention on a particular voice or sound while filtering out others. In a crowded room, you can focus on the voice of the one person you\'re talking with.'],
['perception','Attention','Hearing your name','Part of the cocktail party effect: when we hear our name, our brain can register it even amongst background noise.'],
['perception','Attention','Pop-out phenomenon','Something different popping out to get our attention, like the one laughing face in the cartoon of a crying movie audience on your slides.'],
['perception','Top-down vs. bottom-up','Bottom-up processing','Sensory receptors throughout the body register information about the external environment and send it up to the brain for processing. This is sensation.','Bottom-up = from the body up = sensation.'],
['perception','Top-down vs. bottom-up','Top-down processing','Using your knowledge, experience, or context to understand and interpret sensory perceptions. This is perception.','Top-down = your brain\'s knowledge comes down = perception.'],
['perception','Top-down vs. bottom-up','Reading scrambled words','You can read words with scrambled middle letters as long as the first and last letters are in the right place, because the mind reads the word as a whole, not every letter by itself. An example of top-down processing.'],
['perception','Top-down vs. bottom-up','The handwriting example','Being aware of squiggles like "15" in a messy note is bottom-up (sensation). Knowing what the squiggles mean is top-down (perception).'],
['perception','Thresholds','Absolute threshold','The weakest amount of a stimulus that a person can detect 50% of the time: the moment when you notice something.'],
['perception','Thresholds','Absolute threshold examples','Hearing a watch ticking 20 feet away; tasting one teaspoon of salt dissolved in two gallons of water; the volume of the music in your car.'],
['perception','Thresholds','Difference threshold (just noticeable difference)','The minimum amount something needs to change before a person notices the change 50% of the time.','JND = just noticeable difference.'],
['perception','Thresholds','JND example','Car music on level 5: you probably can\'t notice a change to 6, but you probably can notice a change from 5 to 10.'],
['perception','Thresholds','Weber\'s law','For an average person to perceive a difference, two stimuli must differ by a constant percentage, not a constant amount.','Weber = percentage.'],
['perception','Thresholds','Weber\'s law examples','Add 1 ounce to a 10-ounce weight and you will detect the difference; add 1 ounce to a 100-ounce weight and you likely won\'t. Weight must change by 2% to notice a difference.'],
['perception','Extrasensory perception','Extrasensory perception (ESP)','The claim of perceiving without the senses: telepathy, clairvoyance, and precognition. There is no scientific basis for it.'],
['perception','Extrasensory perception','Telepathy','Mind-to-mind communication.','Tele-path = sending a message down a path to another mind.'],
['perception','Extrasensory perception','Clairvoyance','Perceiving events you didn\'t actually witness, like knowing where a body is buried or how someone was murdered.','Clair-voyance = "clear seeing" of something you weren\'t there for.'],
['perception','Extrasensory perception','Precognition','Perceiving future events.','Pre = before it happens.'],
['perception','Extrasensory perception','Psychics and the police','Psychic visions given to police are no more accurate than guesses made by others.'],
['perception','Extrasensory perception','Why psychics seem accurate','Psychics make so many predictions that one of them is bound to be correct at some point, and people focus on the 1 or 2 correct predictions and forget most of the incorrect ones.'],

// Unit 0: Research Methods, Perspectives, Statistics. Only what's on the slides. Appended last; ids come from position.
['research','Why psychology needs research','Intuition','Understanding without conscious reasoning. Your slides ask whether we can rely on it. We can\'t, which is why psychology uses research.'],
['research','Why psychology needs research','Why intuition fails','Your slides: "Psychology exists because our intuition sucks," because of hindsight bias, misunderstanding of probability, and overconfidence.','HMO: Hindsight, Misunderstanding probability, Overconfidence.'],
['research','Why psychology needs research','Hindsight bias','The tendency to believe, after learning the outcome, that you would have foreseen it.','"I knew it all along!"'],
['research','Why psychology needs research','Overconfidence','The tendency to overestimate your knowledge and/or ability.'],
['research','Why psychology needs research','Misunderstanding of probability','People are bad at judging chance and very large numbers. Your class showed this with a coin toss and by guessing what could hold a million, a billion, and a trillion dollars.'],
['research','The scientific method','The scientific method (7 steps)','1. Observe some aspect of the universe. 2. Develop a theory. 3. Use the theory to make a hypothesis. 4. Test the predictions with experiments, using operational definitions. 5. Evaluate the results. 6. Modify the theory in light of your findings. 7. Replicate.'],
['research','The scientific method','Theory','A general idea that is consistent with what you have observed. Step 2 of the scientific method.'],
['research','The scientific method','Hypothesis','An educated prediction or guess, made using a theory. Step 3 of the scientific method. Example from your slides: students are more likely to smile for their senior pictures if they have a friendly photographer.','Hypothesis = the testable prediction.'],
['research','The scientific method','Operational definition','Exact specifications of how the research is conducted, including exactly how each variable will be measured. Needed in step 4. Your class did a Lego activity on this.','Operational = how it OPERATES in the study.'],
['research','The scientific method','Why operational definitions matter','Research cannot be replicated without operational definitions. In the senior-picture example, both "smiling" and "friendliness" need one, because people disagree about how many of the students in the yearbook photos are smiling.'],
['research','The scientific method','Replicate','Doing the research a second time to ensure the reliability of the results. Step 7 of the scientific method.','Replicate = repeat.'],
['research','Types of research','Three types of research','Descriptive, correlational, and experimental.'],
['research','Types of research','Descriptive research','Describes behaviors, often using case studies, surveys, or naturalistic observations.'],
['research','Types of research','Correlational research','Associates different factors or variables: it tells us about the relationship between two variables.'],
['research','Types of research','Experimental research','Manipulates variables to establish cause-and-effect relationships. Of the three types, only experiments can show cause and effect.'],
['research','Descriptive methods','Case study','A descriptive method that examines one individual or group in depth.'],
['research','Descriptive methods','Case study: pros and cons','Advantages: in-depth information about a limited number of subjects; illustrates general principles that can be applied to others. Disadvantages: misleading if the individual is atypical or underrepresented; can overgeneralize the results.'],
['research','Descriptive methods','Naturalistic observation','A descriptive technique that observes and records behavior in naturally occurring situations, without trying to manipulate or control the situation.'],
['research','Descriptive methods','Naturalistic observation: pros and cons','Advantage: non-invasive, so subjects are more likely to show honest behavior in a natural setting. Disadvantages: can be time consuming; subjects may notice the observer and act differently; the observer may misinterpret the subjects\' actions.'],
['research','Descriptive methods','Survey','A descriptive technique used to get the self-reported attitudes and behaviors of a particular group, usually by questioning a representative random sample of the group.'],
['research','Descriptive methods','Survey: pros and cons','Advantages: collects a large amount of data in a short time; flexible (online, in person, etc.). Disadvantages: poorly worded questions can skew responses; participants may try to please the researcher; people may lie to look better or have mistaken memories; can have a poor response rate.'],
['research','Correlation','Correlation','Research that tells us about the relationship between two variables (a "co-relation").'],
['research','Correlation','Positive correlation','Two variables increase or decrease together. Examples from your slides: as sleep increases, memory increases; as salary decreases, spending also decreases; as hourly pay increases, employee morale increases.','Same direction = positive.'],
['research','Correlation','Negative correlation','When one variable increases, the other decreases. Examples from your slides: as absences increase, grades decrease; as hours of sleep decrease, levels of stress increase.','Opposite directions = negative.'],
['research','Correlation','Zero (no) correlation','No relationship between the two variables. On a scatterplot, the dots are scattered with no pattern.'],
['research','Correlation','Correlation coefficient','A number from -1.0 to +1.0. The sign shows the direction. The closer to +1 or -1, the stronger the relationship; 0 means no correlation. Your slide\'s chart: 1 perfect, 0.9 high, 0.5 low, 0 none, and the same on the negative side.'],
['research','Correlation','Positive isn\'t "good"','Positive doesn\'t mean "good" and negative doesn\'t mean "bad." The sign only describes the direction of the relationship.'],
['research','Correlation','Correlation does not equal causation','Two things being related doesn\'t mean one causes the other. Your slides\' example: ice cream sales and violent crime are correlated, but ice cream doesn\'t turn people into criminals. Ice cream and sunburn are correlated because hot, sunny summer weather causes both.','A third factor (like summer weather) can cause both.'],
['research','Experiments','Population','The group that the research is meant to apply to.'],
['research','Experiments','Sample','A variety of people from the population used as participants in the research.'],
['research','Experiments','Representative (random) sample','Participants chosen fairly to represent a population: everyone in the group being studied has an equal chance of being included.'],
['research','Experiments','Experimental group','Participants who receive the manipulated variable. Example from your slides: the group that takes the antidepressant.'],
['research','Experiments','Control group','Participants who do not receive the manipulated variable. Example from your slides: the group that doesn\'t take the antidepressant. Comparing the groups shows whether the medication really reduces depression.','Control = compare.'],
['research','Experiments','Independent variable (IV)','The factor that is manipulated or controlled by the researcher. Examples from your slides: amount of sleep (does sleep deprivation cause poor memory?); temperature (does room temperature affect test scores?).','IV = what I change.'],
['research','Experiments','Dependent variable (DV)','The factor that is measured or observed by the researcher. Examples from your slides: strength of memory; test scores.','The DV depends on the IV. DV = data.'],
['research','Experiments','Confounding variable','An outside influence that affects the results of the study. Example from your slides: when studying how exercise (IV) affects weight loss (DV), possible confounding variables are diet, amount of sleep, and genetic issues.'],
['research','Problems with research','Problems with research (all 11)','Placebo effect, Hawthorne effect, Barnum effect, confounding variables, hindsight bias, overconfidence, gambler\'s fallacy, social desirability bias, self-report bias, sampling bias, and wording effects (framing).'],
['research','Problems with research','Placebo effect','Experimental results caused by expectations alone. Example: participants act or claim to feel a certain way because they think they received a drug that would cause that reaction.'],
['research','Problems with research','Hawthorne effect','Participants changing their behavior because they know they are being observed.','Hawthorne = "they\'re watching."'],
['research','Problems with research','Barnum effect','Believing that personality descriptions apply specifically to you (more than to other people), even though the description is filled with information that applies to everyone. Example: your horoscope.'],
['research','Problems with research','Gambler\'s fallacy','The tendency to overestimate the occurrence of patterns in random data.'],
['research','Problems with research','Social desirability bias','People giving answers that may be dishonest because they are seeking approval and/or want to highlight their character strengths.','Answering to look good.'],
['research','Problems with research','Self-report bias','Participants try to affect the outcome of the research and/or are unrealistic about themselves. They may try to please the researcher or even purposely challenge the researcher\'s hypothesis.'],
['research','Problems with research','Sampling bias','Researchers targeting participants to make their hypothesis more likely to be proven, or failing to gather a representative sample of the population, leading to skewed results.'],
['research','Problems with research','Wording effects (framing)','How questions are worded can skew responses.'],
['research','Ethics','Why ethics guidelines exist','Many famous psychology experiments were highly unethical and cannot be replicated. The American Psychological Association (APA) set principles to protect everyone involved in research.'],
['research','Ethics','APA ethical guidelines','Voluntary participation, confidentiality, informed consent, debriefing, no long-term physical or psychological harm, animal participants must be well cared for, and approval from a research institution.'],
['research','Ethics','Voluntary participation','People choose for themselves whether to take part in a study.'],
['research','Ethics','Confidentiality','Participants\' information is kept private.'],
['research','Ethics','Informed consent','Giving potential participants enough information about the study to let them choose whether or not to participate.','Informed consent = BEFORE.'],
['research','Ethics','Debriefing','The explanation after the experiment of what the study was about, including its purpose and any deception.','Debriefing = AFTER.'],
['research','Ethics','No long-term harm','Studies may not cause long-term physical or psychological harm.'],
['research','Ethics','Animal participants','All animal participants must be well cared for.'],
['research','Ethics','Institutional approval','Research needs approval from a research institution.'],

['perspectives','What perspectives are','Psychological perspectives','The different approaches psychologists use to explain human behavior and thought processes, like viewing a situation through a different set of lenses. There are 7.','Perspective = a pair of glasses.'],
['perspectives','What perspectives are','The 7 perspectives','Psychodynamic, cognitive, behavioral, humanistic, biological, evolutionary, and sociocultural.','Your slide\'s hand: thumb = psychodynamic; fingers = cognitive, behavioral, humanism, biological; palm = sociocultural; wrist = evolutionary.'],
['perspectives','The seven perspectives','Psychodynamic perspective','Behavior is influenced by your unconscious mind and past experiences, especially those from childhood. Based heavily on the ideas of Freud.','Iceberg: most of the mind is hidden below the surface.'],
['perspectives','The seven perspectives','Cognitive perspective','How our internal thought processes shape our behavior. Emphasizes memory, problem solving, intelligence, and perception.','Cognitive = thinking.'],
['perspectives','The seven perspectives','Behavioral perspective','How our behaviors have been influenced by our learned experiences. We often repeat behaviors that are reinforced by positive rewards.','The dog that jumps through a hoop for a treat.'],
['perspectives','The seven perspectives','Humanistic perspective','How humans can achieve their full potential, emphasizing free will, self-efficacy, and self-actualization. Also emphasizes relationships, positivity, and maximizing well-being.','Humanistic = hopeful, reaching your potential.'],
['perspectives','The seven perspectives','Biological perspective','The importance of genetics, brain chemistry, hormones, and neurotransmitters (like dopamine and serotonin) in influencing behavior and thinking.','Bio = body: genes, brain, chemicals.'],
['perspectives','The seven perspectives','Evolutionary perspective','Human behavior is a result of evolutionary processes that protect us, give us adaptive behaviors, and help us be more successful at reproducing.','What helped our ancestors survive.'],
['perspectives','The seven perspectives','Sociocultural perspective','Humans behave and act differently based on the influences of their culture or way of life.','Socio = society; culture = way of life.'],
['perspectives','Applying perspectives','Applying a perspective','To analyze a behavior from a perspective, explain it using what that perspective focuses on. The same behavior can be explained by more than one perspective.'],
['perspectives','Applying perspectives','Slide example: Suzanne','Suzanne loves romantic comedies. Your slide\'s sociocultural explanation: in her culture it\'s popular for women to enjoy romantic movies, and going gives her something to do with friends and an easy topic of conversation.'],
['perspectives','Applying perspectives','Perspective keywords','Unconscious, childhood, Freud → psychodynamic. Thoughts, memory, problem solving → cognitive. Rewards, learning → behavioral. Potential, free will, positivity → humanistic. Genes, hormones, neurotransmitters → biological. Ancestors, survival, reproduction → evolutionary. Culture, social norms → sociocultural.'],

['stats','Descriptive statistics','Descriptive statistics','Statistics that help researchers organize data meaningfully.'],
['stats','Descriptive statistics','Frequency distribution','A count of how often each score or range of scores appears, like the tally table of ages of people entering a store on your slide.'],
['stats','Descriptive statistics','Histogram','A bar graph that shows a frequency distribution. Useful because it displays data visually and makes patterns in a distribution quicker to spot.'],
['stats','Central tendency','Mean','The average. Add up all the numbers, then divide by how many numbers there are. Example from your slides: 2, 3, 4, 5, 5, 8 → mean = 4.5.'],
['stats','Central tendency','Median','The middle number when the numbers are in numerical order. If there are two middle numbers, average them. Example from your slides: 2, 4, 5, 6, 9 → median = 5.','Median = middle, like the median strip in a road.'],
['stats','Central tendency','Mode','The number that appears most frequently. Example from your slides: 1, 3, 6, 6, 8 → mode = 6.','Mode = most.'],
['stats','Central tendency','Percentile rank','The percentage of scores that are less than a given score. Your slides call it a fourth measure of central tendency. Example: in the 85th percentile on a psychology test, your score is higher than 85% of your peers.'],
['stats','Variation','Measures of variation','Tell us how similar or different scores are.'],
['stats','Variation','Range','The difference between the highest and lowest scores: subtract the lowest from the highest. Example from your slides: 75, 78, 86, 92, 98, 100 → 100 − 75 = 25. Only a rough estimate of variation.'],
['stats','Variation','Standard deviation','How much scores vary around the mean: whether they are packed together or spread out. A more useful measure of variation than the range.','Small SD = packed together. Big SD = spread out.'],
['stats','Variation','Normal curve','A bell-shaped curve where most scores fall near the mean and fewer fall near either extreme.'],
['stats','Variation','The 68% and 95% rule','In a normal curve, about 68% of scores fall within 1 standard deviation of the mean, and about 95% within 2. Your slide\'s IQ example: mean 100, SD 15, so about 68% score 85–115 and about 95% score 70–130.'],
['stats','Skewed data','Outlier','A score far away from the rest. One or two outliers can impact results, especially the mean. Your slide\'s example: a billionaire moving into a poor town could push the mean income to $1,000,000, so the median and mode give a fuller picture.'],
['stats','Skewed data','Skewed distribution','When an outlier disproportionately affects the mean, a few scores stretch away from the group like a tail. The skew is named for the direction of the tail.','Skew = where the tail goes.'],
['stats','Skewed data','Positive skew','The tail goes to the right, and the mean goes to the right too. Order: mean > median > mode.','Tail toward the bigger (positive) numbers = positive.'],
['stats','Skewed data','Negative skew','The tail goes to the left, and the mean goes to the left too. Order: mean < median < mode.'],
['stats','Skewed data','Symmetrical distribution','No skew: mean = median = mode.'],
['stats','Skewed data','The mean follows the tail','In a skewed distribution, the mean always moves in the direction of the tail. The mode stays at the peak.'],
['stats','Skewed data','Bimodal curve','A graph with two peaks ("bi" means two). Each peak is a local maximum: the highest values compared with the data points right around them.'],
['stats','Inferential statistics','Inferential statistics','Statistics that help determine whether results can be generalized to a larger population: confirming that results aren\'t just random fluctuations in the participants sampled, but true of a population.'],
['stats','Inferential statistics','3 key principles','1. Representative samples are better than unrepresentative samples. 2. Bigger samples are better than small ones. 3. More estimates are better than fewer estimates.'],
['stats','Inferential statistics','Meta-analysis','Combining the estimates of many studies instead of focusing on just one. Useful because more estimates are better than fewer.'],
['stats','Inferential statistics','The café example','Alex asks two friends about Café Mocha (they love it) and two about Café Latte (they don\'t). Her conclusion isn\'t reliable because of an unrepresentative sample (her friends may have unique tastes) and a small sample size (two people each isn\'t enough).'],
['stats','Inferential statistics','Statistical significance','An observed difference is statistically significant when the probability that it happened by chance is low enough to reject the null hypothesis. That means strong evidence the difference is due to something other than chance.'],
['stats','Inferential statistics','P-value','A number from 0 to 1 describing how likely it is that your data happened by random chance. The smaller the p-value, the less likely the results were due to chance. A p-value of .05 or less is statistically significant.','Small p = probably real.'],
['stats','Inferential statistics','Effect size','The strength of the relationship between two variables. A p-value only tells you whether an effect exists; effect size tells you how strong it is. Your slide\'s example: a new study technique group averaged 85 vs. 75 for the usual group, a 10-point effect.'],

// Unit 5. Only what's on the slides (plus the meaning of a few phobia names the slides list without defining). Appended last; ids come from position.
['health','Stress','Stress','Stress activates your sympathetic nervous system (the fight/flight/freeze response), which activates hormones like cortisol. This can result in hypertension, headaches, and immunosuppression.'],
['health','Stress','Cortisol','A stress hormone. Stress activates the sympathetic nervous system, which releases hormones like cortisol.'],
['health','Stress','Hypertension','High blood pressure. One of the results of stress.'],
['health','Stress','Immunosuppression','A weakened immune system. One of the results of stress (along with hypertension and headaches).','Immuno-suppression = immune system pushed down.'],
['health','Stressors','Eustress','Motivating stress, or "good" stress: situations that are challenging but manageable and can lead to growth. Your slide lists changes like moving, marriage, and pregnancy.','Eu = good (like euphoria).'],
['health','Stressors','Distress','Debilitating stress, or "bad" stress, which has a negative impact. Includes ACEs, catastrophes, significant life changes, and daily hassles.','Dis = bad.'],
['health','Stressors','Catastrophes','Unpredictable, large-scale events, such as natural disasters. A type of distress.'],
['health','Stressors','Significant life changes','Distress like divorce or the death of a loved one.'],
['health','Stressors','Daily hassles','Everyday distress like traffic, a dead cell phone, no Wi-Fi, strained budgets, and deadlines.'],
['health','Adverse Childhood Experiences','Adverse Childhood Experiences (ACEs)','Stressful or traumatic events that happen during a child\'s development (ages 0–17). Negative experiences that affect a child\'s brain and health as they grow into adults.'],
['health','Adverse Childhood Experiences','Three types of ACEs','Abuse, neglect, and household dysfunction.','A-N-H: Abuse, Neglect, Household.'],
['health','Adverse Childhood Experiences','ACE: Abuse','Physical, emotional, or sexual abuse.'],
['health','Adverse Childhood Experiences','ACE: Neglect','Physical or emotional neglect.'],
['health','Adverse Childhood Experiences','ACE: Household dysfunction','Living with a parent who abuses substances, experiencing domestic violence, having a parent with a mental illness, or having a parent incarcerated.'],
['health','Adverse Childhood Experiences','Health risks of ACEs','Behaviors: missed work, lack of physical activity, smoking, alcoholism, drug use. Physical and mental health: obesity, heart disease, depression, suicide attempts, STDs, COPD, cancer, stroke, diabetes, broken bones.'],
['health','General Adaptation Syndrome','General Adaptation Syndrome (GAS)','How the body responds to ongoing stress, in three stages: alarm, resistance, and exhaustion.','A-R-E: Alarm, Resistance, Exhaustion.'],
['health','General Adaptation Syndrome','Alarm stage','Immediate stress; the fight-or-flight response is activated.'],
['health','General Adaptation Syndrome','Resistance stage','Adaptive stress: the body is still in high stress with hormones like cortisol and epinephrine flowing, using up your reserves.'],
['health','General Adaptation Syndrome','Exhaustion stage','The body\'s resources are depleted and the ability to cope is weakened, which leads to physical and mental health issues.'],
