['health','Responding to stress','Tend-and-befriend theory','A stress response, primarily observed in women, that involves seeking support, caring for others, and forming or strengthening social connections instead of fight-or-flight. Part of evolutionary psychology: believed to have evolved so females could ensure the survival of their offspring and themselves.'],
['health','Responding to stress','Tending','Caring for others: protecting and nurturing offspring, often by providing care, resources, and emotional support.'],
['health','Responding to stress','Befriending','Seeking out and strengthening social connections for mutual support and protection.'],
['health','Responding to stress','Problem-focused coping','Solving the problem: dealing with the stressor itself by identifying the problem, generating solutions, evaluating options, and taking action. It tackles the root cause of the stress, not just the feelings, and works best when the stressor can be changed or controlled.','Problem-focused = fix the problem.'],
['health','Responding to stress','Emotion-focused coping','Focusing on your emotional response: how you feel about the stressor, not changing the stressor itself. The goal is to regulate negative emotions or tolerate the stressor\'s impact. Used when the stressor seems uncontrollable or problem-focused coping isn\'t working.','Emotion-focused = fix the feeling.'],

['disorders','When is it a disorder?','When is it a disorder? (the 3 Ds)','Professionals label thoughts, feelings, and behaviors as a disorder when they are deviant, dysfunctional/maladaptive, and distressing.','The 3 Ds.'],
['disorders','When is it a disorder?','Deviant','Different from social norms. One of the 3 Ds.'],
['disorders','When is it a disorder?','Dysfunctional / maladaptive','Interferes with the person\'s ability to function in daily life. One of the 3 Ds.'],
['disorders','When is it a disorder?','Distressing','Causes distress for the person or for others. One of the 3 Ds.'],
['disorders','When is it a disorder?','DSM-5','The Diagnostic and Statistical Manual of Mental Disorders, 5th edition. Used to classify (label) disorders in the United States.'],
['disorders','Explanations by approach','Biological explanation','Medical or genetic issues; chemical imbalances (neurotransmitters and hormones); tumors; structural issues in the brain.'],
['disorders','Explanations by approach','Psychodynamic explanation','Unconscious thoughts and childhood experiences.'],
['disorders','Explanations by approach','Behavioral explanation','Responses learned in our environment through conditioning and reinforcement.'],
['disorders','Explanations by approach','Cognitive explanation','Maladaptive, irrational, and dysfunctional thoughts and beliefs.'],
['disorders','Explanations by approach','Sociocultural explanation','Social and cultural relationships and dynamics.'],
['disorders','Explanations by approach','Humanistic explanation','A lack of social support and being unable to reach our full potential.'],
['disorders','Explanations by approach','Evolutionary explanation','Behaviors and mental processes that reduce our chance of survival.'],
['disorders','A warning','Intern syndrome','A condition often reported by medical students, who believe they are experiencing the symptoms of the disease they are studying. Your slide\'s rule: don\'t diagnose yourself or others; you are not qualified.'],

['anxiety','Anxiety disorders','Anxiety disorders','Disorders characterized by persistent, excessive worry and fear that can significantly interfere with daily life. They include generalized anxiety disorder, panic disorder, and phobias.'],
['anxiety','Phobias','Specific phobia','Intense or irrational fear or anxiety that is out of proportion to the actual threat and may result in a panic attack. It interferes with activities of daily living.'],
['anxiety','Phobias','Symptoms of specific phobias','Intense fear and anxiety, avoidance of the feared object or situation, panic attacks, and feeling out of control. Physical: sweating, rapid heartbeat, tremors. Behavioral: avoiding the object and places where contact is possible.'],
['anxiety','Phobias','Cynophobia','Fear of all kinds of dogs.'],
['anxiety','Phobias','Sociophobia','Fear of social situations.'],
['anxiety','Phobias','Dentophobia','Extreme fear and anxiety of the dentist.'],
['anxiety','Phobias','Aerophobia','Fear of flying on any kind of plane.','Aero = air.'],
['anxiety','Phobias','Trypanophobia','An intense fear of needles.'],
['anxiety','Phobias','Acrophobia','An intense fear of heights.','Acro = high (like acrobat).'],
['anxiety','Phobias','Arachnophobia','A deep and extreme fear of spiders.'],
['anxiety','Phobias','Other phobias on your slides','Your slide lists these names without meanings. Commonly: coulrophobia = clowns, pogonophobia = beards, triskaidekaphobia = the number 13, samhainophobia = Halloween, hippopotomonstrosesquippedaliophobia = long words.'],
['anxiety','Agoraphobia','Agoraphobia','Marked anxiety about using public transportation, being in open spaces, being in enclosed places, being in a crowd, and/or being outside of the home alone.','Agora = marketplace: fear of being out where escape is hard.'],
['anxiety','Agoraphobia','Symptoms of agoraphobia','Physical: sweating, tremors, rapid heartbeat. Behavioral: avoiding situations that cause anxiety, staying home, social isolation. Cognitive: intense fear of a panic attack, of being trapped or unable to escape, or of losing control; feeling overwhelmed or helpless; difficulty concentrating or making decisions.'],
['anxiety','Panic & social anxiety','Panic disorder','An anxiety disorder where you regularly have sudden attacks of panic or fear. Everyone feels anxiety and panic sometimes, but someone with panic disorder feels anxiety, stress, and panic regularly and at any time, often for no apparent reason.'],
['anxiety','Panic & social anxiety','Symptoms of panic disorder','Panic attacks, and anxiety about having panic attacks.'],
['anxiety','Panic & social anxiety','Social anxiety disorder (social phobia)','An intense and persistent fear of social situations where one may be scrutinized or judged by others.'],
['anxiety','Panic & social anxiety','Symptoms of social anxiety disorder','Fear or anxiety in social situations where judgment is feared; fear of being embarrassed, humiliated, or rejected; difficulty making eye contact or speaking in public; overanalyzing social interactions; panic attacks before, during, or after social events.'],
['anxiety','Generalized anxiety disorder','Generalized anxiety disorder (GAD)','Excessive, persistent, and uncontrollable worry about a wide range of everyday situations. It\'s nonspecific anxiety and fear. For a diagnosis, it must last at least 6 months and interfere with daily functioning.','Generalized = worried about everything, not one thing.'],
['anxiety','Generalized anxiety disorder','Symptoms of GAD','Excessive anxiety and worry, increased muscle aches or soreness, impaired concentration, fatigue, irritability, restlessness, and difficulty sleeping.'],
['anxiety','Causes','Behavioral cause of anxiety disorders','Anxiety disorders can develop through learned behaviors, such as associating certain situations or objects with danger, or through modeling the anxiety responses of others.'],
['anxiety','Causes','Cognitive cause of anxiety disorders','Maladaptive thinking and emotional responses.'],
['anxiety','Causes','Biological cause of anxiety disorders','Imbalances in neurotransmitters like serotonin and GABA, and hormonal imbalances.'],
['anxiety','Causes','Genetic cause of anxiety disorders','A genetic predisposition.'],

['mood','Depressive disorders','Depressive disorders','Characterized by a sad, empty, or irritable mood along with physical and cognitive changes that affect a person\'s ability to function. Depression is a mental health condition, not just a temporary mood swing.'],
['mood','Depressive disorders','Depression quick facts','Depression affects over 18 million U.S. adults (one in ten) in any given year and over 300 million people worldwide. It is the leading cause of disability for ages 15–44 and worldwide. It is the primary reason someone dies by suicide about every 13 minutes (over 41,000 people a year).'],
['mood','Depressive disorders','Major depressive disorder (MDD)','Symptoms that last 2 weeks or more and are a change from previous functioning.','MDD = 2 weeks.'],
['mood','Depressive disorders','Symptoms of major depressive disorder','Feeling sad and helpless nearly every day; loss of interest in favorite activities; significant weight loss or gain; changes in sleep (insomnia or hypersomnia); difficulty concentrating or thinking; feelings of worthlessness; fatigue or low energy; thoughts of death or suicide (seeking help is important).'],
['mood','Depressive disorders','Persistent depressive disorder','Symptoms of depression present for most of the day on most days for two years or more. No manic episodes (then it would most likely be bipolar disorder), and not due to drug use.','Persistent = 2 years.'],
['mood','Depressive disorders','Causes of depressive disorders','Genetic: family histories and twin studies show a genetic component. Biological: imbalances in serotonin, dopamine, and norepinephrine; hormonal imbalances; medical conditions like chronic pain. Environmental: high stress from job loss, death of a loved one, financial or relationship problems; childhood trauma, social isolation, poverty.'],
['mood','Bipolar disorders','Bipolar disorders','Characterized by extreme mood swings between periods of mania (elevated mood) and depression (low mood).','Bi = two poles: high and low.'],
['mood','Bipolar disorders','Manic episode','Elevated mood, feeling euphoric or overly happy; increased energy and activity; decreased need for sleep; racing thoughts and rapid speech; grandiosity and inflated self-esteem; impulsivity and risk-taking; irritability and aggression.'],
['mood','Bipolar disorders','Depressive episode (bipolar)','Persistent sadness, hopelessness, or emptiness; loss of interest in activities; fatigue; difficulty concentrating and making decisions; changes in appetite and sleep; feelings of worthlessness and guilt; suicidal thoughts or behaviors.'],
['mood','Bipolar disorders','Bipolar I','The more severe form. Full-blown manic episodes with extreme euphoria, inflated self-esteem, impulsivity, and psychosis (hallucinations or delusions). Severe effect on daily functioning; usually an earlier onset than Bipolar II; may have longer periods of depression.','I = more Intense.'],
['mood','Bipolar disorders','Bipolar II','The less severe form. Hypomanic episodes instead of full mania, less severe symptoms, and no psychosis. More common, but still has a significant impact on daily functioning.'],
['mood','Bipolar disorders','Hypomanic episode','A lesser form of mania than full-blown mania. Seen in Bipolar II.','Hypo = under (less than) mania.'],
['mood','Bipolar disorders','Causes of bipolar disorder','Genetic: family history is a strong indicator; some genes may increase susceptibility. Biological: imbalances in serotonin, dopamine, and norepinephrine and hormonal imbalances; sleep disturbances can increase symptoms. Environmental: stressful life events (trauma, loss, abuse) can increase symptoms; early childhood abuse and neglect increase the likelihood. Cultural: your slide says it\'s more common among Hispanic and African Americans than Caucasians.'],

['neurodev','Neurodevelopmental disorders','Neurodevelopmental disorders','Disorders associated with issues in central nervous system functioning that begin to appear in early childhood. They usually involve issues with social, intellectual, academic, or interpersonal functioning, and range from developmental, language, and speech delays to autism and ADHD.'],
['neurodev','Neurodevelopmental disorders','Causes of neurodevelopmental disorders','Not usually a single cause: a combination of genetic/biological and environmental factors. Environmental factors include exposure to teratogens like alcohol, tobacco, and other toxins; low birth weight; and maternal stress, trauma, and illness.'],
['neurodev','Neurodevelopmental disorders','High heritability','ADHD and ASD both tend to run in families, which suggests a strong genetic component.'],
['neurodev','Neurodevelopmental disorders','Teratogens','Harmful substances a baby is exposed to before birth, like alcohol, tobacco, and other toxins.'],
['neurodev','ADHD','ADHD','Attention deficit hyperactivity disorder: a neurodevelopmental disorder with a persistent pattern of inattention and/or hyperactivity-impulsivity that interferes with functioning or development.'],
['neurodev','ADHD','ADHD symptom count','Six or more symptoms of inattention and/or hyperactivity-impulsivity for children up to age 16, or five or more for ages 17 and older and adults.','6 for kids, 5 for 17+.'],
['neurodev','ADHD','Inattention symptoms','Doesn\'t listen when spoken to directly; doesn\'t follow instructions; difficulty organizing tasks; avoids tasks that require sustained mental effort; often loses things; easily distracted; forgetful.'],
['neurodev','ADHD','Hyperactivity symptoms','Fidgety; runs about or climbs excessively; difficulty playing quietly; energetic; talks excessively.'],
['neurodev','ADHD','Impulsivity symptoms','Blurts out answers before questions are finished; difficulty waiting their turn; interrupts conversations or intrudes on others.'],
['neurodev','ADHD','Other ADHD criteria','Several symptoms present before age 12; present in two or more settings (home, school, work, with friends); clear evidence they interfere with or reduce the quality of functioning; not better explained by another mental disorder; present at least 6 months and developmentally inappropriate.','Before 12, 2+ settings, 6+ months.'],
['neurodev','ADHD','ADHD onset','The average onset is during childhood, usually around age eight. Diagnosing earlier can be difficult because many symptoms also occur in children without ADHD.'],
['neurodev','Autism spectrum disorder','Autism spectrum disorder (ASD)','Children with ASD seek out less emotional and social contact, tend to be hypersensitive to sensory stimuli, and may engage in simple, repetitive behaviors. Often they have difficulty with social interaction, maintaining eye contact, and picking up nonverbal cues like facial expressions or body language.'],
['neurodev','Autism spectrum disorder','Why "spectrum"?','Symptoms of ASD range from mild to severe.'],
['neurodev','Autism spectrum disorder','ASD statistics','About 1 in 31 (3.2%) children aged 8 have been identified with ASD (CDC ADDM Network). ASD is over 3 times more common among boys than girls.'],

['dissoc','Dissociative disorders','Dissociative disorders','Disorders involving a loss of connection between thoughts, memories, feelings, surroundings, behavior, and identity. They include escaping from reality in ways that are not wanted and not healthy, and cause problems managing everyday life.','Dis-associate = disconnect.'],
['dissoc','Dissociative disorders','Cause of dissociative disorders','The most common cause is severe trauma or major stress.'],
['dissoc','Dissociative disorders','Symptoms of dissociative disorders','Memory loss and confusion about identity; feelings of detachment; reasoning difficulties; mood changes.'],
['dissoc','Dissociative amnesia','Dissociative amnesia','A significant inability to recall important personal information, typically related to traumatic or stressful events.'],
['dissoc','Dissociative amnesia','Symptoms of dissociative amnesia','Inability to remember specific events or periods of time; loss of autobiographical information (personal identity, relationships, life experiences); confusion and disorientation about one\'s own life; may experience a fugue state.'],
['dissoc','Dissociative amnesia','Fugue state','When the individual wanders or travels without any awareness of their identity or situation. Can happen with dissociative amnesia.','Fugue = flee (Latin).'],
['dissoc','Dissociative identity disorder','Dissociative identity disorder (DID)','A severe condition with two or more distinct personality states (called "alters"), each with its own identity, memories, behaviors, and perspectives.'],
['dissoc','Dissociative identity disorder','Alters','The distinct personality states in dissociative identity disorder.'],
['dissoc','Dissociative identity disorder','Symptoms of DID','Two or more distinct personality states; shifts in identity that can happen suddenly or gradually; gaps in memory about significant events; confusion about one\'s own identity; feelings of detachment from oneself or the environment.'],

['schizo','Schizophrenia','Schizophrenia','A type of psychosis. The DSM-5 placed it on a spectrum of psychotic disorders because people experience its symptoms in a variety of ways. To be diagnosed, the patient must have at least 2 symptoms (positive and negative) for at least 6 months.'],
['schizo','Symptoms','Positive symptoms','Symptoms that indicate something added: delusions, hallucinations, disorganized thinking/speech, and disorganized motor movement.','Positive = added, not "good."'],
['schizo','Symptoms','Delusions','False beliefs. Can be delusions of grandeur (importance) or delusions of persecution (paranoia).','Delusion = false belief.'],
['schizo','Symptoms','Delusions of grandeur','False beliefs about one\'s own importance.'],
['schizo','Symptoms','Delusions of persecution','False beliefs that others are out to get you (paranoia).'],
['schizo','Symptoms','Hallucinations','False perceptions: seeing, hearing, smelling, tasting, or feeling things that are not real.','Hallucination = false perception.'],
['schizo','Symptoms','Disorganized thinking/speech','Stringing words together in an unusual way (word salad), jumping from topic to topic, or rhyming.'],
['schizo','Symptoms','Word salad','Words strung together in a jumbled, unusual way. A sign of disorganized speech.'],
['schizo','Symptoms','Disorganized motor movement','Movement that is childlike, excessive, excited, silly, or purposeless.'],
['schizo','Symptoms','Negative symptoms','Symptoms that indicate something absent: lack of emotional expression (flat affect), no movement (catatonic stupor), and lack of interest and motivation.','Negative = missing.'],
['schizo','Symptoms','Flat affect','A lack of emotional expression. A negative symptom.'],
['schizo','Symptoms','Catatonic stupor','No movement. A negative symptom.'],
['schizo','Causes','Causes of schizophrenia','Genetic or biological link (tends to run in families); prenatal exposure to certain viruses (teratogens like flu, herpes, rubella); imbalances in neurotransmitters like dopamine and glutamate.'],
['schizo','Causes','Dopamine hypothesis','The theory that an imbalance of dopamine in the brain can contribute to schizophrenia. It suggests the positive symptoms (delusions, hallucinations) are caused by an overproduction of dopamine.','Too much dopamine → positive symptoms.'],
['schizo','Causes','Diathesis-stress model','The idea that high levels of stress may trigger a genetic/biological predisposition (diathesis) to develop mental illness. Example: identical twins where one develops schizophrenia but the other does not.','Diathesis = the built-in risk; stress = the trigger.'],
['schizo','Causes','Diathesis','A genetic or biological predisposition to develop a mental illness.'],

['ocdptsd','Obsessive-compulsive & related','Obsessive-compulsive & related disorders','A group including OCD, body dysmorphic disorder (BDD), hoarding disorder, trichotillomania (hair-pulling), and excoriation (skin-picking), characterized by intrusive thoughts and/or repetitive behaviors. Your slide: know the symptoms of OCD and hoarding.'],
['ocdptsd','Obsessive-compulsive & related','Their own DSM-5 category','OCD and related disorders like hoarding were part of anxiety disorders in earlier versions of the DSM. In the DSM-5 they were moved to their own category to show they are distinct from anxiety disorders.'],
['ocdptsd','Obsessive-compulsive & related','Trichotillomania','Hair-pulling disorder. An obsessive-compulsive related disorder.'],
['ocdptsd','Obsessive-compulsive & related','Excoriation disorder','Skin-picking disorder. An obsessive-compulsive related disorder.'],
['ocdptsd','OCD','OCD','Obsessive-compulsive disorder: characterized by obsessions and compulsions.'],
['ocdptsd','OCD','Obsessions','Recurrent and persistent thoughts that are intrusive.','Obsessions = thoughts.'],
['ocdptsd','OCD','Compulsions','Repetitive behaviors or mental acts the individual feels driven to perform.','Compulsions = actions.'],
['ocdptsd','OCD','The OCD cycle','Obsession → distress → compulsion → relief → back to obsession.'],
['ocdptsd','OCD','Behavioral cause of OCD','Compulsions are learned and maintained through operant conditioning: the anxiety reduction is the reinforcement. Behaviors may also have been learned through social learning.'],
['ocdptsd','OCD','Other causes of OCD & related disorders','Cognitive: maladaptive and distorted thinking. Environmental: past trauma and stressful life events. Genetic: higher incidence in twins, runs in families, specific genes identified. Biological: differences in specific brain regions; OCD is related to low serotonin and imbalances in GABA and glutamate.'],
['ocdptsd','Hoarding','Hoarding disorder','DSM-5 criteria: (a) persistent difficulty discarding or parting with possessions, regardless of their actual value; (b) this is due to a perceived need to save the items and distress about discarding them; (c) it results in possessions that congest and clutter active living areas, substantially compromising their use.'],
['ocdptsd','Trauma & stressor-related','Trauma- and stressor-related disorders','Disorders that result from exposure to a traumatic or stressful event: PTSD, acute stress disorder, and adjustment disorders. They cause similar symptoms but differ in how long they last. Your slide: know the symptoms of PTSD.'],
['ocdptsd','Trauma & stressor-related','Cause of trauma disorders','Exposure to a traumatic or stressful event that results in psychological distress.'],
['ocdptsd','Trauma & stressor-related','Symptoms of PTSD','Intrusive thoughts; nightmares and flashbacks; hypervigilance (always on guard); anxiety and depression; difficulty sleeping or concentrating; substance use or self-destructive behavior.'],
['ocdptsd','Trauma & stressor-related','Hypervigilance','Always being on guard. A symptom of PTSD.'],

['eating','Eating disorders','Feeding & eating disorders','Most involve an intense focus on weight, body shape, and food, leading to dangerous eating behaviors that can seriously affect nutrition. They can cause permanent harm to the heart, digestive system, bones, teeth, and mouth, can lead to other diseases, and are linked with depression, anxiety, self-harm, and suicidal thoughts and behaviors.'],
['eating','Eating disorders','The two to know','Anorexia nervosa and bulimia nervosa.'],
['eating','Anorexia nervosa','Anorexia nervosa','Refusal to maintain body weight at or above a minimally normal weight (restricting calories to reach a significantly low body weight), plus an intense fear of gaining weight or becoming overweight even though underweight.','Anorexia = restricting.'],
['eating','Anorexia nervosa','Signs of anorexia','Distorted self-image, intense fear of gaining weight, restricted food intake, excessive exercising, withdrawing from socializing, intentional vomiting, significant weight loss, fatigue, and dizziness or fainting.'],
['eating','Bulimia nervosa','Bulimia nervosa','Recurrent episodes of binge eating, plus acting to prevent weight gain with self-induced vomiting; misuse of laxatives, diuretics, or other medications; fasting; or excessive exercise.','Bulimia = binge + undo it.'],
['eating','Bulimia nervosa','Binge eating episode','Both: eating, within any 2-hour period, an amount of food definitely larger than most people would eat in a similar time and situation, and feeling you can\'t stop eating or control what or how much you eat.'],
['eating','Bulimia nervosa','Signs of bulimia','Hard to spot: people often binge and purge privately. Frequent bathroom visits, excessive exercising, preoccupation with body image, intense fear of gaining weight, feeling out of control, depression/anxiety/substance abuse, guilt or shame about eating, withdrawing from friends and family.'],
['eating','Causes','Biological & genetic causes','Biological: imbalances in brain chemistry. Genetic: family history and genetic predisposition.'],
['eating','Causes','Social cause','A history of weight-related bullying; family concerns with fitness and weight; a family focus on perfectionism or high achievement.'],
['eating','Causes','Cultural cause','Most prevalent in industrialized cultures with an emphasis on thinness; the presence of extreme diet and exercise information.'],
['eating','Causes','Cognitive cause','Dysfunctional attitudes about physical appearance, perfectionism, and obsessive thoughts.'],
['eating','Causes','Stress as a cause','Stress like heading to college, family issues, relationship issues, and new jobs.'],

['personality','Personality disorders','Personality disorders','Enduring patterns of internal experience and behavior that are deviant from one\'s culture; pervasive and inflexible; begin in adolescence or early adulthood; stable over time; and lead to personal distress. To be a disorder, they have to interfere with daily living and normal functioning.'],
['personality','Personality disorders','Three clusters','There are 10 personality disorders in three clusters. Cluster A: odd or eccentric. Cluster B: dramatic, emotional, erratic. Cluster C: anxious or fearful.','A = Awkward/odd, B = Bold/dramatic, C = Cowardly/fearful.'],
['personality','Cluster A: odd or eccentric','Cluster A','Odd or eccentric: paranoid, schizoid, and schizotypal personality disorders.'],
['personality','Cluster A: odd or eccentric','Paranoid personality disorder','Irrational fear and distrust of others; interprets others\' motives as malevolent (bad intent). No psychosis and no loss of touch with reality.'],
['personality','Cluster A: odd or eccentric','Schizoid personality disorder','Lack of interest in social relationships and very little emotion; indifferent to criticism or praise; lacks social skills and understanding of social norms.'],
['personality','Cluster A: odd or eccentric','Schizotypal personality disorder','Odd and eccentric behavior, thinking, and appearance; magical thinking (superstitious, paranormal experiences); social anxiety, suspicion, paranoia.'],
['personality','Cluster B: dramatic, emotional, erratic','Cluster B','Dramatic, emotional, erratic: antisocial, histrionic, narcissistic, and borderline personality disorders.'],
['personality','Cluster B: dramatic, emotional, erratic','Antisocial personality disorder','A persistent pattern of disregard for and violation of the rights and well-being of others; lack of empathy, remorse, and responsibility. Your chart: may account for half of the prison population in some countries.'],
['personality','Cluster B: dramatic, emotional, erratic','Histrionic personality disorder','A pervasive pattern of excessive emotionality and attention-seeking; dramatic and theatrical displays to gain attention and validation; need for reassurance and approval.','Histrionic = theatrical.'],
['personality','Cluster B: dramatic, emotional, erratic','Narcissistic personality disorder','Exaggerated sense of self-importance; need for excessive admiration; preoccupation with power, success, or beauty; sense of entitlement; exploits others; lack of empathy, arrogant; doesn\'t recognize others\' feelings; sensitive to criticism.','Narcissus fell in love with his own reflection.'],
['personality','Cluster B: dramatic, emotional, erratic','Borderline personality disorder','Instability in mood, self-image, and relationships, often leading to intense emotions, impulsivity, and difficulty maintaining stable relationships.'],
['personality','Cluster C: anxious or fearful','Cluster C','Anxious or fearful: avoidant, dependent, and obsessive-compulsive personality disorders.'],
['personality','Cluster C: anxious or fearful','Avoidant personality disorder','Extreme shyness and social anxiety; fear of rejection and criticism; feelings of inadequacy and inferiority; avoiding social situations, relationships, and activities; difficulty expressing emotions and forming intimate relationships; low self-esteem.'],
['personality','Cluster C: anxious or fearful','Dependent personality disorder','Difficulty making everyday decisions without reassurance; excessive need for advice and guidance; fear of separation and abandonment; submissive and clingy; difficulty disagreeing or asserting oneself; feeling helpless and incompetent.'],
['personality','Cluster C: anxious or fearful','Obsessive-compulsive personality disorder','Perfectionism; rigid and stubborn; need for orderliness and control; stingy; strict moral codes; can\'t delegate because others won\'t do it right.'],
['personality','Causes','Causes of personality disorders','Genetic: a possible genetic predisposition. Environmental: early childhood abuse, neglect, or trauma; an unstable, unpredictable, or unsupportive home; poor attachment. Biological: differences in brain structure or functioning. Cultural: norms and expectations, socialization, and parenting styles. Substance abuse.'],

['treatment','History','History of treatment','Very dark. People with mental illness were usually locked away in their homes or sent to psychiatric hospitals called lunatic or insane asylums, where conditions were horrible and treatments were often worse than the illness.'],
['treatment','History','Lobotomies in history','Widely used in the 1930s and 1940s. A lobotomy is a psychosurgery that severs connections in the brain\'s prefrontal lobe. Electroshock therapy was also used in many institutions.'],
['treatment','History','Deinstitutionalization','The late 20th-century movement to close asylums. With new medications, patients could be treated with a combination of medication and therapy on an outpatient basis.'],
['treatment','Treatment today','Biomedical therapy','Medical interventions. The biomedical approach (medical model) uses pharmacology (drugs) to treat symptoms of mental illness and counteract imbalances in the brain. It also includes more invasive treatments: ECT, psychosurgery, TMS, and lobotomies.'],
['treatment','Treatment today','Psychotherapy','Interactions between a trained therapist and someone seeking to overcome psychological difficulties. Usually treatment combines psychotherapy and biomedical treatment.'],
['treatment','Treatment today','Who can prescribe','Medications and biomedical therapies can only be prescribed by a doctor or psychiatrist. Most psychotherapy is done by clinical psychologists and psychotherapists.'],
['treatment','Treatment today','Eclectic approach','Combining therapy methods from the approaches that best fit the client\'s case. Most psychologists and therapists use it, choosing from biological, psychoanalytic, humanistic, behavioral, cognitive, group, sociocultural, and evolutionary approaches.','Eclectic = a mix.'],
['treatment','Medications','Psychotropic medications','Drugs used to treat mental illness. They don\'t cure the disorder or treat the underlying cause; they treat the symptoms by interacting with neurotransmitters. Classes: anti-anxiety, antidepressants, and antipsychotics. Usually used with psychotherapy.'],
['treatment','Medications','Pharmacology','The use of drugs. Part of biomedical therapy.'],
['treatment','Medications','Antidepressants','Typically SSRIs (selective serotonin reuptake inhibitors), which block the reuptake of serotonin. Examples: Prozac, Paxil, Zoloft. Side effects: fatigue, forgetfulness, insomnia, weight gain.'],
['treatment','Medications','Anti-anxiety medications','Reduce anxiety symptoms (tension, fear, nervousness) by depressing the central nervous system and increasing the effects of GABA. Also known as benzodiazepines. Examples: Xanax, Librium, Lorazepam, Valium, D-cycloserine (OCD and phobias). Side effects: drowsiness and dependency.'],
['treatment','Medications','Antipsychotics','Also called neuroleptics. Treat schizophrenia and severe bipolar disorder by blocking dopamine receptors, reducing positive symptoms (hallucinations, delusions); also help negative symptoms like apathy and flat affect. Examples: Haldol, Thorazine. Side effects: tardive dyskinesia, weight gain.'],
['treatment','Medications','Tardive dyskinesia','A medication-induced movement disorder with repetitive, involuntary movements. A side effect of antipsychotics.'],
['treatment','Medications','Mood stabilizers','Used to treat bipolar disorder. Example: lithium.','Lithium = bipolar.'],
['treatment','Brain treatments','Lobotomy','A psychosurgery that cuts the main neural connections leading to the frontal lobe. Rarely used today. It may calm behavior but reduces functioning and awareness and can lead to a vegetative state.'],
['treatment','Brain treatments','Transcranial magnetic stimulation (rTMS)','Repeated pulses surge through a magnetic coil held near the skull; the pulses induce electrical currents that stimulate neurons and change brain activity. Used for chronic depression. Benefits: no seizures, no memory loss, and the person is awake.'],
['treatment','Brain treatments','Electroconvulsive therapy (ECT)','Electrodes on one or both sides of the head pass an electric current (up to 100 volts), causing a seizure for 30–60 seconds. Used for extreme depression; reduces the risk of suicide. Drawbacks: memory loss, 40% relapse into depression within 6 months, and no one knows why it works.'],
['treatment','Psychotherapy basics','Confidentiality (cardinal rule)','The cardinal rule of psychotherapy: the therapist must keep the patient\'s information confidential unless they believe the patient is a danger to themselves or others.'],
['treatment','Psychotherapy basics','Cultural humility','A "self-first" approach to sociocultural differences: learning about your own biases so you become more accepting of others. Self-reflection plus openness to understanding other cultures, and acknowledging power imbalances in society. First developed in physical healthcare.'],
['treatment','Psychotherapy basics','Therapeutic alliance','A trusting bond between the patient and therapist. Core elements on your slide: goals, tasks, bond, trust, collaboration, and agreement.'],
['treatment','Psychotherapy basics','Hans Eysenck','In the 1950s, his study concluded that psychotherapies, especially psychoanalysis, were no more effective than no treatment at all.'],
['treatment','Psychotherapy basics','Is psychotherapy effective?','Today, meta-analysis of many studies shows it is, especially with medication. It works best with a therapeutic alliance, the patient\'s positive expectations that therapy will work, and a specific action plan.'],
['treatment','Ethics','Fidelity and responsibility','Build trust with the client, take responsibility for your actions, and maintain professional responsibility.'],
['treatment','Ethics','Beneficence and nonmaleficence','Do no harm! Weigh the benefits against the risks of harm and make sure treatment won\'t harm others.','Non-male-ficence = no harm.'],
['treatment','Ethics','Respect for rights and dignity','Maintain the client\'s confidentiality and privacy, and allow for self-determination.'],
['treatment','Ethics','Integrity','Honesty, accuracy, and transparency. No lying to the client.'],
['treatment','Ethics','Justice','Treat everyone equally; ensure fairness and equal access for all clients.'],
['treatment','Psychodynamic therapies','Psychodynamic therapies','Therapies that try to uncover the unconscious mind: free association and dream interpretation.'],
['treatment','Psychodynamic therapies','Free association','A way to explore the unconscious: the person relaxes and says whatever comes to mind, no matter how trivial or embarrassing, while the psychologist sits out of the patient\'s line of vision. The therapist interprets, or helps the patient interpret, the missing pieces.'],
['treatment','Psychodynamic therapies','Resistance','When the patient is unable to remember details or goes blank during free association: a mental block.'],
['treatment','Psychodynamic therapies','Dream interpretation','Exploring the symbolic meaning of dreams to uncover unconscious material. Dreams are seen as a window into the unconscious, revealing hidden desires, fears, and unresolved conflicts.'],
['treatment','Psychodynamic therapies','Hypnosis','Used by Freud to uncover the unconscious, but research shows it is NOT a valid way to retrieve memories or regress in age. Today it\'s used to treat pain and anxiety by inducing relaxation and focused attention.'],
['treatment','Humanistic therapies','Person-centered (client-centered) therapy','The most widely used humanistic therapy, developed by Carl Rogers. Non-directive: the therapist offers acceptance, genuineness, and empathy and shows unconditional positive regard so the client can express their true feelings.','Rogers = client-centered.'],
['treatment','Humanistic therapies','Non-directive therapy','The therapist just listens, without directing, judging, or interpreting.'],
['treatment','Humanistic therapies','Unconditional positive regard','A caring, accepting, nonjudgmental attitude: accepting and valuing the client as a person even if their thoughts, feelings, or behaviors aren\'t always approved of.'],
['treatment','Humanistic therapies','Empathy, congruence, UPR','The three parts of person-centered therapy. Empathy: understanding the client\'s perspective. Congruence: the counselor is genuine, open, and real. Unconditional positive regard: nonjudgmental acceptance.'],
['treatment','Humanistic therapies','Active listening','Empathetic listening in which the listener echoes, restates, and clarifies. A central part of Rogers\' client-centered therapy.'],
['treatment','Cognitive therapies','Cognitive therapy','Teaches people new, more adaptive ways of thinking and acting. Based on the idea that thoughts come between events and our emotional reactions. Methods: cognitive restructuring and fear hierarchies.'],
['treatment','Cognitive therapies','Cognitive restructuring','A method for changing how people think: recognizing and challenging pessimistic thoughts ("I\'m never going to make it") and replacing them with positive ones ("I can succeed if I try").'],
['treatment','Cognitive therapies','Socratic questioning','A cognitive restructuring strategy: asking deep questions to challenge your thoughts, like "What evidence supports my belief?" or "How might another person view this differently?"'],
['treatment','Cognitive therapies','Fear hierarchy','A list of feared situations ranked from least to most anxiety-provoking, used in exposure therapy so people can gradually face their fears in a controlled, safe way.'],
['treatment','Cognitive therapies','Beck\'s cognitive theory of depression','Aaron Beck: faulty information processing and core irrational beliefs make people vulnerable to depression. Depressed people develop a negative cognitive triad.'],
['treatment','Cognitive therapies','Negative cognitive triad','Negative thoughts about yourself ("I\'m worthless"), the world ("No one cares about me"), and the future ("Things will never get better").','Me, the world, the future.'],
['treatment','Behavioral therapies','Behavioral therapies','Therapies that apply conditioning principles: exposure therapies, aversion therapy, token economies, and biofeedback.'],
['treatment','Behavioral therapies','Exposure therapy','Exposing people to what they would normally avoid. Your slide links it to Peter and the rabbit.'],
['treatment','Behavioral therapies','Systematic desensitization','Creating a fear hierarchy (from least scary to most scary) and learning relaxation techniques.'],
['treatment','Behavioral therapies','Aversion therapy','A type of counterconditioning that pairs an unpleasant state with an unwanted behavior. The opposite of systematic desensitization. Most common example: Antabuse for alcoholism.'],
['treatment','Behavioral therapies','Antabuse','A drug that makes people feel physically ill if they drink alcohol, pairing a negative outcome with a previously pleasant stimulus. An example of aversion therapy.'],
['treatment','Behavioral therapies','Token economy','An operant conditioning procedure that rewards a desired behavior: the patient earns tokens for the desired behavior and exchanges them for privileges or treats (5 gold stars = treasure box).'],
['treatment','Behavioral therapies','Biofeedback','Based on conditioning principles: people learn to consciously control physiological responses like heart rate and muscle tension. Sensors monitor the body, the data is fed back to the person, and through practice they learn to influence those responses.'],
['treatment','Cognitive behavioral therapies','Cognitive behavioral therapy (CBT)','Applies both behavioral and cognitive principles. The idea: people\'s thinking influences their emotions and behavior.'],
['treatment','Cognitive behavioral therapies','Dialectical behavior therapy (DBT)','A modified form of CBT that helps people manage intense emotions, improve relationships, and build a life worth living. Originally developed for borderline personality disorder.','DBT = borderline.'],
['treatment','Cognitive behavioral therapies','The 4 DBT skills','Mindfulness (being aware of the present moment without judgment), distress tolerance (managing a crisis without making it worse), emotion regulation (understanding and changing emotions), and interpersonal effectiveness (getting needs met and keeping relationships).'],
['treatment','Cognitive behavioral therapies','Rational emotive behavior therapy (REBT)','Developed by Ellis: people engage in false self-talk, and changing their beliefs changes their emotions. The therapist confronts the client\'s irrational beliefs. Mainly used for anxiety. Steps: identify, challenge, and replace irrational beliefs.','REBT = confront.'],
['treatment','Modes of therapy','Modes of therapy','How therapy is delivered, not the type of therapy used: individual or group.'],
['treatment','Modes of therapy','Group therapy','A therapist works with a small group with similar problems. People see they aren\'t the only ones, it\'s cheaper, they can work on coping skills together, and it relieves isolation.'],
['treatment','Modes of therapy','Individual therapy','One-on-one with a therapist. Personalized, more intimate, and flexible in scheduling, but very expensive. Some disorders can\'t be treated well in a group, so individual therapy is preferred.']
];
