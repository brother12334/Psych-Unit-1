['brain','Which part of the brain regulates body temperature, hunger, and thirst?',['Hypothalamus','Thalamus','Medulla','Cerebellum'],0,'Hypothalamus: temperature, thirst, hunger, and sexual responses. Don\'t mix it up with the thalamus, the sensory relay.'],
['brain','Which of the following best describes the role of the prefrontal cortex?',['Planning, judgment, decision making, and personality','Processing visual information','Coordinating balance','Relaying sensory information'],0,'The prefrontal cortex handles executive functions; it was Phineas Gage\'s injury.'],
['brain','A doctor wants to check for a tumor quickly by looking at the shape of a patient\'s brain structures, not their activity. Which scan fits best?',['fMRI','PET scan','CT scan','EEG'],2,'CT (and MRI) show structure. fMRI, PET, and EEG show activity.'],
['brain','A researcher wants to see which brain areas become more active when people look at photos of their friends, as precisely as possible. Which technique is best?',['CT scan','MRI','fMRI','X-ray'],2,'fMRI shows function through blood flow and is more precise than PET.'],
['brain','Which technique records brain waves through electrodes placed on the scalp and is often used to detect seizures?',['EEG','PET scan','MRI','CT scan'],0,'EEG = electrical activity.'],
['brain','Doctors sometimes cut the corpus callosum in patients with severe epilepsy. Which of the following best describes the purpose of this surgery?',['To keep seizures from spreading from one hemisphere to the other','To speed up communication between the hemispheres','To improve memory and learning','To reduce activity in the frontal lobe'],0,'The corpus callosum connects the hemispheres. Cutting it stops seizure activity from crossing over.'],
['brain','Which statement about the two hemispheres is most accurate?',['The left hemisphere is usually dominant for language, and each hemisphere controls the opposite side of the body.','The right hemisphere controls the right side of the body.','Language is processed equally by both hemispheres.','The corpus callosum controls movement on both sides of the body.'],0,'Left = language. Each side of the brain controls the opposite side of the body.'],
['brain','Which of the following best explains why young children often recover better from brain injuries than adults do?',['Children\'s brains are more plastic, so other areas can take over lost functions more easily.','Children can grow new neurons anywhere in the brain.','Children do not use their cerebral cortex yet.','Children\'s neurons do not have myelin.'],0,'Plasticity is greatest in childhood. Neurogenesis happens in only a couple of areas, so B is a trap.'],
['brain','Which of the following correctly matches a brain structure with its function?',['Medulla — breathing and heartbeat','Hippocampus — balance','Cerebellum — fear','Amygdala — vision'],0,'Hippocampus = memory, cerebellum = balance, amygdala = fear, occipital lobe = vision.'],
['brain','Which part of the brain is primarily responsible for processing visual information?',['Frontal lobe','Parietal lobe','Temporal lobe','Occipital lobe'],3,'Occipital = optical, at the back of the brain.'],

['vision','Which of the following best explains why it is hard to see colors in a dimly lit room?',['Cones need more light to work, and rods, which work in dim light, don\'t detect color.','Rods detect color only in bright light.','The lens can\'t focus in dim light.','The optic nerve shuts off in darkness.'],0,'Rods = reduced light, black and white. Cones = color, need brighter light.'],
['vision','Which of the following correctly describes the path of light through the eye?',['Cornea → pupil → lens → retina','Lens → cornea → retina → pupil','Retina → lens → pupil → cornea','Pupil → retina → cornea → lens'],0,'Light enters through the cornea, passes the pupil, is focused by the lens, and lands on the retina.'],
['vision','Which theory best explains why a person with red-green color blindness has trouble telling red from green?',['Trichromatic theory','Opponent-process theory','Gate control theory','Feature detection'],0,'Trichromatic theory: red, green, and blue cones. Color blindness usually comes from impaired red or green cones.'],
['vision','Which of the following is a monocular depth cue?',['Retinal disparity','Linear perspective','Comparing the slightly different images from each eye','Using both eyes to judge how close something is'],1,'Linear perspective works with one eye. The other three all need both eyes (binocular).'],
['vision','Which Gestalt principle explains why you see the letters on a page as separate words rather than one long string?',['Proximity','Similarity','Closure','Figure-ground'],0,'Proximity: things close together get grouped together.'],
['vision','Every player on one team wears red, so you see them as one group separate from the team in blue. Which Gestalt principle is this?',['Similarity','Proximity','Closure','Figure-ground'],0,'Similarity: things that look alike get grouped together.'],
['vision','Which part of the eye changes shape to focus images on near or far objects?',['Lens','Iris','Cornea','Retina'],0,'That shape change is called accommodation.'],
['vision','Which of the following best describes feature detectors?',['Neurons in the visual cortex that respond to specific features like edges, angles, and movement','Cells in the retina that detect color','The muscle that controls pupil size','Neurons that carry signals from the eye to the brain'],0,'Feature detectors are in the visual cortex, not the eye.'],
['vision','In a painting, a distant mountain looks hazy and blurry, so viewers see it as far away. Which depth cue is the artist using?',['Relative clarity','Interposition','Retinal disparity','Linear perspective'],0,'Relative clarity: sharp objects seem close, hazy ones seem far.'],
['vision','Which of the following best describes transduction in vision?',['Rods and cones in the retina convert light energy into neural impulses.','The lens bends light so it focuses on the retina.','The optic nerve carries signals to the occipital lobe.','The iris controls how much light enters the eye.'],0,'Transduction = converting energy into neural signals, and it happens in the retina.'],

['senses','An older adult\'s eardrum and middle-ear bones are damaged, but the cochlea is healthy. What type of hearing loss is this, and can it be treated?',['Conduction hearing loss; it can often be fixed with surgery','Sensorineural hearing loss; it cannot be reversed','Conduction hearing loss; it can never be treated','Sensorineural hearing loss; it can be fixed with surgery'],0,'Conduction = the parts that conduct sound (eardrum, ossicles). It\'s correctable. Sensorineural is the cochlea or auditory nerve.'],
['senses','Which treatment would most likely help someone whose hearing loss comes from damaged hair cells in the cochlea?',['A cochlear implant','Surgery to repair the ossicles','Glasses with stronger lenses','Medication that raises serotonin'],0,'Hair-cell damage is sensorineural. A cochlear implant sends signals straight to the auditory nerve.'],
['senses','Two sounds are equally loud, but one is a high whistle and the other a low drum. What property of the sound waves is different?',['Frequency','Amplitude','Loudness','Localization'],0,'Frequency = pitch. Amplitude = loudness, and the question says they\'re equally loud.'],
['senses','A gymnast can do a backflip with her eyes closed because she senses where her arms and legs are. Which sense makes this possible?',['Kinesthesis','Vestibular sense','Olfaction','Gustation'],0,'Kinesthesis senses the position of body parts. The vestibular sense is about the head\'s position and balance.'],
['senses','The smell of fresh cookies instantly brings back a vivid childhood memory. Which of the following best explains why?',['Smell signals go straight to brain areas connected to the limbic system, which handles emotion and memory.','Smell is processed in the occipital lobe.','The thalamus amplifies smell signals before they reach the cortex.','Taste buds store memories of familiar foods.'],0,'Smell is the only sense that skips the thalamus. It connects directly to emotion and memory areas.'],
['senses','Which of the following best describes gate control theory?',['The spinal cord has a neurological "gate" that can block pain signals or let them reach the brain.','Pain is felt only when all four skin senses are activated at once.','The thalamus decides which pains are real.','Pain receptors stop firing after a few seconds.'],0,'Distraction or rubbing the spot can close the gate.'],
['senses','Years after losing his arm, Marcus still feels an itch in his missing hand. This is called:',['Phantom limb sensation','Synesthesia','Prosopagnosia','Sensory interaction'],0,'The sensory cortex area for the missing limb is still active.'],
['senses','Whenever Priya hears a trumpet, she also sees the color orange. This is an example of:',['Synesthesia','Sensory interaction','Prosopagnosia','Kinesthesis'],0,'Synesthesia is one sense triggering another. Sensory interaction is the trap: one sense influencing another, like smell and taste.'],
['senses','A person with prosopagnosia would have the most trouble:',['Recognizing a friend\'s face','Tasting bitter foods','Keeping their balance','Hearing high-pitched sounds'],0,'Prosopagnosia = face blindness.'],
['senses','Jamal finds jalapeños unbearably hot, while his friend barely notices them. Jamal is most likely:',['A supertaster','Experiencing synesthesia','Experiencing sensory interaction','Experiencing phantom limb sensation'],0,'Supertasters have more taste buds and feel tastes and pain more intensely.'],
['senses','Which of the following is one of the five basic tastes?',['Umami','Spicy','Cold','Minty'],0,'The five are sweet, sour, salty, bitter, and umami. "Spicy" is actually pain.'],

['split','A split-brain patient holds a hidden key in her left hand and can\'t see it. Asked what she is holding, which of the following is most likely?',['She can\'t name it, but she can pick out the key with her left hand.','She names it right away.','She can point to the key only with her right hand.','She can\'t identify it in any way.'],0,'Touch from the left hand goes to the right hemisphere, which can\'t speak but controls the left hand.'],
['split','Which of the following best describes what research on split-brain patients revealed?',['The two hemispheres specialize in different functions, such as language in the left hemisphere.','Both hemispheres have identical abilities.','Cutting the corpus callosum causes paralysis.','The right hemisphere controls language.'],0,'Split-brain studies showed lateralization, like language on the left side.'],
['split','A split-brain patient looks at the center of the word HEART, so "HE" is in his left visual field and "ART" is in his right. Asked what word he saw, he will most likely say:',['"Art"','"He"','"Heart"','Nothing at all'],0,'"ART" reaches the left hemisphere, which can speak. "HE" reaches only the right hemisphere, so he could point to it with his left hand but not say it.'],

['sleep','Which statement about sleep is most accurate?',['Sleep is an altered state of consciousness, and the brain stays active even during sound sleep.','During sleep, the body and brain shut off until morning.','Only some people dream, and only on some nights.','Sleep is a period of dormancy for both the body and the brain.'],0,'Your slides: sleep is NOT dormancy; the brain is still active, and everyone dreams every night.'],
['sleep','Which of the following best describes the circadian rhythm?',['The body\'s biological clock: regular rhythms on a 24-hour cycle, synced with day and night','The order of the four sleep stages','A disorder in which people fall asleep suddenly','A drug\'s effect on dopamine'],0,'Circadian rhythm = the biological clock on a 24-hour cycle.'],
['sleep','Tia, 16, struggles in her first-period class but feels sharp by evening. Her grandfather is up at dawn and fades by dinner. Which of the following best explains this?',['Most teens are evening-energized, while most older adults are morning people.','Tia has narcolepsy and her grandfather has insomnia.','Older adults don\'t have circadian rhythms.','Teens\' body temperature is highest in the morning.'],0,'Teens and young adults improve across the day; older adults lose energy as the day goes on.'],
['sleep','Which of the following correctly describes body temperature across the day?',['It rises through the day, dips in the afternoon, and is lowest at night.','It is highest at night and lowest in the morning.','It stays the same all day.','It is lowest in the afternoon and highest at night.'],0,'Body temperature increases throughout the day, dips in the afternoon, and is lowest at night.'],
['sleep','Which of the following is an effect of sleep loss?',['Suppressed immune cell production and more colds','Lower risk of high blood pressure','Better memory consolidation','Faster reaction time'],0,'Sleep loss weakens the immune system, raises blood pressure risk, and hurts memory and reaction time.'],
['sleep','Which of the following best explains why ongoing sleep loss is linked to obesity?',['It raises hunger-arousing ghrelin, lowers hunger-suppressing leptin, and increases fat cell production.','It raises leptin, which makes people hungrier.','It increases GABA, which slows metabolism.','It blocks the reuptake of dopamine.'],0,'Ghrelin up, leptin down, more fat cells → greater risk of obesity.'],
['sleep','A student who has been sleeping only four hours a night has trouble focusing in class and remembering what she studied. Which effect of sleep loss is this?',['Diminished attentional focus and memory consolidation','Increased inflammation in the joints','Increased leptin','Narcolepsy'],0,'Brain effects of sleep loss: less focus, weaker memory consolidation, higher risk of depression.'],
['sleep','Darnell\'s wife notices that he stops breathing several times during the night while he sleeps. Darnell most likely has:',['Sleep apnea','Narcolepsy','Insomnia','Night terrors'],0,'Sleep apnea = you stop breathing in your sleep.'],
['sleep','In the middle of a conversation, Rosa suddenly falls asleep without warning. She most likely has:',['Narcolepsy','Insomnia','Sleep apnea','Sleepwalking'],0,'Narcolepsy = falling asleep spontaneously. Insomnia is the opposite: you can\'t sleep.'],
['sleep','Which of the following correctly describes night terrors?',['Intense fear and screaming or crying during Stage 3, usually not remembered the next morning','Bad dreams that are remembered in detail the next morning','Suddenly falling asleep during the day','Stopping breathing during sleep'],0,'Night terrors are not nightmares: Stage 3, intense terror, no recollection in the morning.'],
['sleep','Which of the following best describes an agonist?',['A drug that fits into receptors, mimics a neurotransmitter, and increases its effects','A drug that blocks the effects of a neurotransmitter','A drug that only affects the body, not the brain','The discomfort after stopping a drug'],0,'Agonist = acts like the neurotransmitter. Example: opiates mimic endorphins.'],
['sleep','Which of the following best describes an antagonist?',['A drug that blocks the effects of a neurotransmitter','A drug that mimics a neurotransmitter and increases its effects','A drug made from the opium poppy','A drug that only works on hormones'],0,'Antagonist = against it. Your slides\' example: cocaine blocking dopamine reuptake.'],
['sleep','Cocaine produces alertness, euphoria, and motivation by:',['Blocking the reabsorption (reuptake) of dopamine','Mimicking endorphins','Increasing GABA','Damaging serotonin-producing neurons'],0,'Cocaine blocks dopamine reuptake, then comes a huge crash with anxiety, depression, and cravings.'],
['sleep','People at a party get loud and do wild things after drinking, so some assume alcohol is a stimulant. Which of the following best explains why it is actually a depressant?',['It intensifies GABA and reduces glutamate, slowing neural activity, reactions, and judgment.','It blocks the reuptake of dopamine.','It mimics adrenaline.','It distorts visual and auditory perception.'],0,'Depressants reduce neural activity. Alcohol only seems like a stimulant because of how people act.'],
['sleep','A doctor prescribes a "downer" to treat a patient\'s insomnia. It increases GABA and has effects similar to alcohol. Which type of drug is it most likely?',['A barbiturate/sedative','A stimulant','A hallucinogen','An amphetamine'],0,'Barbiturates/sedatives: "downers," used for insomnia, alcohol-like, increase GABA, and cause dependence.'],
['sleep','Which drug mimics adrenaline, gives a sense of euphoria followed by a huge crash, and leads to a cycle of addiction?',['Amphetamines','Benzodiazepines','LSD','Codeine'],0,'Amphetamines mimic epinephrine/adrenaline. Meth and ecstasy are forms.'],
['sleep','Which substance is considered both a stimulant and a hallucinogen?',['Ecstasy (MDMA)','Caffeine','Alcohol','Morphine'],0,'Ecstasy/MDMA is on your slides as a form of amphetamine and as a hallucinogen.'],
['sleep','Heavy ecstasy use can permanently lower a person\'s mood and impair memory. Which of the following best explains why?',['It can damage serotonin-producing neurons.','It increases GABA and slows neural activity.','It acts as an agonist for endorphins.','It blocks the reuptake of dopamine.'],0,'Ecstasy can damage serotonin-producing neurons → permanent deflation of mood and memory problems.'],
['sleep','Which drug produces hallucinations and delusions like a psychotic state and can lead to paranoia and panic attacks?',['LSD','THC','Caffeine','Codeine'],0,'LSD can result in psychosis, memory loss, paranoia, panic attacks, nightmares, and aggression.'],
['sleep','THC, the active ingredient in marijuana, is most likely to produce:',['Mild hallucinations, relaxation, and a distorted sense of time','Severe insomnia and heart palpitations','Depressed heartbeat and breathing','A huge crash with strong cravings'],0,'THC: mild hallucinations, euphoria, relaxation, wellbeing, and time distortion.'],
['sleep','Which of the following best explains why opioids such as heroin relieve pain?',['They act as agonists for endorphins, reducing pain and increasing positive feelings.','They block the reuptake of dopamine.','They increase glutamate.','They distort visual and auditory perception.'],0,'Opioids are endorphin agonists.'],
['sleep','With continued opioid use, the brain stops producing its own dopamine and endorphins. This most directly leads to:',['Dependence, tolerance, and withdrawal','Better natural pain control','Narcolepsy','Improved memory'],0,'Opioids result in dependence, tolerance, withdrawal, and physiological and psychological addiction.'],
['sleep','Which of the following correctly matches a drug with its category?',['Caffeine — stimulant','Benzodiazepines — stimulant','LSD — opioid','Codeine — depressant'],0,'Benzodiazepines are depressants, LSD is a hallucinogen, and codeine is an opioid.'],
['sleep','Which of the following best describes the difference between substance use and substance abuse?',['Use doesn\'t interfere with daily functioning; abuse is a pattern that hurts functioning, can be dangerous, and leads to legal trouble.','Use involves illegal drugs; abuse involves legal drugs.','Use happens daily; abuse happens only occasionally.','There is no difference between them.'],0,'Substance use = no interference with daily life. Substance abuse = it inhibits functioning.'],
['sleep','Nina says, "I don\'t even enjoy it anymore, but I can\'t stop wanting it." This best describes:',['Addiction','Tolerance','Substance use','Withdrawal'],0,'Addiction: users want the drug more than they like the drug, and keep using despite consequences.'],
['sleep','Withdrawal is best described as:',['The discomfort and distress that follow stopping an addictive drug, which can be physiological and/or psychological','Needing more of a drug to get the same effect','Using a drug without it affecting daily life','The euphoria right after taking a drug'],0,'Withdrawal can be physiological, psychological, or both. "Needing more" is tolerance.'],
['sleep','A person meets 7 of the DSM-5 criteria for substance use disorder. The disorder would be classified as:',['Mild','Moderate','Severe','Not a disorder'],2,'Your slide: mild = 3, moderate = 4 or 5, severe = 6 or more.'],
['sleep','Which of the following is one of the DSM-5 criteria for substance use disorder?',['Wanting to cut down or stop using but not managing to','Using a substance once at a party','Drinking coffee in the morning','Taking medicine exactly as prescribed'],0,'"Wanting to cut down or stop but not managing to" is criterion 2 on the slide\'s list of 11.'],

['perception','Which of the following best describes selective attention?',['Focusing conscious awareness on one particular stimulus and not something else','Noticing every stimulus in the environment equally','The weakest stimulus a person can detect','Using past experience to interpret what you sense'],0,'Selective attention = focusing on one thing and NOT something else.'],
['perception','In a class demo, the word GREEN is printed in purple ink, and students must say the ink color. Many answer slowly or say "green" by mistake. This demonstrates:',['The Stroop effect','Change blindness','The cocktail party effect','Weber\'s law'],0,'The Stroop effect is the delayed reaction when you must say the color of a word instead of the word itself.'],
['perception','Which of the following is the best example of change blindness?',['Between shots in a movie, an actor\'s drink switches from full to empty, and most viewers don\'t notice.','A driver talking on the phone doesn\'t see a pedestrian in the crosswalk.','At a noisy party, you hear your name from across the room.','You can hear a watch ticking 20 feet away.'],0,'Missing a CHANGE = change blindness. Not seeing the pedestrian at all is inattentional blindness, the trap answer.'],
['perception','Which of the following is the best example of inattentional blindness?',['While focused on texting, Ben walks past a bright yellow car parked right in front of him and never sees it.','An actor\'s shirt changes color between scenes, and viewers miss it.','You notice one red dot in a field of blue dots.','Your music goes from volume 5 to 10, and you notice.'],0,'Failing to see a visible object because attention is elsewhere = inattentional blindness. The shirt is change blindness.'],
['perception','What do change blindness and inattentional blindness have in common?',['Both happen because attention is directed elsewhere.','Both are caused by damage to the occipital lobe.','Both involve hearing rather than vision.','Both are forms of extrasensory perception.'],0,'Both come from attention being directed elsewhere. The difference is missing a change vs. missing an object.'],
['perception','A student is so focused on her notes in a noisy cafeteria that she doesn\'t notice her friend sit down right across from her. Which concept best explains this?',['Inattentional blindness','The cocktail party effect','The absolute threshold','Precognition'],0,'Her friend was fully visible, but her attention was directed elsewhere.'],
['perception','At a crowded school dance, Lena can focus on her friend\'s voice and tune out everyone else. This best illustrates:',['The cocktail party effect','The pop-out phenomenon','Change blindness','The difference threshold'],0,'Focusing auditory attention on one voice while filtering out others is the cocktail party effect.'],
['perception','Which of the following best explains why you might suddenly notice your own name being said across a noisy cafeteria?',['Your brain can register your name even amongst background noise.','Your absolute threshold for sound drops in loud places.','Top-down processing shuts off in noisy places.','Change blindness makes you notice sounds.'],0,'That\'s part of the cocktail party effect on your slides.'],
['perception','In a crowd of people wearing black, one person in a bright orange jacket instantly catches your eye. This is:',['The pop-out phenomenon','Inattentional blindness','The Stroop effect','Clairvoyance'],0,'Something different popping out to get your attention is the pop-out phenomenon.'],
['perception','Which of the following best describes the difference between bottom-up and top-down processing?',['Bottom-up starts with sensory receptors sending information up to the brain (sensation); top-down uses knowledge, experience, and context to interpret it (perception).','Bottom-up uses past experience; top-down uses only the senses.','Bottom-up happens only in vision; top-down only in hearing.','They are two names for the same process.'],0,'Bottom-up = sensation. Top-down = perception.'],
['perception','Looking at a messy handwritten note, you see a squiggle and recognize it as the number 15. Recognizing what the squiggle means is an example of:',['Top-down processing','Bottom-up processing','The absolute threshold','Selective attention'],0,'Your slides: being aware of the squiggle is bottom-up; knowing what it means is top-down.'],
['perception','You can read a paragraph where the middle letters of every word are scrambled, as long as the first and last letters are in place. Which of the following best explains this?',['Top-down processing: the mind reads each word as a whole','Bottom-up processing: the eyes read every letter separately','The Stroop effect','Weber\'s law'],0,'The mind doesn\'t read every letter by itself, but the word as a whole. That\'s top-down.'],
['perception','Which of the following is an example of bottom-up processing?',['Receptors in your skin register the cold of an ice cube and send that information up to the brain','Recognizing a friend\'s messy handwriting because you\'ve seen it before','Reading scrambled words because you know the language','Using the context of a sentence to figure out a smudged word'],0,'Bottom-up = receptors registering information and sending it up. The others all use knowledge or context (top-down).'],
['perception','Which of the following best defines the absolute threshold?',['The weakest amount of a stimulus a person can detect 50% of the time','The smallest change in a stimulus a person can notice 50% of the time','The point at which a stimulus becomes painful','The constant amount a stimulus must change to be noticed'],0,'Absolute = detecting it at all. The second option is the difference threshold, the trap answer.'],
['perception','Which of the following is an example of an absolute threshold?',['Hearing a watch ticking 20 feet away','Noticing your music went from volume 5 to 10','Noticing 1 ounce added to a 10-ounce weight','Not noticing an actor\'s shirt change color'],0,'The watch is the faintest sound you can detect. The other two "noticing" options are about changes (difference threshold).'],
['perception','The difference threshold (just noticeable difference) is best described as:',['The minimum amount something needs to change before a person notices the change 50% of the time','The weakest stimulus a person can detect at all','The ability to focus on one voice in a crowd','Perceiving events you didn\'t witness'],0,'JND = the smallest change you notice half the time.'],
['perception','Weber\'s law states that for a difference to be noticed, two stimuli must differ by:',['A constant percentage','A constant amount','Exactly 1 ounce','At least 50%'],0,'Weber = percentage, not amount.'],
['perception','According to Weber\'s law, which change is a person LEAST likely to notice?',['Adding 1 ounce to a 100-ounce weight','Adding 1 ounce to a 10-ounce weight','Adding 10 ounces to a 100-ounce weight','Adding 5 ounces to a 10-ounce weight'],0,'1 ounce is only 1% of 100 ounces, below the 2% needed for weight. The others are 10% or more.'],
['perception','According to Weber\'s law, about how much must a weight change before a person notices the difference?',['2%','50%','1 ounce, no matter the starting weight','10 ounces'],0,'Your slides: weight must change by 2%.'],
['perception','Which of the following best explains why adding 1 ounce is noticeable on a 10-ounce weight but not on a 100-ounce weight?',['Differences are noticed by percentage, not amount, and 1 ounce is a much bigger percentage of 10 ounces.','Heavier weights raise the absolute threshold for touch.','People use top-down processing only with light weights.','The Stroop effect slows reactions to heavy objects.'],0,'Weber\'s law: a constant percentage, not a constant amount.'],
['perception','A woman claims she can send her thoughts directly into her twin\'s mind. This claim is called:',['Telepathy','Clairvoyance','Precognition','Selective attention'],0,'Telepathy = mind-to-mind communication.'],
['perception','A man claims he dreamed about a car crash the night before it happened. This claim is called:',['Precognition','Telepathy','Clairvoyance','The pop-out phenomenon'],0,'Precognition = perceiving future events.'],
['perception','Which statement about extrasensory perception (ESP) is most accurate?',['There is no scientific basis for it, and psychic visions given to police are no more accurate than other people\'s guesses.','Studies show clairvoyance helps police solve most cases.','Telepathy has been proven in laboratory experiments.','Precognition is a type of bottom-up processing.'],0,'Your slides: no scientific basis, and psychics do no better than guesses.'],
['perception','Which of the following best explains why some people believe psychics are accurate?',['Psychics make so many predictions that some are bound to be right, and people remember the hits and forget the misses.','Psychics have lower absolute thresholds than other people.','Psychics use top-down processing and other people don\'t.','Most psychic predictions turn out to be correct.'],0,'So many predictions → a few hits; people focus on the 1 or 2 correct ones.'],
['perception','Which pair is correctly matched?',['Clairvoyance — perceiving events you didn\'t witness','Telepathy — perceiving future events','Precognition — mind-to-mind communication','Pop-out phenomenon — failing to notice a change'],0,'Telepathy = mind to mind, precognition = the future, and failing to notice a change is change blindness.'],

['research','Which of the following best explains why psychologists rely on research instead of intuition?',['Intuition is distorted by hindsight bias, overconfidence, and misunderstanding of probability.','Intuition is always wrong.','Research never contains errors.','Intuition only works for experts.'],0,'Your slides: psychology exists because intuition is unreliable, due to hindsight bias, misunderstanding of probability, and overconfidence.'],
['research','Which of the following is the correct order of the first four steps of the scientific method?',['Observe → develop a theory → make a hypothesis → test it','Make a hypothesis → observe → replicate → develop a theory','Test → observe → develop a theory → evaluate','Develop a theory → replicate → observe → make a hypothesis'],0,'Observe, theory, hypothesis, test, evaluate, modify, replicate.'],
['research','A researcher decides that "smiling" means at least four teeth showing and "friendly" means the photographer tells at least two jokes. These are:',['Operational definitions','Hypotheses','Confounding variables','Theories'],0,'Operational definitions state exactly how each variable will be measured.'],
['research','Which of the following best explains why operational definitions are important?',['Without them, other researchers can\'t replicate the study.','They guarantee the hypothesis will be supported.','They replace the need for a control group.','They make the sample representative.'],0,'Your slides: research cannot be replicated without operational definitions.'],
['research','A researcher repeats another scientist\'s study with new participants to see whether the results hold up. This is:',['Replication','Debriefing','Sampling bias','Naturalistic observation'],0,'Replicating means doing the research a second time to check that the results are reliable.'],
['research','Which research method is the only one that can establish cause and effect?',['Experiment','Correlational study','Case study','Survey'],0,'Experiments manipulate variables to establish cause and effect.'],
['research','A psychologist spends two years studying one patient with a rare memory disorder in great detail. Which of the following is the biggest weakness of this method?',['The findings may not apply to others, because the patient may be atypical.','It gives too little in-depth information.','It cannot describe behavior.','It always involves deception.'],0,'Case studies can be misleading if the person is atypical, and can lead to overgeneralizing.'],
['research','A researcher wants to know how 2,000 teens feel about social media and needs results quickly. Which method fits best?',['Survey','Case study','Naturalistic observation','Experiment'],0,'Surveys collect a lot of self-reported data in a short time.'],
['research','Which of the following is a disadvantage of naturalistic observation?',['Subjects may notice the observer and act differently.','Subjects behave less honestly than in a lab.','It requires manipulating variables.','It only studies one person.'],0,'It\'s non-invasive, but subjects may become aware of the observer, and it can be time consuming.'],
['research','As hours of sleep decrease, levels of stress increase. Which type of correlation is this?',['Negative','Positive','Zero','Perfect positive'],0,'One goes down while the other goes up: negative.'],
['research','As salary decreases, spending also decreases. Which type of correlation is this?',['Positive','Negative','Zero','It isn\'t a correlation'],0,'Both move in the same direction (both decrease), so it\'s positive. Positive doesn\'t mean "good."'],
['research','Which correlation coefficient shows the strongest relationship?',['-0.9','+0.5','0','+0.3'],0,'Strength is how close the number is to +1 or -1. The sign only shows direction.'],
['research','A study finds that students who eat breakfast earn higher grades. Which conclusion is most appropriate?',['Breakfast and grades are related, but the study can\'t show that breakfast causes better grades.','Eating breakfast causes higher grades.','Higher grades cause students to eat breakfast.','There is no relationship between them.'],0,'Correlation does not equal causation. Another factor could explain both.'],
['research','Ice cream sales and sunburns rise together. According to your slides, which of the following best explains this?',['Hot, sunny summer weather causes both.','Ice cream causes sunburns.','Sunburns make people buy ice cream.','It\'s a negative correlation.'],0,'A third factor (summer weather) causes both, so they\'re correlated without one causing the other.'],
['research','A researcher randomly picks 500 names from a list of every student in a school, so every student has an equal chance of being chosen. This is a:',['Representative (random) sample','Population','Control group','Case study'],0,'Everyone having an equal chance of inclusion makes it a representative random sample. The whole school is the population.'],
['research','Plants are randomly put in a room with music or a silent room, and their height is measured after a month. What is the independent variable?',['Whether the plants hear music','Plant height','The type of plant','The length of the study'],0,'The IV is what the researcher manipulates.'],
['research','In the same plant study, what is the dependent variable?',['Plant height','Whether the plants hear music','The silent room','The type of plant'],0,'The DV is what gets measured.'],
['research','A study tests whether exercise causes weight loss, but the exercise group also happened to eat healthier food. Diet is a:',['Confounding variable','Dependent variable','Independent variable','Control group'],0,'An outside influence that affects the results is a confounding variable. Your slides list diet, sleep, and genetics for this exact example.'],
['research','Patients given a sugar pill they believe is a pain medication report feeling less pain. This is the:',['Placebo effect','Hawthorne effect','Barnum effect','Gambler\'s fallacy'],0,'Results caused by expectations alone are the placebo effect.'],
['research','A horoscope says, "You sometimes doubt yourself, but you have hidden strengths," and Mia thinks it describes her perfectly. This is the:',['Barnum effect','Hindsight bias','Placebo effect','Self-report bias'],0,'Believing a general description applies specifically to you is the Barnum effect.'],
['research','After a coin lands heads five times in a row, Leo bets on tails because tails is "due." This is:',['Gambler\'s fallacy','Overconfidence','Hindsight bias','The Barnum effect'],0,'Seeing patterns in random data is the gambler\'s fallacy. Each flip is still 50/50.'],
['research','A survey asks, "Don\'t you agree that dangerous video games should be banned?" The biggest problem with this question is:',['Wording effects (framing)','The placebo effect','The Hawthorne effect','Debriefing'],0,'The wording pushes people toward one answer.'],
['research','A researcher studying the exercise habits of all Americans surveys only members of one gym. The main problem is:',['Sampling bias','The placebo effect','Hindsight bias','Wording effects'],0,'The sample doesn\'t represent the population, so the results will be skewed.'],
['research','Before a study begins, participants are told what it involves so they can decide whether to take part. This is:',['Informed consent','Debriefing','Confidentiality','Replication'],0,'Informed consent comes before; debriefing comes after.'],
['research','Which of the following would violate the APA\'s ethical guidelines?',['Publishing participants\' names and personal answers without permission','Debriefing participants after a study','Letting people choose whether to participate','Getting approval from a research institution'],0,'That breaks confidentiality. The other three are required guidelines.'],
['research','Overconfidence is best described as:',['Overestimating your knowledge and/or ability','Believing you knew the outcome all along','Seeing patterns in random data','Giving answers that make you look good'],0,'The others are hindsight bias, gambler\'s fallacy, and social desirability bias.'],
['research','Participants in a study answer questions in ways they think the researcher wants, or exaggerate how good they are. This is:',['Self-report bias','Sampling bias','The placebo effect','The gambler\'s fallacy'],0,'Self-report bias: trying to affect the outcome, please the researcher, or being unrealistic about yourself.'],

['perspectives','Antonio is feeling much healthier now that he is focusing on his positive traits and having good relationships. Which perspective fits best?',['Humanistic','Biological','Psychodynamic','Behavioral'],0,'Positivity, relationships, and well-being are humanistic.'],
['perspectives','Which perspective is based heavily on the ideas of Freud?',['Psychodynamic','Humanistic','Cognitive','Sociocultural'],0,'Psychodynamic: the unconscious mind and childhood experiences.'],
['perspectives','Which perspective focuses on genetics, brain chemistry, hormones, and neurotransmitters?',['Biological','Evolutionary','Cognitive','Behavioral'],0,'That\'s the biological perspective. Evolutionary is about survival and reproduction.'],
['perspectives','Which perspective emphasizes memory, problem solving, intelligence, and perception?',['Cognitive','Behavioral','Humanistic','Psychodynamic'],0,'Cognitive = internal thought processes.'],
['perspectives','Which of the following best describes the behavioral perspective?',['Behavior is shaped by learned experiences, and rewarded behaviors tend to be repeated.','Behavior comes from the unconscious mind.','Behavior is mostly determined by genes.','Behavior depends on a person\'s culture.'],0,'Behavioral = learning and rewards.'],
['perspectives','Which of the following best describes the evolutionary perspective?',['Behaviors exist because they helped our ancestors survive and reproduce.','Behavior is shaped by childhood memories.','Behavior is shaped by social norms.','Behavior depends on how we think about situations.'],0,'Evolutionary = protection, adaptive behavior, and reproduction.'],
['perspectives','Charles has a terrible fear of spiders. Which explanation fits the evolutionary perspective?',['Fearing spiders helped his ancestors avoid dangerous bites and survive.','A frightening spider experience from early childhood is affecting him unconsciously.','His thoughts about spiders are exaggerated and unrealistic.','In his culture, spiders are treated as scary and disgusting.'],0,'Survival advantage for ancestors = evolutionary. The others are psychodynamic, cognitive, and sociocultural.'],
['perspectives','Charles has a terrible fear of spiders. Which explanation fits the psychodynamic perspective?',['A frightening spider experience from early childhood is affecting him unconsciously.','Fearing spiders helped his ancestors survive.','His brain chemistry makes him more anxious.','People around him taught him spiders are gross.'],0,'Unconscious mind + childhood = psychodynamic.'],
['perspectives','Charles has a terrible fear of spiders. Which explanation fits the cognitive perspective?',['He believes every spider he sees could kill him, and those thoughts drive his fear.','He inherited a gene linked to anxiety.','In his culture, spiders are seen as dangerous.','He has an unconscious memory of being bitten.'],0,'Cognitive = how thought processes shape behavior.'],
['perspectives','Charles has a terrible fear of spiders. Which explanation fits the sociocultural perspective?',['In his culture, spiders are commonly treated as scary and disgusting.','Fearing spiders helped his ancestors survive.','His neurotransmitter levels are unusual.','He focuses on his potential to overcome fear.'],0,'Culture or way of life = sociocultural.'],
['perspectives','Suzanne loves romantic comedy movies. Which explanation uses the biological perspective?',['Watching them causes her brain to release feel-good chemicals like dopamine.','In her culture, it\'s popular for women to enjoy romantic movies.','She was often taken to romantic movies as a child.','She enjoys predicting how the plot will turn out.'],0,'Brain chemistry and neurotransmitters = biological. The culture answer is your slide\'s sociocultural example.'],
['perspectives','A therapist helps a client focus on free will, self-actualization, and reaching their full potential. Which perspective is the therapist using?',['Humanistic','Psychodynamic','Behavioral','Biological'],0,'Free will, self-efficacy, and self-actualization are humanistic.'],
['perspectives','A psychologist argues that a teen\'s aggression is mostly due to high testosterone levels. Which perspective is this?',['Biological','Sociocultural','Cognitive','Humanistic'],0,'Hormones = biological.'],
['perspectives','A researcher compares how families in different countries discipline their children, expecting differences based on each country\'s way of life. Which perspective is this?',['Sociocultural','Evolutionary','Psychodynamic','Cognitive'],0,'Differences based on culture or way of life = sociocultural.'],
['perspectives','Which of the following best explains why psychologists use different perspectives?',['Each one is like a different set of lenses, giving a different explanation of the same behavior.','Only one perspective can be correct.','Each perspective is used for only one type of behavior.','Perspectives are only used to diagnose disorders.'],0,'Your slides: perspectives are like viewing situations through different lenses. A behavior can be explained by several.'],

['stats','Which of the following best describes the purpose of descriptive statistics?',['To organize and summarize data meaningfully','To decide whether results apply to a whole population','To manipulate variables','To prove cause and effect'],0,'Descriptive statistics organize data. Deciding whether results generalize is inferential statistics.'],
['stats','Which type of graph is a bar graph that shows a frequency distribution?',['Histogram','Scatterplot','Pie chart','Line graph'],0,'Histograms show frequency distributions and make patterns quick to spot.'],
['stats','What is the mean of 3, 5, 7, 9, 11, 13?',['8','7','9','6'],0,'3 + 5 + 7 + 9 + 11 + 13 = 48, and 48 ÷ 6 = 8.'],
['stats','What is the median of 4, 10, 6, 2, 8, 12?',['7','6','8','10'],0,'In order: 2, 4, 6, 8, 10, 12. The two middle numbers are 6 and 8, so the median is (6 + 8) ÷ 2 = 7.'],
['stats','For the data 2, 3, 3, 5, 9, 9, 9, 12, which statement is correct?',['Mode = 9, median = 7, mean = 6.5','Mode = 3, median = 5, mean = 6.5','Mode = 9, median = 5, mean = 7','Mode = 9, median = 7, mean = 7'],0,'9 appears most (mode). Middle two are 5 and 9, so the median is 7. Sum is 52, and 52 ÷ 8 = 6.5.'],
['stats','Scores: 55, 70, 70, 85, 100. What is the range?',['45','70','76','100'],0,'100 − 55 = 45. (70 is the mode and median; 76 is the mean.)'],
['stats','Which of the following best explains why standard deviation is a more useful measure of variation than the range?',['It shows how much all the scores vary around the mean, not just the gap between the two extremes.','It is easier to calculate.','It shows the most common score.','It is always smaller than the mean.'],0,'The range only uses the highest and lowest scores, so it\'s just a rough estimate.'],
['stats','Class A and Class B both averaged 80 on a test. Class A\'s standard deviation is 3; Class B\'s is 15. Which statement is true?',['Class B\'s scores are more spread out.','Class A\'s scores are more spread out.','Class B scored higher on average.','Both classes have the same spread.'],0,'A bigger standard deviation means scores are more dispersed around the mean.'],
['stats','IQ scores have a mean of 100 and a standard deviation of 15. About what percent of people score between 85 and 115?',['68%','95%','50%','99%'],0,'85–115 is within 1 standard deviation of the mean: about 68%.'],
['stats','On the same IQ scale, about 95% of people score between:',['70 and 130','85 and 115','55 and 145','100 and 130'],0,'Within 2 standard deviations (2 × 15 = 30 points) of 100.'],
['stats','A billionaire moves into a small town where most families earn very little. Which measure best describes a typical family\'s income?',['Median','Mean','Range','Standard deviation'],0,'The outlier pulls the mean way up. Your slides say the median and mode give a fuller picture.'],
['stats','Which statement is true of a positively skewed distribution?',['Mean > median > mode','Mean < median < mode','Mean = median = mode','The tail goes to the left'],0,'Positive skew: tail to the right, and the mean follows the tail.'],
['stats','In a negatively skewed distribution, the tail points:',['Left, and the mean is pulled left','Right, and the mean is pulled right','Left, and the mode is pulled left','Nowhere, because it\'s symmetrical'],0,'Negative skew = tail to the left. The mean always follows the tail.'],
['stats','Most families in a town earn $20,000–$50,000, but a few earn millions. How is income in this town distributed?',['Positively skewed','Negatively skewed','Symmetrical','Bimodal'],0,'A few very high values make a tail to the right: positive skew.'],
['stats','A graph of the heights of a group of kindergartners and their parents has two clear peaks. This is a:',['Bimodal distribution','Positive skew','Negative skew','Normal curve'],0,'"Bi" means two: two peaks = bimodal.'],
['stats','Which statement best describes inferential statistics?',['They help determine whether results can be generalized to a larger population.','They organize data into histograms.','They find the middle score.','They measure how spread out scores are.'],0,'Inferential statistics check that results aren\'t just chance fluctuations in the sample.'],
['stats','Which is one of the three key principles of inferential statistics on your slides?',['Bigger samples are better than small ones.','Fewer estimates are better than more estimates.','Unrepresentative samples are better than representative ones.','One study is enough to generalize.'],0,'The three: representative samples, bigger samples, and more estimates are better.'],
['stats','Why is meta-analysis useful?',['It combines the estimates of many studies instead of relying on just one.','It studies one person in depth.','It removes the need for a sample.','It guarantees that results are significant.'],0,'More estimates are better than fewer estimates.'],
['stats','Alex asks two friends about each café and decides Café Mocha is better. Which of the following best explains why her conclusion isn\'t reliable?',['Her sample is small and unrepresentative.','Her p-value is too small.','She used a control group.','Her effect size is too large.'],0,'Your slide names both problems: unrepresentative samples and small sample size.'],
['stats','A study reports p = .20. Which conclusion is correct?',['The result is not statistically significant; it could easily be due to chance.','The result is significant because .20 is small.','The effect size is 20 points.','20% of participants improved.'],0,'Significant means p ≤ .05. .20 is too high.'],
['stats','Which statement about p-values and effect size is correct?',['A p-value tells whether an effect likely exists; effect size tells how strong it is.','They mean the same thing.','Effect size tells whether a result is due to chance.','A larger p-value means a stronger effect.'],0,'Your slides: unlike p-values, effect size tells how strong the effect is.'],
['stats','Students using a new study technique averaged 85; students studying as usual averaged 75. According to your slides, the 10-point difference is the:',['Effect size','P-value','Range','Percentile rank'],0,'Effect size shows the practical importance of the result: 85 − 75 = 10.'],
['stats','Ty is in the 70th percentile on a psychology test. This means:',['He scored higher than 70% of his peers.','He got 70% of the questions right.','He scored 70 points.','70% of students scored higher than him.'],0,'Percentile rank = the percentage of scores below yours.'],

['health','Which of the following best describes what happens when stress activates the sympathetic nervous system?',['Hormones like cortisol are released, which can lead to hypertension, headaches, and immunosuppression.','The parasympathetic system shuts down permanently.','Leptin levels rise and hunger disappears.','The body immediately returns to baseline.'],0,'Stress → sympathetic nervous system → cortisol → hypertension, headaches, immunosuppression.'],
['health','Which of the following is the best example of eustress?',['Preparing for a wedding you\'re excited about','Being stuck in traffic every day','Going through a divorce','Living through a natural disaster'],0,'Eustress = challenging but manageable "good" stress. The others are distress.'],
['health','A dead phone, no Wi-Fi, and a deadline in the same afternoon are examples of:',['Daily hassles','Catastrophes','Significant life changes','Eustress'],0,'Daily hassles are everyday distress.'],
['health','Which of the following is an example of household dysfunction as an ACE?',['Having a parent who is incarcerated','Moving to a new school','Failing a test','Getting a new sibling'],0,'Household dysfunction: substance abuse, domestic violence, parent with mental illness, or an incarcerated parent.'],
['health','Which of the following best explains why people with many ACEs face higher health risks as adults?',['Stress during childhood affects a child\'s brain and health as they grow into adults.','ACEs only affect children until age 17.','ACEs are caused by genetic disorders.','ACEs make people less likely to smoke.'],0,'Your slide: ACEs affect a child\'s brain and health as they grow up, raising risks like heart disease and depression.'],
['health','In which stage of the General Adaptation Syndrome is the body still in high stress, with cortisol and epinephrine flowing and reserves being used up?',['Resistance','Alarm','Exhaustion','Recovery'],0,'Alarm = immediate fight-or-flight; resistance = sustained stress; exhaustion = depleted.'],
['health','Which statement best describes the tend-and-befriend theory?',['Under stress, some people, mainly women, respond by caring for others and building social connections instead of fight-or-flight.','Stress always triggers fight-or-flight.','People under stress avoid all social contact.','Stress causes the body to become exhausted immediately.'],0,'It\'s part of evolutionary psychology: protecting offspring and building support.'],
['health','Which of the following best describes the difference between problem-focused and emotion-focused coping?',['Problem-focused coping changes the stressor itself; emotion-focused coping changes how you feel about it.','Problem-focused coping is always better.','Emotion-focused coping deals with the root cause.','They are the same thing.'],0,'Problem-focused = fix the problem. Emotion-focused = regulate the feeling.'],
['health','When is emotion-focused coping most likely to be used?',['When the stressor seems uncontrollable','When the stressor can easily be changed','Only during the alarm stage','Only by people with ACEs'],0,'Problem-focused coping works best when the stressor can be changed or controlled.'],

['disorders','According to your slides, professionals label thoughts, feelings, and behaviors as a disorder when they are:',['Deviant, dysfunctional/maladaptive, and distressing','Rare, harmless, and temporary','Genetic, chronic, and dangerous','Diagnosed, treated, and cured'],0,'The 3 Ds.'],
['disorders','A man believes that wearing his lucky socks helps his team win, but he functions well and isn\'t bothered by it. Why is this NOT considered a disorder?',['It isn\'t dysfunctional or distressing','It isn\'t a real belief','Only women can have disorders','It isn\'t in the DSM-5'],0,'A disorder needs all 3 Ds, not just being unusual.'],
['disorders','Which approach explains disorders through chemical imbalances, genetics, tumors, or brain structure?',['Biological','Psychodynamic','Humanistic','Sociocultural'],0,'Biological = medical/genetic issues and neurotransmitters/hormones.'],
['disorders','Which approach explains disorders as responses learned through conditioning and reinforcement?',['Behavioral','Cognitive','Evolutionary','Psychodynamic'],0,'Behavioral = learned through the environment.'],
['disorders','A therapist believes a client\'s anxiety comes from unconscious conflicts rooted in childhood. Which approach is this?',['Psychodynamic','Humanistic','Behavioral','Biological'],0,'Psychodynamic = unconscious thoughts and childhood experiences.'],
['disorders','Which approach says disorders result from a lack of social support and not being able to reach your full potential?',['Humanistic','Cognitive','Sociocultural','Evolutionary'],0,'Humanistic = potential and support.'],

['anxiety','Which of the following best describes anxiety disorders?',['Persistent, excessive worry and fear that significantly interfere with daily life','Brief nervousness before a test','Extreme mood swings between mania and depression','A loss of connection between thoughts and identity'],0,'That\'s the slide\'s definition; GAD, panic disorder, and phobias are examples.'],
['anxiety','Which of the following best describes a specific phobia?',['An intense or irrational fear that is out of proportion to the actual threat','Constant worry about many everyday things','Sudden panic attacks for no reason','A fear of being judged in social situations'],0,'Specific phobias are tied to a particular object or situation.'],
['anxiety','Which disorder is described as "nonspecific anxiety and fear" lasting at least 6 months?',['Generalized anxiety disorder','Specific phobia','Panic disorder','Agoraphobia'],0,'GAD worry isn\'t tied to one specific thing.'],
['anxiety','A key symptom of panic disorder is:',['Anxiety about having more panic attacks','Fear of one specific object','Constant worry about money','Avoiding eye contact'],0,'Panic disorder: panic attacks plus anxiety about having panic attacks.'],
['anxiety','Which of the following is a cognitive symptom of agoraphobia?',['Intense fear of being trapped or unable to escape','Sweating and tremors','Staying home','Rapid heartbeat'],0,'Sweating, tremors, and rapid heartbeat are physical; staying home is behavioral.'],
['anxiety','A child becomes terrified of dogs after watching her mother scream every time a dog walks by. Which cause of anxiety disorders does this show?',['Behavioral (modeling)','Biological','Genetic','Cognitive'],0,'Behavioral causes include modeling anxiety responses from others.'],
['anxiety','Which neurotransmitter imbalances do your slides link to anxiety disorders?',['Serotonin and GABA','Dopamine and glutamate','Acetylcholine and endorphins','Melatonin and leptin'],0,'Biological cause: imbalances in serotonin and GABA, plus hormonal imbalances.'],

['mood','Which of the following best describes depressive disorders?',['A sad, empty, or irritable mood with physical and cognitive changes that affect functioning','A temporary bad mood after a disappointment','Extreme mood swings between mania and depression','Persistent fear of social situations'],0,'Depression is a mental health condition, not just a temporary mood swing.'],
['mood','What is the key time difference between major depressive disorder and persistent depressive disorder?',['MDD lasts 2+ weeks; persistent depressive disorder lasts 2+ years','MDD lasts 2+ years; persistent lasts 2+ weeks','Both last 6 months','There is no time requirement'],0,'MDD = 2 weeks. Persistent = 2 years.'],
['mood','Changes in sleep in major depressive disorder can include:',['Insomnia or hypersomnia','Only sleepwalking','Only narcolepsy','No changes in sleep'],0,'Your slide: changes in sleep (insomnia or hypersomnia).'],
['mood','Why would someone with long-term depression who also has a manic episode NOT be diagnosed with persistent depressive disorder?',['A manic episode means it would most likely be bipolar disorder','Mania shortens the depression','Manic episodes only happen in children','Persistent depressive disorder requires mania'],0,'Persistent depressive disorder requires no manic episodes.'],
['mood','Which of the following is a symptom of a manic episode?',['Decreased need for sleep and racing thoughts','Persistent sadness and fatigue','Loss of interest in activities','Feelings of worthlessness'],0,'The other three are depressive-episode symptoms.'],
['mood','Which statement correctly compares Bipolar I and Bipolar II?',['Bipolar I has full mania and can include psychosis; Bipolar II has hypomania and no psychosis.','Bipolar II is more severe than Bipolar I.','Bipolar I never includes depression.','Bipolar II includes hallucinations.'],0,'Bipolar II is less severe but more common.'],
['mood','Which neurotransmitters do your slides link to both depressive and bipolar disorders?',['Serotonin, dopamine, and norepinephrine','GABA and glutamate only','Acetylcholine and endorphins','Melatonin and oxytocin'],0,'Both slides list imbalances in serotonin, dopamine, and norepinephrine.'],
['mood','Family histories and twin studies of depression suggest that:',['There is a genetic component','Depression is caused only by stress','Depression cannot run in families','Twins never share disorders'],0,'Your slide: family histories and twin studies indicate a genetic component.'],

['neurodev','Which of the following best describes neurodevelopmental disorders?',['Issues in central nervous system functioning that begin to appear in early childhood','Disorders that always start in adulthood','Disorders caused only by trauma','Disorders involving false beliefs and perceptions'],0,'They involve social, intellectual, academic, or interpersonal functioning.'],
['neurodev','ADHD is characterized by a persistent pattern of:',['Inattention and/or hyperactivity-impulsivity','Mania and depression','Obsessions and compulsions','Delusions and hallucinations'],0,'That pattern must interfere with functioning or development.'],
['neurodev','Which of the following is an inattention symptom of ADHD?',['Often loses things and is easily distracted','Talks excessively','Blurts out answers','Runs and climbs excessively'],0,'Talking excessively and running are hyperactivity; blurting out is impulsivity.'],
['neurodev','For an ADHD diagnosis, several symptoms must be present:',['Before age 12 and in two or more settings','Only at school','After age 18','For at least two weeks'],0,'Before 12, in 2+ settings, for 6+ months.'],
['neurodev','Why can it be difficult to diagnose ADHD in very young children?',['Many ADHD symptoms also occur in children without ADHD','ADHD can\'t exist before age 12','Young children never fidget','There is no test for ADHD in any age group'],0,'Average onset is around age 8; earlier, normal kid behavior looks similar.'],
['neurodev','Why is autism called a "spectrum" disorder?',['Its symptoms range from mild to severe','It affects all five senses','It only appears in boys','It changes color perception'],0,'Your slide: symptoms range from mild to severe.'],
['neurodev','ADHD and ASD both have high heritability. This means they:',['Tend to run in families, suggesting a strong genetic component','Are always caused by teratogens','Can be cured with medication','Only appear after trauma'],0,'Heritability = tends to run in families.'],
['neurodev','According to your slides, ASD is:',['Over 3 times more common in boys than girls','More common in girls','Equally common in boys and girls','Found only in adults'],0,'About 1 in 31 children aged 8; over 3 times more common in boys.'],

['dissoc','Which of the following best describes dissociative disorders?',['A loss of connection between thoughts, memories, feelings, surroundings, behavior, and identity','Hearing voices that aren\'t there','Extreme highs and lows in mood','Fear of open spaces'],0,'They involve escaping from reality in unhealthy ways.'],
['dissoc','Which of the following is a symptom of dissociative amnesia?',['Loss of autobiographical information, like personal identity or relationships','Hearing voices','Grandiosity','Excessive hand washing'],0,'Dissociative amnesia = inability to recall important personal information.'],
['dissoc','The distinct personality states in dissociative identity disorder are called:',['Alters','Obsessions','Delusions','Diatheses'],0,'Each alter has its own identity, memories, behaviors, and perspectives.'],
['dissoc','Which of the following is the best example of a fugue state?',['A woman travels to another city and doesn\'t know who she is','A man feels sad for two weeks','A child is afraid of dogs','A student can\'t focus in class'],0,'Fugue: wandering or traveling without awareness of identity or situation.'],
['dissoc','Which statement best distinguishes DID from schizophrenia?',['DID involves multiple distinct identities; schizophrenia involves psychosis like delusions and hallucinations','They are the same disorder','Schizophrenia involves multiple personalities','DID is caused by too much dopamine'],0,'"Split personality" is DID, not schizophrenia.'],

['schizo','To be diagnosed on the schizophrenia spectrum, a patient must have:',['At least 2 symptoms for at least 6 months','One symptom for 2 weeks','Only negative symptoms for 1 month','Symptoms before age 12'],0,'Your slide: at least 2 symptoms (positive and negative) for at least 6 months.'],
['schizo','Why did the DSM-5 place schizophrenia on a spectrum?',['People experience its symptoms in a variety of ways','It only has one symptom','It is the same as bipolar disorder','It always has the same severity'],0,'It\'s a spectrum of psychotic disorders.'],
['schizo','Which of the following is a positive symptom of schizophrenia?',['Hallucinations','Flat affect','Catatonic stupor','Lack of motivation'],0,'Positive = added. The others are negative (absent).'],
['schizo','A patient says, "The table sky running blue mustard because seven." This is an example of:',['Word salad (disorganized speech)','A delusion of grandeur','Flat affect','A hallucination'],0,'Stringing words together in an unusual way = word salad.'],
['schizo','A man believes he is a famous king chosen to save the world. This is a:',['Delusion of grandeur','Delusion of persecution','Hallucination','Negative symptom'],0,'Grandeur = false belief of importance.'],
['schizo','According to the dopamine hypothesis, what causes the positive symptoms of schizophrenia?',['An overproduction of dopamine','Too little serotonin','Too much GABA','Low levels of acetylcholine'],0,'This is also why antipsychotics block dopamine receptors.'],
['schizo','Which of the following is listed on your slides as a cause of schizophrenia?',['Prenatal exposure to viruses like flu, herpes, or rubella','Too much sleep','A fear of heights','Excessive exercise'],0,'Also genetics and imbalances in dopamine and glutamate.'],
['schizo','The diathesis-stress model suggests that:',['Stress can trigger a genetic or biological predisposition to mental illness','Genes alone always cause mental illness','Stress alone always causes mental illness','Mental illness only comes from childhood'],0,'Diathesis = predisposition; stress = the trigger.'],

['ocdptsd','In OCD, obsessions are best described as:',['Recurrent and persistent intrusive thoughts','Repetitive behaviors the person feels driven to perform','False perceptions','Mood swings'],0,'Obsessions = thoughts; compulsions = actions.'],
['ocdptsd','Which sequence matches the OCD cycle?',['Obsession → distress → compulsion → relief','Compulsion → obsession → relief → distress','Relief → obsession → compulsion → distress','Distress → relief → obsession → compulsion'],0,'The relief reinforces the compulsion, and the cycle repeats.'],
['ocdptsd','How did the DSM-5 change the classification of OCD?',['It moved OCD and related disorders out of anxiety disorders into their own category','It removed OCD from the DSM','It made OCD a personality disorder','It combined OCD with schizophrenia'],0,'This showed they are distinct from anxiety disorders.'],
['ocdptsd','Which neurotransmitter is OCD linked to being too low?',['Serotonin','Dopamine','Endorphins','Melatonin'],0,'Your slide: low serotonin plus imbalances in GABA and glutamate.'],
['ocdptsd','Which of the following is one of the DSM-5 criteria for hoarding disorder?',['Persistent difficulty discarding possessions regardless of their actual value','Fear of germs','Hearing voices','Binge eating'],0,'Plus distress at discarding and clutter that compromises living areas.'],
['ocdptsd','PTSD, acute stress disorder, and adjustment disorders have similar symptoms but differ in:',['How long they last','Whether trauma is involved','Which neurotransmitter is involved','Whether they affect adults'],0,'All three result from exposure to a traumatic or stressful event.'],
['ocdptsd','Which of the following is a symptom of PTSD?',['Hypervigilance, or always being on guard','Grandiosity','Word salad','Loss of autobiographical memory only'],0,'Also intrusive thoughts, nightmares, flashbacks, anxiety, depression, and sleep problems.'],

['eating','Which of the following is a primary symptom of anorexia nervosa?',['Intense fear of gaining weight even though underweight','Eating large amounts in two hours','Hearing voices','Fear of open spaces'],0,'Anorexia also includes refusing to maintain a minimally normal weight.'],

const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- Flashcards ---------- */
function buildQueue(){
  let cs = cardsNow();
  if(S.set.fcPool==='unknown'){const u=cs.filter(c=>!S.known[c.id]); if(u.length) cs=u;}
  else if(S.set.fcPool==='weak') cs=cs.filter(c=>S.miss[c.id]);
  S.fc = {q:(S.set.fcOrder==='shuffle'?shuffle(cs):cs).map(c=>c.id), i:0, flipped:false, seen:0, total:cs.length};
}
const POOL_NAME = {unknown:'cards you don\'t know yet', all:'all cards', weak:'trouble terms (ones you\'ve missed)'};
const POOL_NEXT = {unknown:'all', all:'weak', weak:'unknown'};
function renderCards(){
  if(!S.fc) buildQueue();
  const f=S.fc;
  const top = `<div class="fc-top"><span class="label">${f.q.length?`${Math.min(f.seen+1,f.total)} / ${f.total}`:''} · ${POOL_NAME[S.set.fcPool]}</span>
    <div class="toggle">
      <button class="btn small" data-act="front" aria-pressed="${S.fcFront==='def'}">${S.fcFront==='term'?'Show definition first':'Show term first'}</button>
      <button class="btn small" data-act="only">Switch to: ${POOL_NAME[POOL_NEXT[S.set.fcPool]].replace(/ \(.*\)/,'')}</button>
      <button class="btn small" data-act="shuffle">${S.set.fcOrder==='shuffle'?'Shuffle':'Restart'}</button>
    </div></div>`;
  if(!f.q.length){
    if(S.set.fcPool==='weak'&&!f.total){$('#view').innerHTML=top+`<div class="done"><h2>No trouble terms yet.</h2><p class="deck-sub" style="margin:10px auto 18px">Terms you miss in Learn lessons show up here. Nothing in this set so far.</p><div class="toggle" style="justify-content:center"><button class="btn primary" data-act="pool-all">Study all cards instead</button></div></div>`;return}
    const all = cardsNow().every(c=>S.known[c.id]);
    $('#view').innerHTML = top+`<div class="done"><h2>${all?'You know every card in this set.':'Round done.'}</h2><p class="deck-sub" style="margin:10px auto 18px">${all?'Test yourself with the quiz, or include known cards to review again.':'Cards you marked “still learning” will come back in the next round.'}</p><div class="toggle" style="justify-content:center"><button class="btn primary" data-act="again">Start another round</button><button class="btn" data-goto="quiz">Take a quiz</button></div></div>`;
    return;
  }
  const c = CARDS.find(x=>x.id===f.q[f.i]);
  const termSide = `<div class="big">${esc(c.t)}</div>`;
  const defSide = `<div class="def">${esc(c.x)}${hookHtml(c)}</div>`;
  const showTerm = (S.fcFront==='term') !== f.flipped;
  $('#view').innerHTML = top+`
    <button class="card" data-act="flip" aria-label="Flip card">
      <span class="corner"><span class="dot" style="${dotStyle(c.d)}"></span><span class="label">${esc(deckById[c.d].name)} · ${esc(c.s)}</span></span>
      <div class="face">${showTerm?termSide:defSide}${f.flipped?`<div style="margin-top:14px" class="label">${showTerm?'':esc(c.t)}</div>`:''}</div>
      <span class="flipnote">${f.flipped?'':'Tap to flip'}</span>
    </button>
    <div class="fc-actions">
      <button class="btn bad" data-act="learning">Still learning</button>
      <button class="btn good" data-act="got">Got it</button>
    </div>
    <div class="kbd">Keyboard: Space = flip · 1 = still learning · 2 = got it</div>`;
}
function fcAnswer(got){
  const f=S.fc, id=f.q[f.i];
  setKnown(id,got);
  f.q.splice(f.i,1); f.seen++;
  if(!got){ f.q.splice(Math.min(f.q.length,4),0,id); f.total++; }
  f.flipped=false; if(f.i>=f.q.length) f.i=0;
  renderCards();
}

/* ---------- Quiz ---------- */
function genQuestion(c, pool, nOpts){
  pool = (pool||cardsNow()).filter(x=>x.id!==c.id); nOpts = nOpts||4;
  const same = shuffle(pool.filter(x=>x.d===c.d&&x.s===c.s));
  const deck = shuffle(pool.filter(x=>x.d===c.d&&x.s!==c.s));
  const rest = shuffle(pool.filter(x=>x.d!==c.d)).concat(shuffle(CARDS.filter(x=>x.d!==c.d&&inAll(x.d))));
  const seen = new Set([c.id]), distract = [];
  same.concat(deck,rest).forEach(x=>{if(distract.length<nOpts-1&&!seen.has(x.id)){seen.add(x.id);distract.push(x)}});
  const dir = S.set.quizDir, reverse = dir==='term'?true:dir==='def'?false:Math.random()<0.3;
  const all = shuffle([c].concat(distract));
  return reverse
    ? {kind:'card', type:'mc', card:c, ask:'Which definition matches this term?', prompt:c.t, opts:all.map(x=>x.x), ans:all.indexOf(c), exp:`${c.t}: ${c.x}`}
    : {kind:'card', type:'mc', card:c, ask:'Which term matches this definition?', prompt:c.x, opts:all.map(x=>x.t), ans:all.indexOf(c), exp:`${c.t}: ${c.x}`+(c.h&&S.set.hooks?` (Hook: ${c.h})`:'')};
}
// True/false: half the time the definition shown belongs to a different, nearby term.
function tfQuestion(c, pool){
  let shown=c;
  if(Math.random()<0.5){
    const near=shuffle(pool.filter(x=>x.id!==c.id&&x.d===c.d&&x.s===c.s)).concat(shuffle(pool.filter(x=>x.id!==c.id&&x.d===c.d)),shuffle(pool.filter(x=>x.id!==c.id)));
    shown=near.find(x=>x.x!==c.x)||c;
  }
  return {kind:'card', type:'tf', card:c, ask:'True or false?', prompt:`${c.t}: ${shown.x}`, opts:['True','False'], ans:shown===c?0:1,
    exp:shown===c?`True. ${c.t}: ${c.x}`:`False. That describes ${shown.t}. ${c.t}: ${c.x}`};
}
function scenQuestion(s){
  const o=shuffle(s[2].map((t,i)=>({t,i})));
  return {kind:'scen', type:'scen', deck:s[0], ask:'Apply it', prompt:s[1], opts:o.map(x=>x.t), ans:o.findIndex(x=>x.i===s[3]), exp:s[4]};
}
function examQuestion(e){
  const o=shuffle(e[2].map((t,i)=>({t,i})));
  return {kind:'scen', type:'exam', deck:e[0], ask:'Choose the best answer', prompt:e[1], opts:o.map(x=>x.t), ans:o.findIndex(x=>x.i===e[3]), exp:e[4]};
}
const TYPE_NAME={exam:'Exam-style',mc:'Multiple choice',tf:'True / false',scen:'Scenarios'};
function newQuiz(qs, extra){
  S.quizNote='';
  S.quiz=Object.assign({qs,i:0,picked:null,right:0,missed:[],res:[],n:qs.length,answers:[]},extra||{});
  renderQuiz();
}
function startQuiz(n, onlyIds){
  let cs = onlyIds?CARDS.filter(c=>onlyIds.includes(c.id)):cardsNow();
  let sc = onlyIds?[]:SCEN.filter(s=>deckIn(s[0]));
  const mix = S.set.quizMix, focus = S.set.quizFocus;
  if(!onlyIds&&focus==='weak'){ cs=cs.filter(c=>S.miss[c.id]); if(mix!=='scen') sc=[]; }
  const nS = onlyIds||mix==='terms'?0:Math.min(sc.length, mix==='scen'?n:Math.round(n*0.4));
  const order = focus==='random'?shuffle(cs):shuffle(cs.filter(c=>!S.known[c.id])).concat(shuffle(cs.filter(c=>S.known[c.id])));
  const nC = onlyIds?cs.length:mix==='scen'?0:Math.min(order.length, n-nS);
  const qs = shuffle(shuffle(sc).slice(0,nS).map(scenQuestion).concat(order.slice(0,nC).map(c=>genQuestion(c))));
  if(!qs.length){S.quiz=null;S.quizNote=focus==='weak'?'No trouble terms in this set yet. Terms you miss in Learn lessons show up here. Change "Focus" in Settings to quiz everything.':'No questions match your settings for this deck. Try a different question type in Settings.';renderQuiz();return}
  newQuiz(qs);
}

/* Custom test builder: its own saved config, separate from progress. */
const DEF_TEST = {decks:DECKS.filter(d=>!d.opt).map(d=>d.id), exam:10, mc:15, tf:5, scen:5, choices:4, feedback:'end', order:'mixed'};
S.test = Object.assign({}, DEF_TEST, store.get('ps1-test',{}));
S.test.decks = S.test.decks.filter(id=>deckById[id]);
const saveTest = ()=>store.set('ps1-test',S.test);
const testPool = (decks=S.test.decks)=>({cards:CARDS.filter(c=>decks.includes(c.d)), scen:SCEN.filter(s=>decks.includes(s[0])), exam:EXAM.filter(e=>decks.includes(e[0]))});
function syncTestInputs(){
  [['exam','texam'],['mc','tmc'],['tf','ttf'],['scen','tscen']].forEach(([k,id])=>{const el=$('#'+id); if(el) S.test[k]=Math.max(0,Math.min(200,parseInt(el.value,10)||0));});
  saveTest();
}
// cfg is passed for Exam mode and "same settings" reruns; otherwise use the builder's saved config.
function startTest(cfg){
  if(!cfg) syncTestInputs();
  const T=Object.assign({}, cfg||S.test), P=testPool(T.decks);
  const mcN=Math.min(T.mc,P.cards.length), scN=Math.min(T.scen,P.scen.length), exN=Math.min(T.exam||0,P.exam.length);
  // Use different terms for multiple choice and true/false when there are enough to go around.
  const deal=shuffle(P.cards), mcCards=deal.slice(0,mcN), left=deal.slice(mcN);
  const tfCards=left.concat(shuffle(mcCards)).slice(0,Math.min(T.tf,P.cards.length));
  const groups={mc:mcCards.map(c=>genQuestion(c,P.cards,T.choices)), tf:tfCards.map(c=>tfQuestion(c,P.cards)), scen:shuffle(P.scen).slice(0,scN).map(scenQuestion), exam:shuffle(P.exam).slice(0,exN).map(examQuestion)};
  const qs=T.order==='grouped'?groups.exam.concat(groups.mc,groups.tf,groups.scen):shuffle(groups.exam.concat(groups.mc,groups.tf,groups.scen));
  if(!qs.length){S.quiz=null;S.quizNote=!T.decks.length?'Pick at least one topic for your test.':'Your test has 0 questions. Set at least one question count above 0.';renderQuiz();return}
  const short=!T.examMode&&((T.exam||0)>exN||T.mc>mcN||T.scen>scN||T.tf>tfCards.length)?`Some counts were higher than these topics have, so the test uses all available: ${exN} exam-style, ${mcN} multiple choice, ${tfCards.length} true/false, ${scN} scenario.`:'';
  newQuiz(qs,{test:true, atEnd:T.feedback==='end', short, decks:T.decks.slice(), cfg:T});
}
function gradeTest(){
  const Q=S.quiz;
  Q.qs.forEach((q,i)=>{const a=Q.answers[i]; recordAnswer(q, a===undefined?null:a);});
  Q.i=Q.n; renderQuiz();
}
function recordAnswer(q, a){
  const Q=S.quiz, ok=a===q.ans;
  Q.res.push({q,ok,a});
  if(ok) Q.right++; else { Q.missed.push(Object.assign({},q,{yours:a})); if(q.card) setKnown(q.card.id,false); }
}

let qTimer=null;
function clearQTimer(){clearInterval(qTimer);qTimer=null}
// Per question normally; in "answers at the end" mode the same setting becomes a whole-test limit.
function startQTimer(){
  const Q=S.quiz, idx=Q.i, whole=Q.atEnd;
  if(whole){ if(!Q.deadline) Q.deadline=Date.now()+S.set.timer*1000*Q.n; }
  else if(Q.deadlineFor!==idx){Q.deadlineFor=idx;Q.deadline=Date.now()+S.set.timer*1000}
  const tick=()=>{
    if(S.tab!=='quiz'||S.quiz!==Q||Q.i>=Q.n||(!whole&&(Q.i!==idx||Q.picked!==null))){clearQTimer();return}
    const s=Math.max(0,Math.ceil((Q.deadline-Date.now())/1000)), el=$('#qtime');
