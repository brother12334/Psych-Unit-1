<style>
/* Layout: a study bench — one column, sticky deck filter, three tools (guide, flashcards, quiz) sharing one mastery record */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#f8f9fb; --ink:#15202b; --muted:#566373; --line:#d8dee6;
  --accent:#2a55c8; --accent-ink:#ffffff; --accent-soft:#e2e9fb;
  --good:#1d7f55; --good-soft:#dcf1e7; --bad:#b93a26; --bad-soft:#f9e1dc; --warn-soft:#fbf1cf; --warn-ink:#6b5208;
  --d-neuron:#c2410c; --d-nt:#7c3aed; --d-ns:#0f766e; --d-brain:#be185d; --d-vision:#1d4ed8; --d-senses:#a16207; --d-split:#4d7c0f; --d-sleep:#c026d3;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#161f29; --surface-2:#1b2633; --ink:#e7ecf1; --muted:#97a4b2; --line:#2a3745;
  --accent:#86a6ff; --accent-ink:#0e141b; --accent-soft:#1c2a47;
  --good:#52c98f; --good-soft:#143326; --bad:#ff8d76; --bad-soft:#3a1d18; --warn-soft:#3a3115; --warn-ink:#f1d675;
  --d-neuron:#fb923c; --d-nt:#a78bfa; --d-ns:#2dd4bf; --d-brain:#f472b6; --d-vision:#60a5fa; --d-senses:#facc15; --d-split:#a3e635; --d-sleep:#e879f9;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#161f29; --surface-2:#1b2633; --ink:#e7ecf1; --muted:#97a4b2; --line:#2a3745;
  --accent:#86a6ff; --accent-ink:#0e141b; --accent-soft:#1c2a47;
  --good:#52c98f; --good-soft:#143326; --bad:#ff8d76; --bad-soft:#3a1d18; --warn-soft:#3a3115; --warn-ink:#f1d675;
  --d-neuron:#fb923c; --d-nt:#a78bfa; --d-ns:#2dd4bf; --d-brain:#f472b6; --d-vision:#60a5fa; --d-senses:#facc15; --d-split:#a3e635; --d-sleep:#e879f9;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.55}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.7rem,4.5vw,2.4rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:grid;gap:14px;margin-bottom:18px}
.meter{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bar{flex:1 1 220px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.meter b{font-variant-numeric:tabular-nums}

.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:10px;border-bottom:1px solid var(--line);margin-bottom:22px}
.sticky{grid-template-columns:minmax(0,1fr)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none}
@media (max-width:560px){.tabs button{padding:8px 10px;font-size:.92rem}}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:999px;font-weight:700}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:.88rem}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip small{font-family:var(--mono);font-size:.7rem;opacity:.8;font-variant-numeric:tabular-nums}

/* Guide */
.deck{margin-bottom:40px}
.deck-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.deck-head .dot{width:12px;height:12px;align-self:center}
.deck-sub{color:var(--muted);margin:0 0 16px;max-width:65ch}
.chain{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.chain ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chain li{display:flex;align-items:center;gap:6px}
.chain li span{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:.9rem}
.chain li+li::before{content:"→";color:var(--muted)}
.tree{font-family:var(--mono);font-size:.82rem;line-height:1.7;white-space:pre;overflow-x:auto;margin:8px 0 0}
.sec{margin:22px 0 8px}
.rows{display:grid;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:6px 16px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start}
.row .t{font-weight:700}
.row .x{min-width:0}
.hook{display:block;margin-top:4px;font-size:.88rem;color:var(--accent)}
.know{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:.78rem;white-space:nowrap}
.know[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
@media (max-width:560px){.row{grid-template-columns:1fr auto}.row .x{grid-column:1 / -1;grid-row:2}}
.watch{background:var(--warn-soft);color:var(--warn-ink);border-radius:var(--r);padding:12px 14px;margin-top:16px;font-size:.93rem}
.watch b{display:block;margin-bottom:2px}
.compare{width:100%;border-collapse:collapse;font-size:.92rem;min-width:520px}
.compare th,.compare td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.compare th{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:12px}

/* Flashcards */
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toggle{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.small{padding:6px 10px;font-size:.85rem;font-weight:400}
.btn[aria-pressed="true"]{border-color:var(--ink)}
.card{width:100%;min-height:260px;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:28px 24px;display:grid;place-items:center;text-align:center;box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgba(0,0,0,.35);position:relative}
.card .face{max-width:58ch}
.card .big{font-family:var(--display);font-size:clamp(1.6rem,5vw,2.3rem);font-weight:800;letter-spacing:-.01em;line-height:1.15}
.card .def{font-size:1.08rem}
.card .corner{position:absolute;top:14px;left:16px;display:flex;gap:7px;align-items:center}
.card .flipnote{position:absolute;bottom:12px;left:0;right:0;font-size:.8rem;color:var(--muted)}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fc-actions .btn{padding:13px}
.kbd{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:10px;text-align:center}
.done{text-align:center;padding:40px 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px}

/* Quiz */
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qprompt{font-size:1.15rem;font-weight:700;margin:0 0 16px;max-width:65ch}
.qprompt .ask{display:block;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:6px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.opt .k{font-family:var(--mono);font-size:.78rem;border:1px solid var(--line);border-radius:6px;padding:1px 7px;flex:none;margin-top:2px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.opt:disabled{cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.explain b.ok{color:var(--good)} .explain b.no{color:var(--bad)}
.qnav{display:flex;justify-content:flex-end;margin-top:14px}
.setup{display:grid;gap:16px}
.setup p{margin:0;color:var(--muted);max-width:65ch}
.score{font-family:var(--display);font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums}
.missed{display:grid;gap:8px;margin-top:14px;text-align:left}
.missed div{border-left:3px solid var(--bad);padding:6px 12px;background:var(--surface-2);border-radius:0 8px 8px 0;font-size:.93rem}
.empty{color:var(--muted);padding:20px 0}

/* Settings */
.set-group{display:grid;gap:18px}
.set-group+.set-group{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.set-row{display:grid;gap:7px}
.set-row p{margin:0;color:var(--muted);font-size:.9rem;max-width:65ch}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad);font-weight:700}
.qcount{width:5.5em;font:inherit;color:inherit;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="label">AP Psychology · Unit 1 · Biological bases of behavior</div>
      <h1>Psych Unit 1 Study Kit</h1>
    </div>
    <div class="meter">
      <div class="bar" aria-hidden="true"><i id="mbar" style="width:0%"></i></div>
      <span><b id="mcount">0</b> of <b id="mtotal">0</b> terms marked “got it”</span>
      <button class="btn small" id="reset">Reset progress</button>
    </div>
  </header>

  <div class="sticky">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="learn" aria-selected="true">Learn</button>
      <button role="tab" data-tab="guide" aria-selected="false">Study guide</button>
      <button role="tab" data-tab="cards" aria-selected="false">Flashcards</button>
      <button role="tab" data-tab="quiz" aria-selected="false">Quiz</button>
      <button role="tab" data-tab="settings" aria-selected="false" aria-label="Settings">⚙︎ Settings</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <main id="view"></main>
</div>

<script>
const DECKS = [
  {id:'neuron', name:'The Neuron', sub:'Parts of a neuron, how it fires, and two diseases that disrupt it.'},
  {id:'nt', name:'Neurotransmitters', sub:'Excitatory vs. inhibitory, and what each chemical does — plus what too much or too little looks like.'},
  {id:'ns', name:'Nervous & Endocrine Systems', sub:'How the nervous system is divided, the three neuron types, and the hormones you need to know.'},
  {id:'brain', name:'The Brain', sub:'Old brain, limbic system, the four lobes (F-POT), lateralization, plasticity, and brain scans.'},
  {id:'vision', name:'Vision', sub:'The path light takes, rods and cones, color theories, Gestalt grouping, and depth cues.'},
  {id:'senses', name:'Hearing, Smell, Taste, Touch & more', sub:'Sound waves, hearing loss, balance, smell, taste, pain, and unusual perception.'},
  // Optional decks stay out of "All decks", the main progress meter, and the final mixed quiz. Keep them last so saved card/lesson ids never shift.
  {id:'split', opt:true, name:'Optional: Split Brain', sub:'Optional extra from the Brain Lateralization & Split Brain slides. Your teacher said it may help on the test. Builds on the Hemispheres section of The Brain.'},
  {id:'sleep', name:'Sleep, Consciousness & Drugs', sub:'Everything on the Sleep, Consciousness, and Drugs slides: sleep, circadian rhythm, sleep loss, sleep disorders, how drugs work, the four drug categories, and addiction.'}
];
// Storage order above must never change (saved lessons are numbered by it). This is the order decks are shown in.
const DECK_VIEW = DECKS.filter(d=>!d.opt).concat(DECKS.filter(d=>d.opt));

// [deck, section, term, definition, hook?]
const RAW = [
['neuron','Parts of a neuron','Neuron','A nerve cell; the basic building block of the brain and nervous system. Hundreds of billions form networks throughout the body.'],
['neuron','Parts of a neuron','Glial cells (glia)','Support cells in the brain that nourish and protect neurons. Your slides say there are about 50x more of them than neurons.','"Glia" = glue: they hold the system together.'],
['neuron','Parts of a neuron','Dendrites','Branch-like structures extending from the cell body. Their receptors receive chemical signals from other neurons.','Dendrites = Detect.'],
['neuron','Parts of a neuron','Soma','The cell body. Holds the nucleus, keeps the cell alive, and decides when the neuron will fire.'],
['neuron','Parts of a neuron','Axon','The long pathway an electrical impulse travels down when the neuron fires.','Axon = Away from the cell body.'],
['neuron','Parts of a neuron','Myelin sheath','Fatty coating that protects the axon and speeds up the electrical signal.','Like insulation on a wire.'],
['neuron','Parts of a neuron','Terminal branches','The frayed ends of the axon. Each one ends in a terminal button.'],
['neuron','Parts of a neuron','Terminal buttons','Knobs at the ends of the terminal branches that hold the vesicles.'],
['neuron','Parts of a neuron','Vesicles','Tiny sacs in the terminal buttons that store neurotransmitters.'],
['neuron','Parts of a neuron','Synapse','The gap between two neurons (also called the synaptic cleft or synaptic gap). Neurons never actually touch.'],
['neuron','Firing a neuron','Resting potential','The neuron is not firing; its dendrites are waiting to receive neurotransmitters.'],
['neuron','Firing a neuron','Threshold','The level of stimulation the dendrites must receive before the neuron will fire.'],
['neuron','Firing a neuron','Action potential','The electrical signal that the soma starts once threshold is reached; it travels down the axon.'],
['neuron','Firing a neuron','All-or-none principle','A neuron either fires completely or not at all. It never partially fires, and a stronger stimulus does not make a stronger firing.','Like a gun: you either pull the trigger or you don\'t.'],
['neuron','Firing a neuron','Reuptake','Leftover neurotransmitters in the synapse get reabsorbed by the neuron that released them.'],
['neuron','Firing a neuron','Refractory period','The recovery time after firing when the neuron cannot fire again, no matter how many neurotransmitters it receives.','Like a toilet: you have to wait to flush again.'],
['neuron','Diseases','Multiple sclerosis (MS)','Disease caused by deterioration of the myelin sheath (demyelination). Causes trouble with movement and walking.','MS = Myelin Sheath.'],
['neuron','Diseases','Myasthenia gravis','Autoimmune disorder where antibodies block or destroy the muscles\' receptor sites for acetylcholine, causing muscle weakness.'],

['nt','Basics','Neurotransmitter','A chemical messenger released into the synapse that carries a signal from one neuron to the next.'],
['nt','Basics','Excitatory','Describes a neurotransmitter that makes the next neuron more likely to fire.','Excite = Go.'],
['nt','Basics','Inhibitory','Describes a neurotransmitter that keeps the next neuron from firing.','Inhibit = Stop.'],
['nt','The chemicals','Acetylcholine (ACh)','Mainly controls movement (muscle action) and also plays a role in memory. Found in both the central and peripheral nervous systems. Too little is linked to Alzheimer\'s; too much causes muscle spasms; blocked receptors cause paralysis.','ACh = ACTion (muscles) + Alzheimer\'s.'],
['nt','The chemicals','Dopamine','The "pleasure chemical": reward pathway, anticipating something good, movement, alertness, and motor coordination. Low levels are linked to Parkinson\'s and addictive behaviors; high levels are linked to schizophrenia.','Low = Parkinson\'s shakes. High = schizophrenia.'],
['nt','The chemicals','Serotonin','Affects mood, emotion, appetite, and sleep. High levels mean more happiness; low levels are linked to depression, anger-control problems, and OCD.'],
['nt','The chemicals','SSRI','Selective serotonin reuptake inhibitor. An antidepressant that blocks reuptake so serotonin stays in the synapse longer.'],
['nt','The chemicals','Norepinephrine','Acts as both a neurotransmitter and a hormone (noradrenaline). Drives the sympathetic fight-or-flight response, plus focus, attention, and quick decisions. High levels are linked to developing fears; low levels to depression and ADHD.'],
['nt','The chemicals','GABA','Gamma-aminobutyric acid: the primary inhibitory neurotransmitter. A natural tranquilizer that calms the nervous system. Too little is linked to anxiety disorders; too much causes sleepiness.','GABA = Gotta Always Be Asleep.'],
['nt','The chemicals','Glutamate','The major excitatory neurotransmitter. Involved in thinking, memory, and learning. Too much is linked to high anxiety, OCD, and migraines.','Glutamate = Go.'],
['nt','The chemicals','Endorphins','The brain\'s natural painkillers, released by the pituitary gland. Relieve pain and stress; example: runner\'s high.','"Endogenous morphine."'],
['nt','The chemicals','Substance P','Involved in pain regulation (sending pain signals). Levels rise with stress, heat, and painful stimuli.','P = Pain.'],

['ns','Functions & neurons','Three functions of the nervous system','Sensory input (gather info from the senses), integration (the brain processes it and decides), and motor output (signals go to muscles and glands).'],
['ns','Functions & neurons','Sensory (afferent) neurons','Carry messages from sensory receptors in to the brain and spinal cord.','Afferent = Arrive.'],
['ns','Functions & neurons','Motor (efferent) neurons','Carry signals from the brain and spinal cord out to muscles and organs.','Efferent = Exit.'],
['ns','Functions & neurons','Interneurons','Relay neurons in the brain and spinal cord that connect sensory and motor neurons and pass information between them.','Inter = in between.'],
['ns','Divisions','Central nervous system (CNS)','The brain and the spinal cord.'],
['ns','Divisions','Spinal cord','The "highway" connecting the brain to the rest of the body; sends messages both ways.'],
['ns','Divisions','Peripheral nervous system (PNS)','All the nerves outside the brain and spinal cord, connecting them to the rest of the body.'],
['ns','Divisions','Nerves','Bundles of neurons that act like wires carrying messages to and from the brain and spinal cord.'],
['ns','Divisions','Somatic nervous system','Part of the peripheral system that controls voluntary movements, like walking or picking up a pencil.','Soma = body you move on purpose.'],
['ns','Divisions','Autonomic nervous system','Part of the peripheral system that controls involuntary actions like heartbeat and digestion. Split into sympathetic and parasympathetic.','Autonomic = automatic.'],
['ns','Divisions','Sympathetic nervous system','Arouses the body: the fight, flight, or freeze response.','Sympathetic = Stressed.'],
['ns','Divisions','Parasympathetic nervous system','Calms the body back down: rest and digest.','Parasympathetic = Peace (or a Parachute down).'],
['ns','Divisions','Reflex','A simple, automatic response to a stimulus (like the knee-jerk), directed by the spinal cord instead of the brain, which makes it faster.'],
['ns','Endocrine system','Endocrine system','The system of glands that releases and regulates hormones.'],
['ns','Endocrine system','Hormones vs. neurotransmitters','Hormones travel through the bloodstream, so they act more slowly than neurotransmitters, but their effects last longer.'],
['ns','Endocrine system','Pituitary gland','The "master gland." Regulates stress, growth, and reproduction and signals the other glands to release their hormones.'],
['ns','Endocrine system','Adrenaline','Hormone from the adrenal glands (on top of the kidneys). Raises heart rate, blood pressure, and blood sugar for the fight-or-flight energy surge.'],
['ns','Endocrine system','Ghrelin','Hunger hormone made in the stomach; tells the body you are hungry.','Ghrelin = Growling stomach.'],
['ns','Endocrine system','Leptin','Hormone that tells the body you are full (satiety). Your slides say it is made in the small intestine.','Leptin = Leave the table.'],
['ns','Endocrine system','Testosterone','Sex hormone made in the testes and ovaries; the hormone most responsible for sex drive. Men have more. Too much is linked to aggression.'],
['ns','Endocrine system','Estrogen','Sex hormone important for reproduction; women have more of it.'],
['ns','Endocrine system','Oxytocin','The "love" or social-bonding hormone. Made by the hypothalamus and released by the pituitary. Important in labor, mother–baby bonding, and bonding with friends and partners. Low levels are linked to postpartum depression.'],
['ns','Endocrine system','Melatonin','Hormone from the pineal gland, released in response to darkness. Regulates circadian rhythm (sleep-wake cycle) and helps you sleep.'],

['brain','Old brain','Brainstem','The medulla plus the pons; handles automatic survival functions.'],
['brain','Old brain','Medulla','Base of the brainstem; controls life-sustaining functions like breathing and heartbeat.','Medulla = Most important (keeps you alive).'],
['brain','Old brain','Pons','Connects the spinal cord to the brain; involved in automatic processes, especially the sleep-wake cycle.','Pons = bridge (French "pont").'],
['brain','Old brain','Reticular formation','Network in the brainstem (part of the pons, per your slides) that controls arousal and consciousness. Damage can cause a coma.'],
['brain','Old brain','Thalamus','Sits on top of the brainstem; the brain\'s sensory relay station. All senses except smell get routed through it.','Thalamus = sensory switchboard.'],
['brain','Old brain','Cerebellum','"Little brain" at the back. Handles fine motor control, coordination, posture, and balance, plus learned motor skills like riding a bike. Alcohol strongly affects it.','Cerebellum = balance (think "bell" ringing while you wobble).'],
['brain','Limbic system','Limbic system','Brain structures involved in emotion and long-term memory: the amygdala, hippocampus, and hypothalamus.'],
['brain','Limbic system','Amygdala','Processes emotion, especially fear and aggression. Triggers fight-or-flight, helps read others\' emotions, and helps store emotional memories.','Two almonds of fear.'],
['brain','Limbic system','Hippocampus','Helps store information into long-term memory. One of the first areas damaged by Alzheimer\'s.','A hippo never forgets.'],

const deckById = Object.fromEntries(DECKS.map(d=>[d.id,d]));
const store = {
  get(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const S = {
  tab: store.get('ps1-tab2','learn'),
  li: store.get('ps1-li',0), done: store.get('ps1-done',[]), miss: store.get('ps1-miss',{}), L:null, showMap:false,
  deck: store.get('ps1-deck','all'),
  known: store.get('ps1-known',{}),
  fc:null, quiz:null, fcFront: store.get('ps1-front','term')
};
// Settings live under their own key so they never touch saved progress.
const DEF_SET = {theme:'auto', size:'m', hooks:true, includeOpt:false, fcPool:'unknown', fcOrder:'shuffle', quizMix:'mixed', quizDir:'mixed', quizFocus:'unknown', timer:0};
S.set = Object.assign({}, DEF_SET, store.get('ps1-settings',{}));
const saveSet = ()=>store.set('ps1-settings',S.set);
function applySet(){
  const r=document.documentElement;
  if(S.set.theme==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',S.set.theme);
  r.style.fontSize={s:'14px',m:'16px',l:'18px',xl:'20px'}[S.set.size]||'16px';
}
applySet();
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const inAll = d=>S.set.includeOpt||!deckById[d].opt;
const inDeck = c=>S.deck==='all'?inAll(c.d):c.d===S.deck;
const hookHtml = c=>c.h&&S.set.hooks?`<span class="hook">Memory hook: ${esc(c.h)}</span>`:'';
const CORE_CARDS = CARDS.filter(c=>!deckById[c.d].opt);
const cardsNow = ()=>CARDS.filter(inDeck);
const dotStyle = d=>`background:var(--d-${d})`;

function setKnown(id,v){S.known[id]=v; if(!v) delete S.known[id]; store.set('ps1-known',S.known); renderMeter(); renderChips();}

function renderMeter(){
  const n = CORE_CARDS.filter(c=>S.known[c.id]).length;
  $('#mcount').textContent=n; $('#mtotal').textContent=CORE_CARDS.length;
  $('#mbar').style.width=(100*n/CORE_CARDS.length)+'%';
}
function renderChips(){
  const opts=[{id:'all',name:'All decks'}].concat(DECK_VIEW);
  $('#chips').innerHTML = opts.map(d=>{
    const cs = d.id==='all'?CARDS.filter(c=>inAll(c.d)):CARDS.filter(c=>c.d===d.id);
    const k = cs.filter(c=>S.known[c.id]).length;
    return `<button class="chip" data-deck="${d.id}" aria-pressed="${S.deck===d.id}">${d.id!=='all'?`<span class="dot" style="${dotStyle(d.id)}"></span>`:''}${esc(d.name)} <small>${k}/${cs.length}</small></button>`;
  }).join('');
}
function renderTabs(){document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab))}

/* ---------- Guide ---------- */
function renderGuide(){
  const decks = DECK_VIEW.filter(d=>S.deck==='all'?inAll(d.id):d.id===S.deck);
  $('#view').innerHTML = decks.map(d=>{
    const cs = CARDS.filter(c=>c.d===d.id);
    const secs = [...new Set(cs.map(c=>c.s))];
    let h = `<section class="deck" id="deck-${d.id}"><div class="deck-head"><span class="dot" style="${dotStyle(d.id)}"></span><h2>${esc(d.name)}</h2><span class="label">${cs.filter(c=>S.known[c.id]).length} of ${cs.length} known</span></div><p class="deck-sub">${esc(d.sub)}</p>`;
    (CHAINS[d.id]||[]).forEach(ch=>{h+=`<div class="chain"><div class="label">${esc(ch.label)} · in order</div><ol>${ch.steps.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol></div>`});
    if(d.id==='ns') h+=`<div class="chain"><div class="label">How the nervous system divides</div><div class="tree">${esc(TREE)}</div></div>`;
    secs.forEach(s=>{
      h+=`<h3 class="sec">${esc(s)}</h3><div class="rows">`+cs.filter(c=>c.s===s).map(c=>`<div class="row"><div class="t">${esc(c.t)}</div><div class="x">${esc(c.x)}${hookHtml(c)}</div><button class="know" data-know="${c.id}" aria-pressed="${!!S.known[c.id]}">${S.known[c.id]?'✓ Got it':'Got it?'}</button></div>`).join('')+`</div>`;
      h+=tableHtml(d.id+'|'+s);
    });
    (WATCH[d.id]||[]).forEach(w=>h+=`<div class="watch"><b>Heads up</b>${esc(w)}</div>`);
    return h+`</section>`;
  }).join('');
}

/* ---------- Flashcards ---------- */
function buildQueue(){
  let cs = cardsNow();
  if(S.set.fcPool==='unknown'){const u=cs.filter(c=>!S.known[c.id]); if(u.length) cs=u;}
  else if(S.set.fcPool==='weak') cs=cs.filter(c=>S.miss[c.id]);
  S.fc = {q:(S.set.fcOrder==='shuffle'?shuffle(cs):cs).map(c=>c.id), i:0, flipped:false, seen:0, total:cs.length};
}
const POOL_NAME = {unknown:'cards you don\'t know yet', all:'all cards', weak:'trouble terms (ones you\'ve missed)'};
const POOL_NEXT = {unknown:'all', all:'weak', weak:'unknown'};
function renderCards(){
  if(!S.fc) buildQueue();
  const f=S.fc;
  const top = `<div class="fc-top"><span class="label">${f.q.length?`${Math.min(f.seen+1,f.total)} / ${f.total}`:''} · ${POOL_NAME[S.set.fcPool]}</span>
    <div class="toggle">
      <button class="btn small" data-act="front" aria-pressed="${S.fcFront==='def'}">${S.fcFront==='term'?'Show definition first':'Show term first'}</button>
      <button class="btn small" data-act="only">Switch to: ${POOL_NAME[POOL_NEXT[S.set.fcPool]].replace(/ \(.*\)/,'')}</button>
      <button class="btn small" data-act="shuffle">${S.set.fcOrder==='shuffle'?'Shuffle':'Restart'}</button>
    </div></div>`;
  if(!f.q.length){
    if(S.set.fcPool==='weak'&&!f.total){$('#view').innerHTML=top+`<div class="done"><h2>No trouble terms yet.</h2><p class="deck-sub" style="margin:10px auto 18px">Terms you miss in Learn lessons show up here. Nothing in this set so far.</p><div class="toggle" style="justify-content:center"><button class="btn primary" data-act="pool-all">Study all cards instead</button></div></div>`;return}
    const all = cardsNow().every(c=>S.known[c.id]);
    $('#view').innerHTML = top+`<div class="done"><h2>${all?'You know every card in this set.':'Round done.'}</h2><p class="deck-sub" style="margin:10px auto 18px">${all?'Test yourself with the quiz, or include known cards to review again.':'Cards you marked “still learning” will come back in the next round.'}</p><div class="toggle" style="justify-content:center"><button class="btn primary" data-act="again">Start another round</button><button class="btn" data-goto="quiz">Take a quiz</button></div></div>`;
    return;
  }
  const c = CARDS.find(x=>x.id===f.q[f.i]);
  const termSide = `<div class="big">${esc(c.t)}</div>`;
  const defSide = `<div class="def">${esc(c.x)}${hookHtml(c)}</div>`;
  const showTerm = (S.fcFront==='term') !== f.flipped;
  $('#view').innerHTML = top+`
    <button class="card" data-act="flip" aria-label="Flip card">
      <span class="corner"><span class="dot" style="${dotStyle(c.d)}"></span><span class="label">${esc(deckById[c.d].name)} · ${esc(c.s)}</span></span>
      <div class="face">${showTerm?termSide:defSide}${f.flipped?`<div style="margin-top:14px" class="label">${showTerm?'':esc(c.t)}</div>`:''}</div>
      <span class="flipnote">${f.flipped?'':'Tap to flip'}</span>
    </button>
    <div class="fc-actions">
      <button class="btn bad" data-act="learning">Still learning</button>
      <button class="btn good" data-act="got">Got it</button>
    </div>
    <div class="kbd">Keyboard: Space = flip · 1 = still learning · 2 = got it</div>`;
}
function fcAnswer(got){
  const f=S.fc, id=f.q[f.i];
  setKnown(id,got);
  f.q.splice(f.i,1); f.seen++;
  if(!got){ f.q.splice(Math.min(f.q.length,4),0,id); f.total++; }
  f.flipped=false; if(f.i>=f.q.length) f.i=0;
  renderCards();
}

/* ---------- Quiz ---------- */
function genQuestion(c, pool, nOpts){
  pool = (pool||cardsNow()).filter(x=>x.id!==c.id); nOpts = nOpts||4;
  const same = shuffle(pool.filter(x=>x.d===c.d&&x.s===c.s));
  const deck = shuffle(pool.filter(x=>x.d===c.d&&x.s!==c.s));
  const rest = shuffle(pool.filter(x=>x.d!==c.d)).concat(shuffle(CARDS.filter(x=>x.d!==c.d&&inAll(x.d))));
  const seen = new Set([c.id]), distract = [];
  same.concat(deck,rest).forEach(x=>{if(distract.length<nOpts-1&&!seen.has(x.id)){seen.add(x.id);distract.push(x)}});
  const dir = S.set.quizDir, reverse = dir==='term'?true:dir==='def'?false:Math.random()<0.3;
  const all = shuffle([c].concat(distract));
  return reverse
    ? {kind:'card', type:'mc', card:c, ask:'Which definition matches this term?', prompt:c.t, opts:all.map(x=>x.x), ans:all.indexOf(c), exp:`${c.t}: ${c.x}`}
    : {kind:'card', type:'mc', card:c, ask:'Which term matches this definition?', prompt:c.x, opts:all.map(x=>x.t), ans:all.indexOf(c), exp:`${c.t}: ${c.x}`+(c.h&&S.set.hooks?` (Hook: ${c.h})`:'')};
}
// True/false: half the time the definition shown belongs to a different, nearby term.
function tfQuestion(c, pool){
  let shown=c;
  if(Math.random()<0.5){
    const near=shuffle(pool.filter(x=>x.id!==c.id&&x.d===c.d&&x.s===c.s)).concat(shuffle(pool.filter(x=>x.id!==c.id&&x.d===c.d)),shuffle(pool.filter(x=>x.id!==c.id)));
    shown=near.find(x=>x.x!==c.x)||c;
  }
  return {kind:'card', type:'tf', card:c, ask:'True or false?', prompt:`${c.t}: ${shown.x}`, opts:['True','False'], ans:shown===c?0:1,
    exp:shown===c?`True. ${c.t}: ${c.x}`:`False. That describes ${shown.t}. ${c.t}: ${c.x}`};
}
function scenQuestion(s){
  const o=shuffle(s[2].map((t,i)=>({t,i})));
  return {kind:'scen', type:'scen', deck:s[0], ask:'Apply it', prompt:s[1], opts:o.map(x=>x.t), ans:o.findIndex(x=>x.i===s[3]), exp:s[4]};
}
function examQuestion(e){
  const o=shuffle(e[2].map((t,i)=>({t,i})));
  return {kind:'scen', type:'exam', deck:e[0], ask:'Choose the best answer', prompt:e[1], opts:o.map(x=>x.t), ans:o.findIndex(x=>x.i===e[3]), exp:e[4]};
}
const TYPE_NAME={exam:'Exam-style',mc:'Multiple choice',tf:'True / false',scen:'Scenarios'};
function newQuiz(qs, extra){
  S.quizNote='';
  S.quiz=Object.assign({qs,i:0,picked:null,right:0,missed:[],res:[],n:qs.length,answers:[]},extra||{});
  renderQuiz();
}
function startQuiz(n, onlyIds){
  let cs = onlyIds?CARDS.filter(c=>onlyIds.includes(c.id)):cardsNow();
  let sc = onlyIds?[]:SCEN.filter(s=>S.deck==='all'?inAll(s[0]):s[0]===S.deck);
  const mix = S.set.quizMix, focus = S.set.quizFocus;
  if(!onlyIds&&focus==='weak'){ cs=cs.filter(c=>S.miss[c.id]); if(mix!=='scen') sc=[]; }
  const nS = onlyIds||mix==='terms'?0:Math.min(sc.length, mix==='scen'?n:Math.round(n*0.4));
  const order = focus==='random'?shuffle(cs):shuffle(cs.filter(c=>!S.known[c.id])).concat(shuffle(cs.filter(c=>S.known[c.id])));
  const nC = onlyIds?cs.length:mix==='scen'?0:Math.min(order.length, n-nS);
  const qs = shuffle(shuffle(sc).slice(0,nS).map(scenQuestion).concat(order.slice(0,nC).map(c=>genQuestion(c))));

    ${S.showMap?`<div style="margin-top:12px;display:grid;gap:14px">${DECK_VIEW.map(d=>`<div><div class="label" style="margin-bottom:6px"><span class="dot" style="display:inline-block;margin-right:6px;${dotStyle(d.id)}"></span>${esc(d.name)}</div><div class="chips">${LESSONS.map((l,i)=>l.d===d.id?`<button class="chip" data-lesson="${i}" aria-pressed="${i===S.li}">${S.done.includes(i)?'✓ ':''}${esc(lessonTitle(i))}</button>`:'').join('')}</div></div>`).join('')}</div>`:''}
  </div>`;
  const head=`<div class="deck-head"><span class="dot" style="${dotStyle(lesson.d)}"></span><span class="label">${esc(deck.name)}</span></div><h2 style="margin-bottom:4px">${esc(lessonTitle(S.li))}</h2>`;

  if(L.phase==='teach'){
    const ch=CHAIN_AT[lesson.d+'|'+lesson.s], chs=lesson.d==='split'&&lesson.s==='Split-brain patients'?CHAINS.split:ch?[ch]:[];
    h+=`<div class="qbox">${head}${deck.opt?`<div class="watch" style="margin:8px 0 12px"><b>Optional topic</b>${esc(deck.sub)} It doesn't count toward your main progress.</div>`:''}<p class="deck-sub">Read these ${lesson.ids.length} terms. Say each one out loud or cover the definition and try to explain it. Then you'll be quizzed on them one at a time${S.done.length?', with a few review questions from earlier lessons mixed in':''}.</p>`;
    chs.forEach(ch=>h+=`<div class="chain"><div class="label">${esc(ch.label)} · in order</div><ol>${ch.steps.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol></div>`);
    if(lesson.d==='ns'&&lesson.s==='Divisions') h+=`<div class="chain"><div class="label">How the nervous system divides</div><div class="tree">${esc(TREE)}</div></div>`;
    h+=`<div class="rows">${lesson.ids.map(cardById).map(c=>`<div class="row" style="grid-template-columns:minmax(120px,190px) 1fr"><div class="t">${esc(c.t)}</div><div class="x">${esc(c.x)}${hookHtml(c)}</div></div>`).join('')}</div>`;
    if(LESSONS.filter(l=>l.d===lesson.d&&l.s===lesson.s).pop()===lesson) h+=tableHtml(lesson.d+'|'+lesson.s);
    if(lesson.checkpoint) (WATCH[lesson.d]||[]).forEach(w=>h+=`<div class="watch"><b>Heads up</b>${esc(w)}</div>`);
    if(lesson.checkpoint) h+=`<p class="deck-sub" style="margin-top:14px">This is the last lesson in ${esc(deck.name)}, so the quiz ends with scenario questions on the whole deck.</p>`;
    h+=`<div class="qnav"><button class="btn primary" data-act="l-quiz">I've read them. Quiz me</button></div></div>`;
  }
  else if(L.phase==='quiz'){
    const q=L.cur, answered=L.picked!==null, ok=L.picked===q.ans;
    const left=L.queue.length+(answered?0:1);
    h+=`<div class="qbox"><div class="qmeta"><span class="label">${esc(deck.name)} · ${esc(lessonTitle(S.li))}</span><span class="label">${left} left</span></div>
      <p class="qprompt"><span class="ask">${esc(q.ask)}</span>${esc(q.prompt)}</p>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt ${answered&&i===q.ans?'right':''} ${answered&&i===L.picked&&!ok?'wrong':''}" data-lopt="${i}" ${answered?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      ${answered?`<div class="explain"><b class="${ok?'ok':'no'}">${ok?'Correct.':'Not quite.'}</b> ${q.card?`<b>${esc(q.card.t)}</b>: ${esc(q.card.x)}${hookHtml(q.card)}${!ok?`<div class="label" style="margin-top:8px">This one will come back in a moment</div>`:''}`:esc(q.exp)}</div>
      <div class="qnav"><button class="btn primary" data-act="l-next">Next</button></div>`:''}
    </div><div class="kbd">Keyboard: A–D or 1–4 to answer · Enter = next</div>`;
  }
  else {
    const missed=[...L.missedIds].map(cardById), allDone=coreDone===CORE_LESSONS.length;
    // Next core lesson in study order; optional lessons are offered as a side button, never in the way.
    const order=DECK_VIEW.flatMap(d=>LESSONS.map((l,i)=>i).filter(i=>LESSONS[i].d===d.id)), pos=order.indexOf(S.li);
    const nextIdx=order.slice(pos+1).find(i=>!deckById[LESSONS[i].d].opt||deck.opt), last=nextIdx===undefined;
    const optStart=!deck.opt?LESSONS.findIndex(l=>deckById[l.d].opt):-1;
    const optNext=S.li===LAST_CORE&&optStart>=0?`<button class="btn" data-lesson="${optStart}">Optional: ${esc(deckById[LESSONS[optStart].d].name.replace(/^Optional: /,''))}</button>`:'';
    h+=`<div class="qbox">${head}<div class="score" style="font-size:2.4rem">${L.first}/${L.firstTotal}</div><p class="deck-sub">right on the first try.${missed.length?' The terms below gave you trouble. They\'ll show up again as review questions in later lessons.':' Clean lesson.'}</p>
      ${missed.length?`<div class="missed">${missed.map(c=>`<div><b>${esc(c.t)}</b>: ${esc(c.x)}</div>`).join('')}</div>`:''}
      ${L.scenMiss.length?`<div class="missed" style="margin-top:8px">${L.scenMiss.map(q=>`<div>${esc(q.prompt)} <b>${esc(q.opts[q.ans])}</b>. ${esc(q.exp)}</div>`).join('')}</div>`:''}
      ${allDone&&last?`<div class="watch" style="margin-top:16px"><b>You finished every lesson.</b>Now take a 40-question mixed quiz on everything and retry what you miss.</div>`:''}
      <div class="qnav" style="gap:8px;flex-wrap:wrap"><button class="btn" data-act="l-redo">Redo this lesson</button>${last?`${optNext}<button class="btn primary" data-act="l-final">Take the final mixed quiz</button>`:`<button class="btn primary" data-lesson="${nextIdx}">Next lesson: ${esc(lessonTitle(nextIdx))}</button>`}</div></div>`;
  }
  $('#view').innerHTML=h;
}

/* ---------- Settings ---------- */
const SETTINGS = [
  {g:'Display'},
  {k:'theme', label:'Theme', opts:[['auto','Match device'],['light','Light'],['dark','Dark']]},
  {k:'size', label:'Text size', opts:[['s','Small'],['m','Normal'],['l','Large'],['xl','Extra large']]},
  {k:'hooks', label:'Memory hooks', help:'Hide them to test whether you know the term without the trick.', opts:[[true,'Show'],[false,'Hide']]},
  {g:'Decks'},
  {k:'includeOpt', label:'Optional topics in "All decks"', help:'Adds Optional: Split Brain to All decks in the study guide, flashcards, and quizzes. It never counts toward the main progress bar.', opts:[[false,'Leave out'],[true,'Include']]},
  {g:'Flashcards'},
  {k:'fcPool', label:'Which cards', help:'Trouble terms are cards you\'ve missed in Learn lessons and haven\'t fixed yet.', opts:[['unknown','Not known yet'],['all','All cards'],['weak','Trouble terms']]},
  {k:'fcOrder', label:'Order', help:'In order follows the study guide, section by section.', opts:[['shuffle','Shuffled'],['section','In order']]},
  {g:'Quiz'},
  {k:'quizMix', label:'Question type', opts:[['mixed','Mixed'],['terms','Terms only'],['scen','Scenarios only']]},
  {k:'quizDir', label:'Term questions ask', opts:[['mixed','Both ways'],['def','Definition → term'],['term','Term → definition']]},
  {k:'quizFocus', label:'Focus', help:'"Not known first" pulls cards you haven\'t marked “got it” before the rest.', opts:[['unknown','Not known first'],['random','Random'],['weak','Trouble terms']]},
  {k:'timer', label:'Timer per question', help:'Running out of time counts as a miss. Timers only apply to the Quiz tab, not Learn.', opts:[[0,'Off'],[15,'15s'],[30,'30s'],[60,'60s']]}
];
function renderSettings(){
  let h='<div class="qbox">', open=false;
  SETTINGS.forEach(s=>{
    if(s.g){h+=(open?'</div>':'')+`<div class="set-group"><h2>${esc(s.g)}</h2>`;open=true;return}
    h+=`<div class="set-row"><div class="label">${esc(s.label)}</div><div class="seg">${s.opts.map(([v,l])=>`<button class="btn small" data-set="${s.k}" data-val="${esc(JSON.stringify(v))}" aria-pressed="${S.set[s.k]===v}">${esc(l)}</button>`).join('')}</div>${s.help?`<p>${esc(s.help)}</p>`:''}</div>`;
  });
  const known=CARDS.filter(c=>S.known[c.id]).length, weak=CARDS.filter(c=>S.miss[c.id]).length;
  h+=`</div><div class="set-group"><h2>Your progress</h2>
    <p class="deck-sub" style="margin:0">${known} terms marked “got it,” ${S.done.length} lessons done, ${weak} trouble terms. Progress is saved in this browser only. Back it up before clearing your browser data or switching devices.</p>
    <div class="toggle"><button class="btn" data-act="export">Download backup</button><button class="btn" data-act="import">Restore from backup</button><input type="file" id="importFile" accept=".json,application/json" hidden></div>
    <p id="dataNote" class="deck-sub" style="margin:0" aria-live="polite"></p>
    <div class="toggle"><button class="btn small" data-act="defaults">Reset settings to default</button></div>
    <p class="deck-sub" style="margin:0;font-size:.88rem">Resetting settings never changes your progress. To erase progress, use “Reset progress” at the top.</p></div></div>`;
  $('#view').innerHTML=h;
}
function exportProgress(){
  const data={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k.startsWith('ps1-')) data[k]=localStorage.getItem(k);}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'psych-unit-1',saved:new Date().toISOString(),data},null,1)],{type:'application/json'}));
  a.download=`psych-unit-1-progress-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importProgress(file){
  const note=$('#dataNote');
  file.text().then(txt=>{
    const j=JSON.parse(txt), d=j&&j.app==='psych-unit-1'&&j.data;
    if(!d||typeof d!=='object'||!Object.keys(d).length||Object.entries(d).some(([k,v])=>!k.startsWith('ps1-')||typeof v!=='string')) throw 0;
    if(!confirm('Restore this backup? It replaces the progress saved in this browser.')) return;
    Object.entries(d).forEach(([k,v])=>localStorage.setItem(k,v));
    location.reload();
  }).catch(()=>{note.textContent='That file isn\'t a backup from this study kit. Nothing was changed.'});
}

/* ---------- Wiring ---------- */
function render(){renderTabs();renderChips();renderMeter();$('#chips').hidden=S.tab==='settings'||(S.tab==='quiz'&&!!(S.quiz&&S.quiz.test)); if(S.tab==='learn')renderLearn(); else if(S.tab==='guide')renderGuide(); else if(S.tab==='cards')renderCards(); else if(S.tab==='settings')renderSettings(); else renderQuiz();}
document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0]) importProgress(e.target.files[0]); else if(['tmc','ttf','tscen'].includes(e.target.id)) syncTestInputs();});
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.tab){S.tab=t.dataset.tab;store.set('ps1-tab2',S.tab);render();window.scrollTo({top:0});return}
  if(t.dataset.goto){S.tab=t.dataset.goto;store.set('ps1-tab2',S.tab);if(S.tab==='cards')S.fc=null;if(S.tab==='quiz')S.quiz=null;render();return}
  if(t.dataset.lesson!==undefined){startLesson(+t.dataset.lesson);return}
  if(t.dataset.lopt!==undefined){learnPick(+t.dataset.lopt);return}
  if(t.dataset.deck){S.deck=t.dataset.deck;store.set('ps1-deck',S.deck);S.fc=null;S.quiz=null;
    if(S.tab==='learn'&&S.deck!=='all'){const ls=LESSONS.map((l,i)=>i).filter(i=>LESSONS[i].d===S.deck);startLesson(ls.find(i=>!S.done.includes(i))??ls[0]);renderChips();return}
    render();return}
  if(t.dataset.act&&t.dataset.act.startsWith('l-')){
    const a=t.dataset.act;
    if(a==='l-map'){S.showMap=!S.showMap;renderLearn()}
    else if(a==='l-quiz'){beginLessonQuiz();window.scrollTo({top:0})}
    else if(a==='l-next'){nextLearnQ()}
    else if(a==='l-nextlesson'){startLesson(S.li+1)}
    else if(a==='l-redo'){startLesson(S.li)}
    else if(a==='l-final'){S.deck='all';store.set('ps1-deck','all');S.tab='quiz';store.set('ps1-tab2','quiz');render();startQuiz(40)}
    return;
  }
  if(t.dataset.tdeck||t.dataset.tset||(t.dataset.act||'').startsWith('t-')){
    if($('#tmc')) syncTestInputs();
    const T=S.test, a=t.dataset.act;
    if(t.dataset.tdeck){const id=t.dataset.tdeck; T.decks=T.decks.includes(id)?T.decks.filter(x=>x!==id):DECKS.map(d=>d.id).filter(x=>x===id||T.decks.includes(x))}
    else if(t.dataset.tset) T[t.dataset.tset]=JSON.parse(t.dataset.val);
    else if(a==='t-core') T.decks=DECKS.filter(d=>!d.opt).map(d=>d.id);
    else if(a==='t-every') T.decks=DECKS.map(d=>d.id);
    else if(a==='t-none') T.decks=[];
    else if(a==='t-start'){startTest();window.scrollTo({top:0});return}
    else if(a==='t-again'){startTest(S.quiz&&S.quiz.cfg);window.scrollTo({top:0});return}
    else if(a==='t-next'){testNav(1);return}
    else if(a==='t-back'){testNav(-1);return}
    else if(a==='t-finish'){finishTest();return}
    saveTest(); S.quizNote=''; renderQuiz(); return;
  }
  if(t.dataset.set){S.set[t.dataset.set]=JSON.parse(t.dataset.val);saveSet();applySet();S.fc=null;S.quiz=null;S.quizNote='';render();return}
  if(t.dataset.know){const id=t.dataset.know;setKnown(id,!S.known[id]);t.setAttribute('aria-pressed',!!S.known[id]);t.textContent=S.known[id]?'✓ Got it':'Got it?';return}
  if(t.dataset.quiz){startQuiz(+t.dataset.quiz);return}
  if(t.dataset.opt!==undefined){pick(+t.dataset.opt);return}
  const a=t.dataset.act;
  if(a==='flip'){S.fc.flipped=!S.fc.flipped;renderCards()}
  else if(a==='got')fcAnswer(true);
  else if(a==='learning')fcAnswer(false);
  else if(a==='shuffle'||a==='again'){S.fc=null;renderCards()}
  else if(a==='front'){S.fcFront=S.fcFront==='term'?'def':'term';store.set('ps1-front',S.fcFront);S.fc.flipped=false;renderCards()}
  else if(a==='only'||a==='pool-all'){S.set.fcPool=a==='pool-all'?'all':POOL_NEXT[S.set.fcPool];saveSet();S.fc=null;renderCards()}
  else if(a==='next'){S.quiz.i++;S.quiz.picked=null;renderQuiz();window.scrollTo({top:0})}
  else if(a==='retry'){startQuiz(0,S.retryIds)}
  else if(a==='newquiz'){S.quiz=null;renderQuiz()}
  else if(a==='exam'){startTest(examCfg(+t.dataset.n));window.scrollTo({top:0})}
  else if(a==='customquiz'){const n=Math.max(1,Math.min(200,parseInt($('#qcount').value,10)||15));store.set('ps1-qcount',n);startQuiz(n)}
  else if(a==='export')exportProgress();
  else if(a==='import')$('#importFile').click();
  else if(a==='defaults'){S.set=Object.assign({},DEF_SET);saveSet();applySet();S.fc=null;S.quiz=null;render()}
});
$('#reset').addEventListener('click',e=>{
  const b=e.currentTarget;
  if(b.dataset.confirm){S.known={};store.set('ps1-known',{});S.fc=null;S.done=[];S.miss={};S.li=0;S.L=null;store.set('ps1-done',[]);store.set('ps1-miss',{});store.set('ps1-li',0);b.textContent='Reset progress';delete b.dataset.confirm;render();}
  else{b.dataset.confirm='1';b.textContent='Tap again to confirm';setTimeout(()=>{if(b.dataset.confirm){delete b.dataset.confirm;b.textContent='Reset progress'}},3000)}
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea')) return;
  if(S.tab==='learn'&&S.L){
    const L=S.L;
    if(L.phase==='quiz'){
      const m={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3}[e.key.toLowerCase()];
      if(m!==undefined&&L.picked===null)learnPick(m);
      else if(e.key==='Enter'&&L.picked!==null){e.preventDefault();nextLearnQ()}
    }
    return;
  }
  if(S.tab==='cards'&&S.fc&&S.fc.q.length){
    if(e.code==='Space'){e.preventDefault();S.fc.flipped=!S.fc.flipped;renderCards()}
    else if(e.key==='1')fcAnswer(false); else if(e.key==='2')fcAnswer(true);
  } else if(S.tab==='quiz'&&S.quiz&&S.quiz.i<S.quiz.qs.length){
    const m={a:0,b:1,c:2,d:3,e:4,'1':0,'2':1,'3':2,'4':3,'5':4}[e.key.toLowerCase()];
    if(S.quiz.atEnd){
      if(m!==undefined)pick(m);
      else if(e.key==='Enter'){e.preventDefault();testNav(1)}
      else if(e.key==='ArrowLeft')testNav(-1);
    }
    else if(m!==undefined&&S.quiz.picked===null)pick(m);
    else if(e.key==='Enter'&&S.quiz.picked!==null){S.quiz.i++;S.quiz.picked=null;renderQuiz()}
  }
});
render();
</script>

</body></html>
